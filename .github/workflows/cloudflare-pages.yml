# 把站点部署到 Cloudflare Pages（对外用干净域名，不带 github.io）
#
# 工作原理：复用和 github.io 一样的 GitHub Pages 官方构建环境把 Jekyll
# 站点编译成静态文件，再用 wrangler 把成品 _site 目录直接上传给 Cloudflare。
# Cloudflare 只负责托管 + 挂域名，不在它那边跑 Ruby 构建，最省心也最稳。
#
# 上线前需要在后台做的一次性配置见仓库根目录 DEPLOY-CLOUDFLARE.md。
name: Deploy to Cloudflare Pages

on:
  # 和 github.io 保持一致：合并进 main 后自动重新部署
  push:
    branches: ["main"]
  # 也允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # 密钥还没配好时用来判断是否跳过上传（见下方 Publish 步骤）
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cloudflare 用根域名，baseurl 必须清空；url 换成对外的干净域名。
      # 只改这份 CI 检出的临时副本，不动仓库里的 _config.yml，
      # 所以 github.io 那套子路径部署完全不受影响。
      #
      # 现在 url 先指向免费的 winter-sam.pages.dev（已经不带 github.io）。
      # 等你绑好自定义域名后，把下面这行的域名换成你自己的即可。
      - name: Rewrite baseurl / url for Cloudflare
        run: |
          sed -i 's|^baseurl:.*|baseurl: ""|' _config.yml
          sed -i 's|^url:.*|url: "https://winter-sam.pages.dev"|' _config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # 只有配好 Cloudflare 密钥后才真正上传；没配之前自动跳过，
      # 工作流仍然显示绿色，不会一直报红。
      - name: Publish to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=winter-sam --branch=main
