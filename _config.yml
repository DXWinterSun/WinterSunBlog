# Social settings
social-chatgpt: chatgpt
social-newyear: newyear
social-sam: sam


# Newsletter
mailchimp: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e

# Google Analytics
google-analytics: # Add your identifier. For example UA-99631805-1

# Comment Section (Disqus)
disqus-identifier: mr-brown # Add your shortname for Disqus Comment. For example mr-brown

# Build settings
future: true
timezone: Asia/Shanghai
kramdown:
  auto_id_prefix: 'heading-'
  smart_quotes: ["apos", "apos", "quot", "quot"]
  toc_levels: 1..3

permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 7
paginate_path: "/page/:num/"

include:
  - _pages

sass:
  sass_dir: _sass
  style: compressed

# Exclude from processing.
# 仓库根的说明类 .md（含 {% %} / {{ }} 等 Liquid 示例文本）不能被 Jekyll 当页面渲染，
# 否则示例里的标签会被当成真标签解析、导致构建报 "tag was never closed" 而整站部署失败。
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - _archive
  - CLAUDE.md
  - DEPLOY-CLOUDFLARE.md
  - NEW-AU-INTAKE-TEMPLATE.md
  - README.md

gallery_images:
  - counting-stars.png
  - fair-fight.png
  - love-you-for-GC.PNG
  - GCwDuckie-illustration.PNG
  - christmas-tree.jpg
  - ice-and-sky.jpg