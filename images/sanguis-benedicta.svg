<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <linearGradient id="sb-bg" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1a1e30"/>
      <stop offset="42%" stop-color="#12162408"/>
      <stop offset="45%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <radialGradient id="sb-moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8eef6" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#bcc9dc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#bcc9dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sb-shaft" x1="78%" y1="8%" x2="34%" y2="92%">
      <stop offset="0%" stop-color="#dfe7f2" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#dfe7f2" stop-opacity="0.085"/>
      <stop offset="100%" stop-color="#dfe7f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sb-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6f6a63"/>
      <stop offset="26%" stop-color="#ece2d2"/>
      <stop offset="52%" stop-color="#b8ae9e"/>
      <stop offset="78%" stop-color="#efe6d7"/>
      <stop offset="100%" stop-color="#5d584f"/>
    </linearGradient>
    <linearGradient id="sb-blood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2454f"/>
      <stop offset="100%" stop-color="#6e1f26"/>
    </linearGradient>
    <radialGradient id="sb-chaliceglow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#b23a43" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#b23a43" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sb-floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b23a43" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b23a43" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sb-win"><path d="M636 320 L636 118 Q706 34 776 118 L776 320 Z"/></clipPath>
  </defs>

  <rect width="900" height="540" fill="url(#sb-bg)"/>

  <!-- 尖拱窗：窗外的夜与那一轮满月 -->
  <g clip-path="url(#sb-win)">
    <rect x="630" y="20" width="152" height="310" fill="#161b2c"/>
    <circle cx="706" cy="150" r="120" fill="url(#sb-moonglow)"/>
    <circle cx="706" cy="150" r="41" fill="#eef2f8"/>
    <circle cx="706" cy="150" r="41" fill="#dfe6f0" opacity="0.5"/>
    <circle cx="694" cy="140" r="6" fill="#cdd6e4" opacity="0.55"/>
    <circle cx="716" cy="161" r="8" fill="#cdd6e4" opacity="0.4"/>
    <circle cx="700" cy="167" r="4" fill="#cdd6e4" opacity="0.45"/>
    <g stroke="#0d1120" stroke-width="3" opacity="0.85">
      <line x1="706" y1="30" x2="706" y2="322"/>
      <line x1="632" y1="150" x2="780" y2="150"/>
      <line x1="632" y1="236" x2="780" y2="236"/>
    </g>
  </g>
  <path d="M636 320 L636 118 Q706 34 776 118 L776 320 Z"
        fill="none" stroke="#2b3145" stroke-width="5"/>
  <path d="M636 320 L636 118 Q706 34 776 118 L776 320 Z"
        fill="none" stroke="#454c66" stroke-width="1.2" opacity="0.7"/>

  <!-- 月光斜柱：落在圣爵上 -->
  <path d="M640 116 L784 116 L468 500 L214 500 Z" fill="url(#sb-shaft)"/>
  <path d="M700 116 L748 116 L432 500 L330 500 Z" fill="url(#sb-shaft)" opacity="0.55"/>

  <!-- 浮尘 -->
  <g fill="#e6ecf5">
    <circle cx="612" cy="186" r="1.6" opacity="0.5"/>
    <circle cx="566" cy="246" r="1.2" opacity="0.35"/>
    <circle cx="528" cy="200" r="1.9" opacity="0.42"/>
    <circle cx="596" cy="300" r="1.3" opacity="0.3"/>
    <circle cx="486" cy="268" r="1.5" opacity="0.38"/>
    <circle cx="452" cy="200" r="1.1" opacity="0.26"/>
    <circle cx="640" cy="356" r="1.7" opacity="0.3"/>
    <circle cx="392" cy="330" r="1.3" opacity="0.24"/>
    <circle cx="548" cy="388" r="1.5" opacity="0.26"/>
    <circle cx="336" cy="392" r="1.2" opacity="0.2"/>
    <circle cx="672" cy="248" r="1.1" opacity="0.34"/>
    <circle cx="500" cy="430" r="1.4" opacity="0.2"/>
  </g>

  <!-- 圣爵底下的血色辉光 -->
  <ellipse cx="392" cy="330" rx="150" ry="128" fill="url(#sb-chaliceglow)"/>
  <ellipse cx="392" cy="470" rx="132" ry="20" fill="url(#sb-floor)"/>

  <!-- ── 圣爵 Calix ── -->
  <g>
    <!-- 杯身 -->
    <path d="M340 300 L444 300 C444 300 438 366 392 372 C346 366 340 300 340 300 Z"
          fill="url(#sb-metal)" opacity="0.94"/>
    <!-- 杯口内圈与血面 -->
    <ellipse cx="392" cy="300" rx="52" ry="12" fill="#2a1116"/>
    <ellipse cx="392" cy="301" rx="45" ry="9.5" fill="url(#sb-blood)"/>
    <ellipse cx="392" cy="300.5" rx="45" ry="9.5" fill="#d4525c" opacity="0.28"/>
    <ellipse cx="378" cy="298" rx="12" ry="3" fill="#f0b9be" opacity="0.34"/>
    <!-- 杯口高光 -->
    <path d="M340 300 A52 12 0 0 1 444 300" fill="none" stroke="#f5ecdd" stroke-width="2.2" opacity="0.9"/>
    <!-- 柄与结 -->
    <path d="M383 372 L401 372 L401 400 L383 400 Z" fill="url(#sb-metal)" opacity="0.9"/>
    <ellipse cx="392" cy="396" rx="19" ry="11" fill="url(#sb-metal)"/>
    <ellipse cx="392" cy="393" rx="19" ry="6" fill="#f2e8d8" opacity="0.35"/>
    <path d="M386 414 L398 414 L398 434 L386 434 Z" fill="url(#sb-metal)" opacity="0.88"/>
    <!-- 底座 -->
    <path d="M338 462 C338 440 352 432 392 432 C432 432 446 440 446 462 Z"
          fill="url(#sb-metal)" opacity="0.92"/>
    <ellipse cx="392" cy="462" rx="54" ry="9" fill="url(#sb-metal)"/>
    <ellipse cx="392" cy="459" rx="54" ry="6" fill="#f2e8d8" opacity="0.28"/>
  </g>

  <!-- 杯沿那一滴，将落未落 -->
  <path d="M441 309 C447 316 447 324 441 328 C435 324 435 316 441 309 Z" fill="#b23a43"/>
  <path d="M441 311 C444 315 444 320 441 323 C438 320 438 315 441 311 Z" fill="#d95a63" opacity="0.75"/>
  <circle cx="443" cy="358" r="2.6" fill="#b23a43" opacity="0.6"/>
  <circle cx="444" cy="392" r="1.7" fill="#b23a43" opacity="0.35"/>

  <!-- 石地与暗角 -->
  <g stroke="#1c2132" stroke-width="1.2" opacity="0.5">
    <line x1="0" y1="486" x2="900" y2="486"/>
    <line x1="150" y1="486" x2="120" y2="540"/>
    <line x1="360" y1="486" x2="345" y2="540"/>
    <line x1="580" y1="486" x2="600" y2="540"/>
    <line x1="790" y1="486" x2="822" y2="540"/>
  </g>
  <rect width="900" height="540" fill="none"/>
  <path d="M0 0 L260 0 L0 300 Z" fill="#080a11" opacity="0.5"/>
  <path d="M900 540 L900 300 L620 540 Z" fill="#080a11" opacity="0.45"/>
  <path d="M0 540 L0 430 L160 540 Z" fill="#080a11" opacity="0.4"/>
</svg>
