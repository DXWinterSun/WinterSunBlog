{%- comment -%}
  🪑 书桌上的小物件（2026-10-14，Winter：「desk 是不是可以做一个整体的桌面的感觉，正好上面都是笔记本呢」）。
  全是装饰、读屏软件不念；位置和显隐由 _sass/5-components/_lobby.scss 的 .c-desk__thing--* 管。
  一只晴雪色的马克杯（冒热气）· 一支铅笔 · 一张便利贴 · 一枚回形针 · 一圈杯底印 · 一颗雪花镇纸。
{%- endcomment -%}
