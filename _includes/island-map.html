{%- comment -%}
  🏝️ 冬的岛屿的底图（2026-11-03，Winter 挑的「冬天的水彩雪岛」）：北边雪山、南边夏天的河、东西两片沙滩、中间一个小镇。
  只是一幅画（颜色写死，跟 Winter's 的封面一样当实物，不随「换个心情」变）；房子不画在这里，
  由 _pages/island/index.html 按 _data/island.yml 的 x / y 叠在上面。坐标是 1000 × 700。
  水彩的毛边靠 filter（isle-wc：噪声 + 位移 + 一点点模糊）；要改岛的轮廓只改 isle-shape 那一条。
{%- endcomment -%}
<svg class="c-isle__paint" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="冬的岛屿：北边雪山，南边一条河，中间一个小镇" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="isle-sea" cx="50%" cy="50%" r="72%">
      <stop offset="0" stop-color="#e6f3f9"/>
      <stop offset=".55" stop-color="#c8e4f1"/>
      <stop offset="1" stop-color="#97c6df"/>
    </radialGradient>
    <linearGradient id="isle-land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4edf3"/>
      <stop offset=".3" stop-color="#eef2f2"/>
      <stop offset=".62" stop-color="#e9efdd"/>
      <stop offset="1" stop-color="#d6e6c2"/>
    </linearGradient>
    <filter id="isle-wc" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation=".9"/>
    </filter>
    <filter id="isle-wc-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.6"/>
    </filter>
    <filter id="isle-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="isle-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .42  0 0 0 0 .5  0 0 0 .07 0"/>
    </filter>
    <path id="isle-shape" d="M250 140 C300 90 380 70 450 84 C500 60 560 66 600 90 C660 70 740 84 790 130 C840 160 882 220 862 280 C850 320 882 360 864 410 C846 470 820 520 772 560 C732 600 690 640 630 636 C590 650 560 640 530 650 C480 668 430 640 380 652 C320 668 250 640 210 590 C180 556 140 520 160 470 C172 440 140 420 150 380 C158 330 190 300 180 260 C172 210 210 170 250 140 Z"/>
    <symbol id="isle-pine" viewBox="0 0 20 28">
      <path d="M10 1 L18 22 H2 Z" fill="#5f8c8c"/>
      <path d="M10 1 L14.5 12 L11.5 10.5 L10 13 L8.5 10.5 L5.5 12 Z" fill="#ffffff"/>
      <rect x="9" y="22" width="2" height="5" fill="#7b6a58"/>
    </symbol>
    <symbol id="isle-tree" viewBox="0 0 20 26">
      <circle cx="10" cy="10" r="9" fill="#9cc79a"/>
      <circle cx="7" cy="8" r="4" fill="#b7d8ad"/>
      <rect x="9" y="17" width="2" height="8" fill="#8a7559"/>
    </symbol>
  </defs>

  <!-- 海 -->
  <rect width="1000" height="700" fill="url(#isle-sea)"/>
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M70 120 q14 -8 28 0 q14 8 28 0"/><path d="M880 90 q12 -7 24 0 q12 7 24 0"/>
    <path d="M90 600 q14 -8 28 0 q14 8 28 0"/><path d="M820 640 q12 -7 24 0 q12 7 24 0"/>
    <path d="M60 380 q10 -6 20 0 q10 6 20 0"/><path d="M930 420 q10 -6 20 0 q10 6 20 0"/>
  </g>

  <!-- 浅水那一圈 -->
  <use href="#isle-shape" fill="none" stroke="#e2f2f8" stroke-width="46" filter="url(#isle-blur)" opacity=".9"/>

  <!-- 岛 -->
  <g filter="url(#isle-wc)">
    <use href="#isle-shape" fill="url(#isle-land)" stroke="#86b6cd" stroke-width="3" stroke-opacity=".7"/>
    <!-- 东边的沙滩 -->
    <path d="M850 236 C870 284 856 330 864 384 C870 424 850 472 822 512 C836 470 848 430 846 392 C842 340 854 292 838 252 Z" fill="#f1e2bf" opacity=".95"/>
    <!-- 西边的沙滩 -->
    <path d="M178 300 C162 340 152 372 158 404 C162 440 152 474 174 520 C178 480 180 444 176 410 C172 372 184 334 178 300 Z" fill="#f1e2bf" opacity=".95"/>
    <!-- 南边河口的沙滩 -->
    <path d="M468 646 C510 636 568 634 614 640 C580 652 520 656 468 646 Z" fill="#f1e2bf"/>
  </g>

  <!-- 南边：夏天的一片绿 -->
  <ellipse cx="420" cy="560" rx="190" ry="70" fill="#c9e0b4" opacity=".55" filter="url(#isle-wc-soft)"/>
  <ellipse cx="640" cy="540" rx="120" ry="60" fill="#cfe4ba" opacity=".5" filter="url(#isle-wc-soft)"/>

  <!-- 北边的雪山 -->
  <g filter="url(#isle-wc)">
    <path d="M330 268 L392 196 L446 268 Z" fill="#c9d6e1"/>
    <path d="M520 266 L582 180 L640 266 Z" fill="#c3d1dd"/>
    <path d="M396 270 L472 132 L552 272 Z" fill="#b3c4d4"/>
    <path d="M448 176 L472 132 L497 178 L485 171 L474 186 L462 171 Z" fill="#ffffff"/>
    <path d="M568 199 L582 180 L597 202 L589 197 L582 207 L575 197 Z" fill="#ffffff"/>
    <path d="M380 210 L392 196 L405 213 L398 209 L392 217 L386 209 Z" fill="#ffffff"/>
  </g>
  <g>
    <use href="#isle-pine" x="300" y="226" width="16" height="22"/><use href="#isle-pine" x="318" y="244" width="18" height="25"/>
    <use href="#isle-pine" x="618" y="236" width="16" height="22"/><use href="#isle-pine" x="642" y="254" width="18" height="25"/>
    <use href="#isle-pine" x="268" y="270" width="16" height="22"/><use href="#isle-pine" x="676" y="274" width="16" height="22"/>
    <use href="#isle-pine" x="360" y="282" width="15" height="20"/><use href="#isle-pine" x="590" y="286" width="15" height="20"/>
    <use href="#isle-pine" x="236" y="200" width="15" height="20"/><use href="#isle-pine" x="704" y="206" width="15" height="20"/>
    <use href="#isle-pine" x="420" y="296" width="14" height="19"/><use href="#isle-pine" x="560" y="300" width="14" height="19"/>
    <use href="#isle-pine" x="740" y="160" width="14" height="19"/><use href="#isle-pine" x="280" y="160" width="14" height="19"/>
  </g>

  <!-- 河：从雪山脚下一路流到南边河口 -->
  <g filter="url(#isle-wc)" fill="none" stroke-linecap="round">
    <path d="M500 262 C522 318 468 352 492 416 C510 466 446 506 456 556 C464 596 516 610 540 638" stroke="#8cc3df" stroke-width="12"/>
    <path d="M500 262 C522 318 468 352 492 416 C510 466 446 506 456 556 C464 596 516 610 540 638" stroke="#cde7f3" stroke-width="4"/>
  </g>
  <!-- 单车道的小桥 -->
  <g transform="rotate(-24 455 548)">
    <rect x="433" y="542" width="46" height="11" rx="2" fill="#b08b62"/>
    <path d="M435 545 h42 M435 550 h42" stroke="#8a6a46" stroke-width="1"/>
  </g>

  <!-- 小镇：几条土路在河边交汇 -->
  <g fill="none" stroke="#bfa47c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" opacity=".9">
    <path d="M300 430 C370 414 430 406 486 402 C546 398 606 412 668 444"/>
    <path d="M496 300 C488 340 496 372 490 402 C486 432 470 470 460 522"/>
    <path d="M486 402 C520 440 560 470 600 520"/>
  </g>

  <!-- 南边的树 -->
  <g>
    <use href="#isle-tree" x="350" y="520" width="16" height="21"/><use href="#isle-tree" x="372" y="540" width="18" height="23"/>
    <use href="#isle-tree" x="520" y="520" width="16" height="21"/><use href="#isle-tree" x="610" y="510" width="18" height="23"/>
    <use href="#isle-tree" x="300" y="500" width="15" height="20"/><use href="#isle-tree" x="690" y="500" width="16" height="21"/>
    <use href="#isle-tree" x="250" y="440" width="15" height="20"/><use href="#isle-tree" x="740" y="430" width="15" height="20"/>
    <use href="#isle-tree" x="410" y="590" width="15" height="20"/><use href="#isle-tree" x="560" y="560" width="16" height="21"/>
    <use href="#isle-tree" x="660" y="560" width="15" height="20"/><use href="#isle-tree" x="270" y="560" width="16" height="21"/>
    <use href="#isle-tree" x="230" y="400" width="14" height="18"/><use href="#isle-tree" x="760" y="480" width="14" height="18"/>
  </g>

  <!-- 码头：抖出来的人从这里上岸 -->
  <g>
    <rect x="636" y="610" width="12" height="62" rx="2" fill="#a88560"/>
    <path d="M638 620 h8 M638 634 h8 M638 648 h8 M638 662 h8" stroke="#866646" stroke-width="1.2"/>
    <text x="656" y="668" class="c-isle__lbl">码头</text>
  </g>

  <!-- 一只小帆船 -->
  <g transform="translate(92 470)">
    <path d="M0 18 h34 l-6 8 h-22 Z" fill="#b08b62"/><path d="M17 0 v18" stroke="#6b5640" stroke-width="1.4"/>
    <path d="M18 2 L32 16 H18 Z" fill="#ffffff" stroke="#9fb6c6" stroke-width=".8"/>
  </g>

  <!-- 指南针 -->
  <g transform="translate(910 610)">
    <circle r="30" fill="#f7f4ec" opacity=".85" stroke="#8fb4c9" stroke-width="1.5"/>
    <path d="M0 -24 L6 0 L0 24 L-6 0 Z" fill="#c9d6e1"/><path d="M0 -24 L6 0 L-6 0 Z" fill="#d79a4a"/>
    <text y="-32" text-anchor="middle" class="c-isle__lbl">北</text>
  </g>

  <!-- 角上的名牌 -->
  <g transform="translate(40 36)">
    <rect width="214" height="62" rx="6" fill="#fbf8f1" opacity=".92" stroke="#bcd3e0"/>
    <text x="18" y="30" class="c-isle__ttl">冬的岛屿</text>
    <text x="18" y="50" class="c-isle__sub">WINTER'S ISLAND · 面积：无限</text>
  </g>

  <!-- 纸纹 -->
  <rect width="1000" height="700" filter="url(#isle-grain)"/>
</svg>
