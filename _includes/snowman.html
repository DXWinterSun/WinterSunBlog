{%- comment -%}
  小雪人 ⛄ —— Winter 2026-09-23 点名要的。戳一下他会抖、帽子会飞起来
  （交互在 js/snow.js 的 snowmen()，样式在 _sass/5-components/_winter.scss）。
  用法：{% include snowman.html size="small" %} / size="big"（404 页那只）
{%- endcomment -%}
<button class="c-snowman c-snowman--{{ include.size | default: 'small' }}" type="button"
        aria-label="戳一下雪人" title="戳一下">
  <svg viewBox="0 0 66 80" fill="none" aria-hidden="true" focusable="false">
    <g class="c-snowman__hat">
      <path d="M23 21h20v-9a2 2 0 0 0-2-2H25a2 2 0 0 0-2 2z" fill="currentColor"/>
      <rect x="17" y="20" width="32" height="4" rx="2" fill="currentColor"/>
      <rect x="23" y="15" width="20" height="3" class="c-snowman__band"/>
    </g>
    <circle cx="33" cy="35" r="13" class="c-snowman__ball"/>
    <circle cx="33" cy="59" r="17" class="c-snowman__ball"/>
    <circle cx="28.5" cy="33" r="1.9" fill="currentColor"/>
    <circle cx="37.5" cy="33" r="1.9" fill="currentColor"/>
    <path d="M33 36l8 2.5-8 2z" class="c-snowman__nose"/>
    <path d="M28 41.5q5 3.5 10 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M19 55l-11-7M47 55l11-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="33" cy="54" r="1.7" class="c-snowman__button"/>
    <circle cx="33" cy="61" r="1.7" class="c-snowman__button"/>
    <circle cx="33" cy="68" r="1.7" class="c-snowman__button"/>
  </svg>
</button>
