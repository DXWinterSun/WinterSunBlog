/* ── Max possible scores per dimension ─ */
const MAX_SCORES = { guile:17, forbear:19, chaos:18, raw:18, romance:17, grace:13 };

/* ── Match algorithm ────────────────────────────────────────── */
function findMatch(userScores) {
  const dims = Object.keys(MAX_SCORES);
  // normalize user scores to 0-10
  const normalized = {};
  dims.forEach(d => {
    normalized[d] = Math.min(10, (userScores[d] / MAX_SCORES[d]) * 10);
  });
  let best = null, bestDist = Infinity;
  CHARS.forEach(c => {
    const dist = Math.sqrt(
      dims.reduce((sum, d) => sum + Math.pow((normalized[d] || 0) - c.profile[d], 2), 0)
    );
    if (dist < bestDist) { bestDist = dist; best = c; }
  });
  return { char: best, dist: bestDist, normalized };
}

function getTop3(userScores) {
  const dims = Object.keys(MAX_SCORES);
  const normalized = {};
  dims.forEach(d => {
    normalized[d] = Math.min(10, (userScores[d] / MAX_SCORES[d]) * 10);
  });
  const ranked = CHARS.map(c => ({
    char: c,
    dist: Math.sqrt(dims.reduce((sum, d) => sum + Math.pow((normalized[d]||0)-c.profile[d],2), 0))
  })).sort((a,b) => a.dist - b.dist);
  return ranked.slice(0,3).map(r => r.char);
}

/* ── Radar SVG ──────────────────────────────────────────────── */
const DIMS = [
  {key:"guile",   cn:"狡黠", en:"GUILE"},
  {key:"forbear", cn:"隐忍", en:"FORBEAR"},
  {key:"chaos",   cn:"疯狂", en:"CHAOS"},
  {key:"raw",     cn:"璞真", en:"RAW"},
  {key:"romance", cn:"浪漫", en:"ROMANCE"},
  {key:"grace",   cn:"优雅", en:"GRACE"},
];

function Radar({ profile, accent, muted, text, size = 260 }) {
  const cx = size / 2, cy = size / 2, maxR = 80, labelR = 108;
  function pt(val, i) {
    const a = (Math.PI*2*i/6) - Math.PI/2;
    return { x: cx + (val/10)*maxR*Math.cos(a), y: cy + (val/10)*maxR*Math.sin(a) };
  }
  function labelPt(i) {
    const a = (Math.PI*2*i/6) - Math.PI/2;
    return { x: cx + labelR*Math.cos(a), y: cy + labelR*Math.sin(a) };
  }
  const pts = DIMS.map((d,i) => pt(profile[d.key],i));
  const pathD = pts.map((p,i) => (i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")+" Z";
  const gridLevels = [2.5, 5, 7.5, 10];
  return (
    <svg viewBox={"0 0 "+size+" "+size} style={{width:"100%",maxWidth:size+"px",display:"block",margin:"0 auto"}}>
      {gridLevels.map((lv,gi) => {
        const gd = DIMS.map((_,i) => { const p=pt(lv,i); return (i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1); }).join(" ")+" Z";
        return <path key={gi} d={gd} fill="none" stroke={muted}
          strokeOpacity={gi===3?0.35:0.12} strokeWidth="0.6"/>;
      })}
      {DIMS.map((_,i) => { const p=pt(10,i); return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y}
        stroke={muted} strokeOpacity={0.18} strokeWidth="0.5"/>; })}
      <path d={pathD} fill={accent} fillOpacity="0.2" stroke={accent} strokeOpacity="0.75" strokeWidth="1.5"/>
      {pts.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={accent}/>)}
      {DIMS.map((d,i) => {
        const lp = labelPt(i);
        return (
          <g key={i}>
            <text x={lp.x} y={lp.y-4} textAnchor="middle" fontSize="8"
              fontFamily="'Special Elite',monospace" fill={muted} letterSpacing="1.5">{d.en}</text>
            <text x={lp.x} y={lp.y+9} textAnchor="middle" fontSize="11"
              fontFamily="'Noto Serif SC',serif" fontWeight="500" fill={text}>{d.cn}</text>
          </g>
        );
      })}
    </svg>
  );
}

          <button onClick={() => setShowAlt(!showAlt)} style={{
            background:"transparent", border:"none", padding:"0 0 8px",
            fontFamily:"'Special Elite',monospace", letterSpacing:"0.15em",
            fontSize:"0.65rem", color:c.muted, cursor:"pointer",
            display:"flex", alignItems:"center", gap:8
          }}>
            <span style={{
              display:"inline-block", transform: showAlt?"rotate(90deg)":"rotate(0deg)",
              transition:"transform 0.2s"
            }}>▶</span>
            RUNNER-UPS
          </button>
          {showAlt && (
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:4}}>
              {top3.slice(1).map(rc => (
                <div key={rc.id} style={{
                  border:`1px solid ${rc.accent}44`,
                  padding:"14px 18px", borderRadius:2
                }}>
                  <p style={{
                    fontFamily:"'Special Elite',monospace",fontSize:"0.6rem",
                    letterSpacing:"0.15em",color:rc.muted,margin:"0 0 4px"
                  }}>{rc.year}</p>
                  <p style={{
                    fontFamily:"'Playfair Display',serif",fontStyle:"italic",
                    fontSize:"1rem",color:rc.accent,margin:"0 0 4px",fontWeight:700
                  }}>{rc.name}</p>
                  <p style={{fontSize:"0.78rem",color:c.muted,margin:0,fontStyle:"italic"}}>
                    {rc.filmCN}
                  </p>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Links */}
        <div style={{
          display:"flex", gap:16, flexWrap:"wrap", marginTop:44,
          opacity: phase>=3?1:0, transition:"opacity 0.5s 0.9s"
        }}>
          <a href={"/WinterSunBlog/sam/many-faces/#"+c.id} style={{
            border:`1px solid ${c.accent}`,
            color:c.accent, padding:"12px 28px",
            fontFamily:"'Special Elite',monospace", fontSize:"0.75rem",
            letterSpacing:"0.15em", textDecoration:"none",
            transition:"all 0.2s"
          }}
            onMouseEnter={e=>{ e.currentTarget.style.background=c.accent; e.currentTarget.style.color=c.bg; }}
            onMouseLeave={e=>{ e.currentTarget.style.background="transparent"; e.currentTarget.style.color=c.accent; }}
          >
            READ HIS STORY →
          </a>
          <button onClick={onRetake} style={{
            background:"transparent", border:`1px solid ${c.muted}66`,
            color:c.muted, padding:"12px 28px",
            fontFamily:"'Special Elite',monospace", fontSize:"0.75rem",
            letterSpacing:"0.15em", cursor:"pointer", transition:"all 0.2s"
          }}
            onMouseEnter={e=>{ e.currentTarget.style.borderColor=c.muted; e.currentTarget.style.color=c.text; }}
            onMouseLeave={e=>{ e.currentTarget.style.borderColor=c.muted+"66"; e.currentTarget.style.color=c.muted; }}
          >
            RETAKE
          </button>
        </div>

      </div>

      {/* Responsive grid style */}
      <style>{`
        @media (max-width: 520px) {
          .result-grid { grid-template-columns: 1fr !important; }
        }
      `}</style>
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────── */
function App() {
  const [stage, setStage] = useState("intro"); // intro | quiz | result
  const [qIdx, setQIdx]   = useState(0);
  const [scores, setScores] = useState({guile:0,forbear:0,chaos:0,raw:0,romance:0,grace:0});

  function startQuiz() {
    setQIdx(0);
    setScores({guile:0,forbear:0,chaos:0,raw:0,romance:0,grace:0});
    setStage("quiz");
  }

  function handleAnswer(score) {
    const updated = {...scores};
    Object.keys(score).forEach(k => { updated[k] = (updated[k]||0) + score[k]; });
    setScores(updated);
    if (qIdx + 1 >= QUESTIONS.length) {
      setStage("result");
    } else {
      setQIdx(qIdx + 1);
    }
  }

  if (stage === "intro")  return <Intro onStart={startQuiz}/>;
  if (stage === "quiz")   return <QuestionScreen qIdx={qIdx} answers={scores} onAnswer={handleAnswer}/>;
  if (stage === "result") return <ResultScreen scores={scores} onRetake={startQuiz}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
