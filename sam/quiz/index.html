/* ── Compute max possible char score ──────────────────────────── */
const MAX_CHAR_SCORES = {};
CHARS.forEach(c => {
  let total = 0;
  QUESTIONS.forEach(q => {
    let best = 0;
    q.opts.forEach(opt => { best = Math.max(best, opt.chars[c.id] || 0); });
    total += best;
  });
  MAX_CHAR_SCORES[c.id] = total || 1;
});

/* ── Match algorithm ─────────────────────────────────────────────
   Rank by RAW accumulated character affinity (every character has an
   even point budget across the 20 questions, so raw totals are fair —
   no per-character normalization, which used to hand victory to the
   characters who appeared in the fewest options). Ties (common with
   small integer totals) break on how close the user's 6-axis profile
   sits to the character's own profile (cosine). ─────────────────── */
const PROFILE_KEYS = ["guile","forbear","chaos","raw","romance","grace"];
function getMatches(charScores, dimScores) {
  const u = {};
  PROFILE_KEYS.forEach(k => { u[k] = Math.min(10, ((dimScores[k]||0) / (DIM_MAX[k]||1)) * 10); });
  function cosine(c) {
    let dot = 0, nu = 0, nc = 0;
    PROFILE_KEYS.forEach(k => { const uv = u[k], cv = c.profile[k]||0; dot += uv*cv; nu += uv*uv; nc += cv*cv; });
    return dot / (Math.sqrt(nu*nc) || 1);
  }
  return CHARS.map(c => ({
    char: c,
    score: charScores[c.id] || 0,
    ratio: (charScores[c.id] || 0) / MAX_CHAR_SCORES[c.id],
    cos: cosine(c)
  })).sort((a, b) => (b.score - a.score) || (b.cos - a.cos));
}

/* ── Radar ────────────────────────────────────────────────────── */
const DIMS = [
  {key:"guile",   cn:"狡黠", en:"GUILE"},
  {key:"forbear", cn:"隐忍", en:"FORBEAR"},
  {key:"chaos",   cn:"疯狂", en:"CHAOS"},
  {key:"raw",     cn:"璞真", en:"RAW"},
  {key:"romance", cn:"浪漫", en:"ROMANCE"},
  {key:"grace",   cn:"优雅", en:"GRACE"},
];
const DIM_MAX = { guile:0, forbear:0, chaos:0, raw:0, romance:0, grace:0 };
QUESTIONS.forEach(q => {
  const best = {};
  q.opts.forEach(opt => {
    Object.keys(opt.dims).forEach(k => { best[k] = Math.max(best[k]||0, opt.dims[k]||0); });
  });
  Object.keys(best).forEach(k => { DIM_MAX[k] = (DIM_MAX[k]||0) + best[k]; });
});

function Radar({ dimScores, charProfile, accent, muted, text, size=240 }) {
  const cx = size/2, cy = size/2, maxR = 76, labelR = 104;
  function ptAt(val, i, r) {
    const a = (Math.PI*2*i/6) - Math.PI/2;
    return { x: cx + (val/10)*r*Math.cos(a), y: cy + (val/10)*r*Math.sin(a) };
  }
  function labelPt(i) {
    const a = (Math.PI*2*i/6) - Math.PI/2;
    return { x: cx + labelR*Math.cos(a), y: cy + labelR*Math.sin(a) };
  }
  const normalized = {};
  DIMS.forEach(d => {
    normalized[d.key] = Math.min(10, ((dimScores[d.key]||0) / (DIM_MAX[d.key]||1)) * 10);
  });
  const userPts = DIMS.map((d,i) => ptAt(normalized[d.key],i,maxR));
  const userPath = userPts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")+" Z";

  let charPts = null, charPath = null;
  if (charProfile) {
    charPts = DIMS.map((d,i) => ptAt(charProfile[d.key]||0, i, maxR));
    charPath = charPts.map((p,i)=>(i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ")+" Z";
  }

  const gridLevels = [2.5, 5, 7.5, 10];
  return (
    <svg viewBox={"0 0 "+size+" "+size} style={{width:"100%",maxWidth:size+"px",display:"block",margin:"0 auto"}}>
      {gridLevels.map((lv,gi) => {
        const gd = DIMS.map((_,i)=>{ const p=ptAt(lv,i,maxR); return (i===0?"M":"L")+p.x.toFixed(1)+" "+p.y.toFixed(1); }).join(" ")+" Z";
        return <path key={gi} d={gd} fill="none" stroke={muted} strokeOpacity={gi===3?0.35:0.12} strokeWidth="0.6"/>;
      })}
      {DIMS.map((_,i)=>{ const p=ptAt(10,i,maxR); return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke={muted} strokeOpacity={0.18} strokeWidth="0.5"/>; })}
      {charPath && <path d={charPath} fill={accent} fillOpacity="0.08" stroke={accent} strokeOpacity="0.25" strokeWidth="1" strokeDasharray="3 2"/>}
      <path d={userPath} fill={accent} fillOpacity="0.22" stroke={accent} strokeOpacity="0.8" strokeWidth="1.5"/>
      {userPts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="2.5" fill={accent}/>)}
      {DIMS.map((d,i)=>{
        const lp = labelPt(i);
        return (
          <g key={i}>
            <text x={lp.x} y={lp.y-4} textAnchor="middle" fontSize="7.5" fontFamily="'Special Elite',monospace" fill={muted} letterSpacing="1.5">{d.en}</text>
            <text x={lp.x} y={lp.y+9} textAnchor="middle" fontSize="10.5" fontFamily="'Noto Serif SC',serif" fontWeight="500" fill={text}>{d.cn}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ── Block segmentation (for the module progress bar) ──────────── */
const BLOCK_IDS = [...new Set(QUESTIONS.map(q => q.block))];
const BLOCK_RANGES = BLOCK_IDS.map(bn => {
  const idxs = QUESTIONS.map((q,i)=>({q,i})).filter(x=>x.q.block===bn).map(x=>x.i);
  return { block: bn, start: idxs[0], count: idxs.length };
});

/* ── Question screen ──────────────────────────────────────────── */
function QuestionScreen({ qIdx, onAnswer, onBack, canGoBack, palette, onShuffle }) {
  const [selected, setSelected] = useState(null);
  const [leaving, setLeaving] = useState(false);
  const p = palette;
  const q = QUESTIONS[qIdx];
  const pct = (qIdx / QUESTIONS.length) * 100;
  const isNewBlock = qIdx === 0 || QUESTIONS[qIdx-1].block !== q.block;

  useEffect(() => { setSelected(null); setLeaving(false); }, [qIdx]);

  function choose(i) {
    if (selected !== null) return;
    setSelected(i);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch(e) {}
    setTimeout(() => {
      setLeaving(true);
      setTimeout(() => onAnswer(q.opts[i]), 240);
    }, 360);
  }

  return (
    <div style={{
      minHeight:"100vh", display:"flex", flexDirection:"column",
      background:p.bg, transition:"background 0.6s ease"
    }}>
      {/* ── Sticky header ── */}

        {/* segmented module progress — one segment per block */}
        <div style={{display:"flex", gap:3, padding:"0"}}>
          {BLOCK_RANGES.map(br => {
            const frac = Math.max(0, Math.min(1, (qIdx - br.start) / br.count));
            return (
              <div key={br.block} style={{
                flex:br.count, height:"2px", background:p.muted+"33",
                position:"relative", overflow:"hidden"
              }}>
                <div style={{
                  position:"absolute", left:0, top:0, height:"100%",
                  width:(frac*100)+"%", background:p.accent,
                  transition:"width 0.4s ease, background 0.6s ease"
                }}/>
              </div>
            );
          })}

        <div style={{
          padding:"10px 20px", display:"flex",
          justifyContent:"space-between", alignItems:"center",
          borderBottom:`1px solid ${p.accent}18`
        }}>
          <button
            onClick={onBack}

            style={{
              background:"none", border:"none", padding:"4px 0",
              color: canGoBack ? p.muted : p.muted+"55",
              fontFamily:"'Special Elite',monospace", fontSize:"0.7rem",

              transition:"color 0.2s", minWidth:56

            fontFamily:"'Special Elite',monospace", fontSize:"0.72rem",

        </div>
      </div>

      {/* ── Question content ── */}
      <div key={qIdx} style={{

        alignItems:"center", justifyContent:"flex-start",
        padding:"clamp(32px,10vh,110px) 24px 52px", maxWidth:680, margin:"0 auto", width:"100%",
        opacity: leaving ? 0 : 1,

            return (
              <button key={i} onClick={() => choose(i)} className="q-opt" style={{
                display:"flex", alignItems:"flex-start", gap:12,

      </div>
      <style>{`
        @keyframes qEnter { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }

    </div>
  );
}

                    </div>
                    <div style={{position:"relative",height:5,background:c.muted+"28",borderRadius:3}}>
                      {/* 你 — solid accent fill */}
                      <div style={{
                        position:"absolute",left:0,top:0,height:"100%",
                        background:c.accent,borderRadius:3,
                        width:(u/10*100)+"%",
                        transition:"width 1.1s ease"
                      }}/>
                      {/* 他 — benchmark tick */}
                      <div style={{
                        position:"absolute", top:-2, height:9, width:2,
                        left:"calc("+(h/10*100)+"% - 1px)",
                        background:c.text, opacity:0.85, borderRadius:1
                      }}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* ── Color card ── */}
        <div style={{
          marginTop:40, opacity: phase>=3?1:0, transition:"opacity 0.45s 0.55s"
        }}>
          <div style={{
            display:"flex", justifyContent:"space-between", alignItems:"baseline",
            marginBottom:12, flexWrap:"wrap", gap:6
          }}>
            <p style={{
              fontFamily:"'Special Elite',monospace", letterSpacing:"0.15em",
              fontSize:"0.62rem", color:c.muted, margin:0
            }}>他的色卡 · COLOR CARD</p>
            <span style={{
              fontFamily:"'Playfair Display',serif", fontStyle:"italic",
              fontSize:"0.9rem", color:c.accent
            }}>{c.accentCN} × {c.bgCN}</span>
          </div>
          <ColorCard char={c}/>
        </div>

        {/* ── Divider ── */}
        <div style={{
          height:1, background:c.accent, opacity: phase>=3?0.12:0,
          margin:"40px 0", transition:"opacity 0.45s 0.65s"
        }}/>

        {/* ── Facets: you are more than one side ── */}
        <div style={{opacity:phase>=3?1:0,transition:"opacity 0.45s 0.72s"}}>
          <p style={{
            fontFamily:"'Special Elite',monospace", letterSpacing:"0.15em",
            fontSize:"0.63rem", color:c.muted, margin:"0 0 4px"
          }}>YOU ARE MORE THAN ONE · 你不止一面</p>
          <p style={{
            fontSize:"0.82rem", color:c.muted, margin:"0 0 20px",
            fontStyle:"italic", lineHeight:1.75, opacity:0.85, maxWidth:520
          }}>
            {c.name} 是最戳你的那个人，但你身上还有别的侧面——每一面都有一个人，正好接住它。
          </p>

          <div style={{display:"flex", flexDirection:"column", gap:10}} className="facet-list">
            {facets.map(({dim, char:fc}) => (
              <a key={dim.key}
                href={"/WinterSunBlog/sam/many-faces/#"+fc.id}
                target="_blank" rel="noopener"
                style={{
                  display:"block", border:`1px solid ${fc.accent}33`,
                  padding:"15px 18px", borderRadius:2, textDecoration:"none",
                  transition:"border-color 0.18s, background 0.18s"
                }}
                onMouseEnter={e=>{ e.currentTarget.style.borderColor=fc.accent+"66"; e.currentTarget.style.background=fc.accent+"08"; }}
                onMouseLeave={e=>{ e.currentTarget.style.borderColor=fc.accent+"33"; e.currentTarget.style.background="transparent"; }}
              >
                <div style={{display:"flex", alignItems:"baseline", gap:9, marginBottom:7, flexWrap:"wrap"}}>
                  <span style={{
                    fontFamily:"'Noto Serif SC',serif", fontSize:"0.92rem",
                    fontWeight:600, color:fc.accent
                  }}>你的「{dim.cn}」那一面</span>
                  <span style={{
                    fontFamily:"'Special Elite',monospace", fontSize:"0.6rem",
                    color:c.muted, letterSpacing:"0.1em", opacity:0.7
                  }}>{dim.en}</span>
                </div>
                <p style={{
                  fontSize:"0.8rem", color:c.text, opacity:0.82,
                  margin:"0 0 10px", lineHeight:1.7
                }}>{FACET_POINT[dim.key]}</p>
                <div style={{display:"flex", alignItems:"baseline", gap:8, flexWrap:"wrap"}}>
                  <span style={{fontSize:"0.8rem", color:c.muted, opacity:0.75}}>这一面，最像</span>
                  <span style={{
                    fontFamily:"'Playfair Display',serif", fontStyle:"italic",
                    fontSize:"1rem", color:fc.accent, fontWeight:700
                  }}>{fc.name}</span>
                  <span style={{
                    fontFamily:"'Special Elite',monospace", fontSize:"0.58rem",
                    color:c.muted, letterSpacing:"0.08em", opacity:0.6
                  }}>{fc.filmCN}</span>
                </div>
                <p style={{
                  fontSize:"0.78rem", color:c.muted, margin:"5px 0 0",
                  fontStyle:"italic", lineHeight:1.6, opacity:0.85
                }}>{fc.tagline}</p>
              </a>
            ))}
          </div>
        </div>

        {/* ── Your path (answered questions) ── */}
        <div style={{marginTop:34, opacity: phase>=3?1:0, transition:"opacity 0.45s 0.78s"}}>
          <button onClick={() => setShowPath(!showPath)} style={{
            background:"transparent", border:"none", padding:"0 0 12px",
            fontFamily:"'Special Elite',monospace", letterSpacing:"0.15em",
            fontSize:"0.63rem", color:c.muted, cursor:"pointer",
            display:"flex", alignItems:"center", gap:8
          }}>
            <span style={{
              display:"inline-block",
              transform: showPath?"rotate(90deg)":"rotate(0deg)",
              transition:"transform 0.2s", fontSize:"0.55rem"
            }}>▶</span>
            你的选择 · 回顾这 {answers.length} 步
          </button>

          {showPath && (
            <div style={{display:"flex", flexDirection:"column"}}>
              {QUESTIONS.map((qq, qi) => {
                const chosen = answers[qi];
                if (!chosen) return null;
                const li = qq.opts.indexOf(chosen);
                return (
                  <div key={qi} style={{
                    padding:"13px 0",
                    borderTop: qi>0 ? `1px solid ${c.muted}1e` : `1px solid ${c.muted}1e`
                  }}>
                    <div style={{display:"flex", alignItems:"baseline", gap:9, marginBottom:6}}>
                      <span style={{
                        fontFamily:"'Special Elite',monospace", fontSize:"0.58rem",
                        color:c.muted, letterSpacing:"0.06em", opacity:0.7,
                        flexShrink:0, minWidth:26
                      }}>Q{qi+1}</span>
                      <span style={{
                        fontFamily:"'Playfair Display',serif", fontStyle:"italic",
                        fontSize:"0.85rem", color:c.text, lineHeight:1.55, opacity:0.82
                      }}>{qq.q}</span>
                    </div>
                    <div style={{display:"flex", alignItems:"baseline", gap:9, paddingLeft:35}}>
                      <span style={{
                        fontFamily:"'Special Elite',monospace", fontSize:"0.56rem",
                        color:c.accent, letterSpacing:"0.1em", flexShrink:0
                      }}>{String.fromCharCode(65 + (li<0?0:li))}</span>
                      <span style={{
                        fontFamily:"'Noto Serif SC',serif", fontSize:"0.82rem",
                        color:c.accent, lineHeight:1.6
                      }}>
                        {chosen.text}
                        {chosen.lineCN && (
                          <span style={{
                            display:"block", fontSize:"0.74rem", color:c.muted,
                            fontStyle:"italic", marginTop:3, lineHeight:1.5
                          }}>{chosen.lineCN}</span>
                        )}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── Action buttons ── */}
        <div style={{
          display:"flex", gap:10, flexWrap:"wrap", marginTop:44,
          opacity:phase>=3?1:0, transition:"opacity 0.45s 0.85s"
        }}>
          <a href={"/WinterSunBlog/sam/many-faces/#"+c.id} style={{
            border:`1px solid ${c.accent}`, color:c.accent, padding:"12px 24px",
            fontFamily:"'Special Elite',monospace", fontSize:"0.7rem",
            letterSpacing:"0.15em", textDecoration:"none", transition:"all 0.2s"
          }}
            onMouseEnter={e=>{ e.currentTarget.style.background=c.accent; e.currentTarget.style.color=c.bg; }}
            onMouseLeave={e=>{ e.currentTarget.style.background="transparent"; e.currentTarget.style.color=c.accent; }}
          >READ HIS STORY →</a>
          {c.auLink && (
            <a href={c.auLink} style={{
              border:`1px solid ${c.accent}55`, color:c.text, padding:"12px 24px",
              fontFamily:"'Special Elite',monospace", fontSize:"0.7rem",
              letterSpacing:"0.15em", textDecoration:"none", transition:"all 0.2s"
            }}
              onMouseEnter={e=>{ e.currentTarget.style.borderColor=c.accent; e.currentTarget.style.color=c.accent; }}
              onMouseLeave={e=>{ e.currentTarget.style.borderColor=c.accent+"55"; e.currentTarget.style.color=c.text; }}
            >READ HIS STORY (AU) →</a>
          )}
          <button onClick={onRetake} style={{
            background:"transparent", border:`1px solid ${c.muted}44`,
            color:c.muted, padding:"12px 24px",
            fontFamily:"'Special Elite',monospace", fontSize:"0.7rem",
            letterSpacing:"0.15em", cursor:"pointer", transition:"all 0.2s"
          }}
            onMouseEnter={e=>{ e.currentTarget.style.borderColor=c.muted; e.currentTarget.style.color=c.text; }}
            onMouseLeave={e=>{ e.currentTarget.style.borderColor=c.muted+"44"; e.currentTarget.style.color=c.muted; }}
          >RETAKE</button>
        </div>

      </div>

      <style>{`
        @media (max-width: 580px) {
          .result-grid { grid-template-columns: 1fr !important; }
          .facet-list a { padding: 12px 14px !important; }
        }
      `}</style>
    </div>
  );
}

/* ── App ──────────────────────────────────────────────────────── */
function App() {
  const [stage, setStage] = useState("intro");
  const [qIdx, setQIdx]   = useState(0);
  const [charScores, setCharScores] = useState({});
  const [dimScores, setDimScores]   = useState({guile:0,forbear:0,chaos:0,raw:0,romance:0,grace:0});
  const [history, setHistory] = useState([]);
  const [answers, setAnswers] = useState([]);
  const [palette, setPalette] = useState(() => randomChar());

  function shufflePalette() {
    setPalette(prev => {
      let next = randomChar();
      for (let i = 0; i < 6 && next.id === prev.id; i++) next = randomChar();
      return next;
    });
  }

  function startQuiz() {
    setQIdx(0);
    setCharScores({});
    setDimScores({guile:0,forbear:0,chaos:0,raw:0,romance:0,grace:0});
    setHistory([]);
    setAnswers([]);
    setStage("quiz");
  }

  function handleAnswer(opt) {
    const charDelta = {};
    Object.keys(opt.chars).forEach(id => { charDelta[id] = opt.chars[id]; });
    const dimDelta = {};
    Object.keys(opt.dims).forEach(k => { dimDelta[k] = opt.dims[k]; });

    const nc = {...charScores};
    Object.keys(charDelta).forEach(id => { nc[id] = (nc[id]||0) + charDelta[id]; });
    const nd = {...dimScores};
    Object.keys(dimDelta).forEach(k => { nd[k] = (nd[k]||0) + dimDelta[k]; });

    setHistory(prev => [...prev, {charDelta, dimDelta}]);
    setAnswers(prev => [...prev, opt]);
    setCharScores(nc);
    setDimScores(nd);

    if (qIdx + 1 >= QUESTIONS.length) {
      setStage("result");
    } else {
      setQIdx(qIdx + 1);
    }
  }

  function handleBack() {
    if (history.length === 0 || qIdx === 0) return;
    const last = history[history.length - 1];

    const nc = {...charScores};
    Object.keys(last.charDelta).forEach(id => { nc[id] = Math.max(0, (nc[id]||0) - last.charDelta[id]); });
    const nd = {...dimScores};
    Object.keys(last.dimDelta).forEach(k => { nd[k] = Math.max(0, (nd[k]||0) - last.dimDelta[k]); });

    setCharScores(nc);
    setDimScores(nd);
    setHistory(prev => prev.slice(0, -1));
    setAnswers(prev => prev.slice(0, -1));
    setQIdx(qIdx - 1);
  }

  function handleRetake() {
    shufflePalette();
    startQuiz();
  }

  if (stage === "intro")  return <Intro onStart={startQuiz} palette={palette} onShuffle={shufflePalette}/>;
  if (stage === "quiz")   return <QuestionScreen qIdx={qIdx} onAnswer={handleAnswer} onBack={handleBack} canGoBack={qIdx > 0} palette={palette} onShuffle={shufflePalette}/>;
  if (stage === "result") return <ResultScreen charScores={charScores} dimScores={dimScores} answers={answers} onRetake={handleRetake}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
