<style>
  html, body { margin: 0; padding: 0; height: 100%; }

<script src="/WinterSunBlog/js/sam-themes-data.js"></script>
<script>
(function () {
  var DAY = 86400000;
  var START = Date.UTC(2026, 1, 13); // 2026-02-13 — 与台词墙 / 小组件同一起点

  function todayIndex(n) {
    return ((daysSinceStart() % n) + n) % n;
  }
  function daysSinceStart() {
    var now = new Date();
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((today - START) / DAY);
  }

  // ── 「今日一句」排班：严格轮转（三处同源，改一处要三处一起改）────────
  // N = 角色总数。发牌顺序由 N 确定性洗一次牌得到（不是按年份的流水账），
  // 之后一天一个、周而复始 → 任意连续 N 天里每个角色正好出现一次，
  // 同一个人两次出现的间隔恒为 N 天，谁都不会被冷落、也不会扎堆。
  // 用他第几句台词 = 第几轮 % 5，所以五轮下来他的五句也走匀。
  // 全部由日期算出，不依赖任何本机记忆 —— 今日页 / 台词墙 / 小组件永远一致。
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rosterOrder(n) {
    var order = [];
    for (var i = 0; i < n; i++) order.push(i);
    var rnd = mulberry32((n * 2654435761) | 0);
    for (var i = n - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1)), t = order[i];
      order[i] = order[j]; order[j] = t;
    }
    return order;
  }
  function dailyPick(characters) {
    var n = characters.length;
    if (!n) return null;
    var days = daysSinceStart();
    var cycle = Math.floor(days / n);
    var c = characters[rosterOrder(n)[days - cycle * n]];
    var qn = c.quotes.length;
    return mergeQ(c, c.quotes[((cycle % qn) + qn) % qn]);
  }
  function mergeQ(c, q) {
    return {
      charId: c.id, name: c.name, film: c.film, filmCN: c.filmCN, year: c.year,
      accent: c.accent, bg: c.bg, text: c.text, muted: c.muted, auLink: c.auLink,
      label: q.label, line: q.line, lineCN: q.lineCN, kind: q.kind,
    };
  }
  function dayNumber() {
    var now = new Date();
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((today - START) / DAY) + 1;
  }
  function pad(x) { return x < 10 ? '0' + x : '' + x; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
  }
  function darken(hex, amt) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    r = Math.max(0, Math.round(r * (1 - amt)));
    g = Math.max(0, Math.round(g * (1 - amt)));
    b = Math.max(0, Math.round(b * (1 - amt)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var current = null;
  var ticketPromise = Promise.resolve(null);
  var MF_ALIAS = {}; // charId → 画册锚点 id（仅不一致者，来自 lines.json meta.mf_alias）

  function render(c) {
    current = c;
    document.body.style.background = c.bg;
    document.getElementById('glow').style.background =
      'radial-gradient(120% 90% at 50% 0%, ' + c.accent + '22, transparent 55%),' +
      'radial-gradient(100% 80% at 50% 108%, ' + c.accent + '18, transparent 60%)';
    document.getElementById('theme-color').setAttribute('content', c.bg);

    document.body.style.color = c.text;
    document.getElementById('eyebrow').textContent = c.label;
    document.getElementById('eyebrow').style.color = c.accent;
    var q = document.querySelector('.quote-mark'); q.style.color = c.accent;
    document.getElementById('line').textContent = c.line;
    document.getElementById('line').style.color = c.text;
    document.getElementById('gloss').textContent = c.lineCN;
    var mfAnchor = MF_ALIAS[c.charId] || c.charId;
    var mfUrl = '/WinterSunBlog/sam/many-faces/#' + mfAnchor;
    document.getElementById('sign').innerHTML = '— <a class="mflink" href="' + mfUrl + '" title="在画册里看看他"><b>' + c.name + '</b></a> · ' + c.filmCN + ' <span style="opacity:.7">' + c.year + '</span>';
    document.getElementById('sign').style.color = c.muted;
    var mflink = document.querySelector('.sign .mflink');
    if (mflink) { mflink.style.color = c.text; mflink.style.borderColor = c.accent + '80'; }
    document.getElementById('meta').textContent = '今日 · ' + todayStr() + ' · 日更第 ' + dayNumber() + ' 天';
    document.getElementById('meta').style.color = c.muted;

    var save = document.getElementById('save');
    save.style.background = c.accent;
    save.disabled = true;
    save.textContent = '壁纸准备中…';
    ticketPromise = loadTicket(c).catch(function () { return null; }).then(function (ticket) {
      save.disabled = false;
      save.textContent = '保存为壁纸';
      save.setAttribute('data-ticket-status', ticket ? 'ready' : 'fallback');
      return ticket;
    });
    var all = document.getElementById('all');
    all.style.color = c.accent; all.style.borderColor = c.accent + '66';
    document.getElementById('home').style.color = c.text;
    document.getElementById('widget').style.color = c.muted;

    document.title = '今日的 Sam · ' + c.name;
  }

  // ── 壁纸导出（纯 Canvas，无外部库）───────────────────────────────
  function wrapText(ctx, text, maxWidth) {
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function wrapCJK(ctx, text, maxWidth) {
    var lines = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var test = cur + text[i];
      if (ctx.measureText(test).width > maxWidth && cur) {
        if ('，。！？、；：—）】》”'.indexOf(text[i]) >= 0) { lines.push(test); cur = ''; }
        else { lines.push(cur); cur = text[i]; }
      }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawWallpaper(c) {
    var cv = document.getElementById('cv');
    cv.height = 1920;
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, c.bg);
    g.addColorStop(1, darken(c.bg, 0.45));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // soft accent glow top
    var rg = ctx.createRadialGradient(W/2, H*0.16, 40, W/2, H*0.16, W*0.9);
    rg.addColorStop(0, hexA(c.accent, 0.16)); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';

    // big quote mark
    ctx.fillStyle = hexA(c.accent, 0.18);
    ctx.font = 'italic 320px "Playfair Display", serif';
    ctx.fillText('“', W/2, H*0.24);

    // label
    ctx.fillStyle = c.accent;
    ctx.font = '30px "Special Elite", monospace';
    ctx.fillText(spaced(c.label, 6), W/2, H*0.30);

    // English line
    ctx.fillStyle = c.text;
    ctx.font = 'italic 500 66px "Cormorant Garamond", serif';
    var el = wrapText(ctx, c.line, W - 220);
    var y = H*0.40, lh = 86;
    for (var i = 0; i < el.length; i++) { ctx.fillText(el[i], W/2, y); y += lh; }

    // gloss CN
    y += 34;
    ctx.fillStyle = hexA(c.text, 0.82);
    ctx.font = '300 40px "Noto Serif SC", serif';
    var gl = wrapCJK(ctx, c.lineCN, W - 200);
    for (var j = 0; j < gl.length; j++) { ctx.fillText(gl[j], W/2, y); y += 64; }

    // signature
    y += 40;
    ctx.fillStyle = c.muted;
    ctx.font = 'italic 40px "Cormorant Garamond", serif';
    ctx.fillText('— ' + c.name, W/2, y);
    y += 58;
    ctx.font = '300 30px "Noto Serif SC", serif';
    ctx.fillText(c.filmCN + ' · ' + c.year, W/2, y);

    // footer
    ctx.fillStyle = hexA(c.text, 0.4);
    ctx.font = 'italic 30px "Cormorant Garamond", serif';
    ctx.fillText('Winter Sun · a shrine for Sam · ' + todayStr(), W/2, H - 90);

    return cv;
  }
  // 没有 AU 页：照原 AU 票根原样生成，只拿掉照片段。
  // 顶部角色区、四色胶片、标题区、撕口和三格票尾都沿用同一套尺寸与字体。
  function characterTicket(c) {
    var S = 2, W = 560 * S, pad = 20 * S;
    var theme = ticketTheme(c);
    var bg = c.bg, ac = c.accent, tx = c.text, mu = c.muted;
    var swatches = [
      { hex: ac, cn: theme.cn || '角色主色', en: theme.en || 'Character Accent' },
      { hex: bg, cn: theme.bg_cn || '银幕夜色', en: theme.bg_en || 'Screen Night' },
      { hex: tx, cn: theme.text_cn || '字幕浅光', en: theme.text_en || 'Subtitle Light' },
      { hex: mu, cn: theme.muted_cn || '旧片余色', en: theme.muted_en || 'Film Patina' }
    ];
    var perfH = 66 * S;
    var H = (18 + 14 + 12 + 44 + 4 + 18 + 14) * S + perfH +
      (14 + 22 + 6 + 14 + 14) * S + 64 * S;
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    ctx.fillStyle = ticketMix(bg, '#ffffff', .07);
    ticketRoundRect(ctx, 0, 0, W, H, 14 * S); ctx.fill();

    var y = pad;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = mu;
    ctx.font = (10 * S) + 'px "Special Elite", "Courier New", monospace';
    ticketDrawSpaced(ctx, 'ADMIT ONE  ·  CHARACTER ARCHIVE', pad, y, .24 * 10 * S);
    y += 16 * S;
    ctx.fillStyle = ac;
    ctx.font = 'bold ' + (40 * S) + 'px Volkhov, "Noto Serif SC", serif';
    ticketFitText(ctx, c.name, pad, y, W - pad * 2, 40 * S, 18);
    y += 48 * S;
    ctx.fillStyle = tx; ctx.globalAlpha = .85;
    ctx.font = 'italic ' + (13.5 * S) + 'px "EB Garamond", "Noto Serif SC", serif';
    ticketFitText(ctx, 'Sam Rockwell · ' + c.film, pad, y, W - pad * 2, 13.5 * S, 19);
    ctx.globalAlpha = 1;
    y += 28 * S;

    // 原票根照片在这里；无 AU 角色直接接四色胶片。
    ctx.fillStyle = ticketMix(bg, '#000000', .35);
    ctx.fillRect(0, y, W, perfH);
    ctx.fillStyle = 'rgba(236,233,226,.55)';
    for (var hx = 8 * S; hx < W; hx += 16 * S) {
      ctx.beginPath(); ctx.arc(hx, y + 5 * S, 2 * S, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx, y + perfH - 5 * S, 2 * S, 0, Math.PI * 2); ctx.fill();
    }
    var gap = 4 * S, inner = W - 12 * S;
    var cw = (inner - gap * (swatches.length - 1)) / swatches.length;
    swatches.forEach(function (s, i) {
      var x = 6 * S + i * (cw + gap), top = y + 10 * S, h = perfH - 20 * S;
      ctx.fillStyle = s.hex; ctx.fillRect(x, top, cw, h);
      ctx.fillStyle = ticketLuminance(s.hex) > .6 ? '#2a2b36' : '#ece9e2';
      ctx.textAlign = 'center';
      ctx.font = '500 ' + (11 * S) + 'px "Noto Serif SC", serif';
      ctx.fillText(s.cn, x + cw / 2, top + h - 26 * S);
      ctx.font = 'italic ' + (9 * S) + 'px "EB Garamond", serif';
      ctx.fillText(s.en, x + cw / 2, top + h - 13 * S);
    });
    ctx.textAlign = 'left'; y += perfH + 14 * S;

    ctx.fillStyle = tx;
    ctx.font = 'bold ' + (18 * S) + 'px Volkhov, "Noto Serif SC", serif';
    // 每句台词自己的标题就是票根下半部的主标题；不再用通用占位文案。
    ticketFitText(ctx, c.label, pad, y, W - pad * 2, 18 * S, 23);
    y += 26 * S;
    ctx.fillStyle = mu;
    ctx.font = (10.5 * S) + 'px "Special Elite", "Courier New", monospace';
    ticketDrawSpacedFit(ctx, (c.film + '  ·  ' + c.year).toUpperCase(), pad, y,
      W - pad * 2, 10.5 * S, 15, .08 * 10.5 * S);
    y += 28 * S;

    ctx.strokeStyle = 'rgba(236,233,226,.4)'; ctx.lineWidth = 1 * S;
    ctx.setLineDash([4 * S, 4 * S]);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(0, y, 8 * S, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W, y, 8 * S, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    var stubs = [
      { cn: '戏服间', en: 'Wardrobe' },
      { cn: '演员表', en: 'Cast' },
      { cn: '后台电话', en: 'Backstage' }
    ];
    var sw = W / stubs.length;
    stubs.forEach(function (s, i) {
      var cx = sw * i + sw / 2;
      if (i) {
        ctx.setLineDash([3 * S, 4 * S]);
        ctx.beginPath(); ctx.moveTo(sw * i, y + 10 * S); ctx.lineTo(sw * i, y + 54 * S); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.textAlign = 'center'; ctx.fillStyle = tx;
      ctx.font = '600 ' + (13 * S) + 'px "Noto Serif SC", serif';
      ctx.fillText(s.cn, cx, y + 20 * S);
      ctx.fillStyle = mu;
      ctx.font = 'italic ' + (10.5 * S) + 'px "EB Garamond", serif';
      ctx.fillText(s.en, cx, y + 40 * S);
    });
    return cv;
  }
  function ticketTheme(c) {
    var list = window.__SAM_THEMES || [], anchor = MF_ALIAS[c.charId] || c.charId;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === anchor || list[i].anchor === anchor || list[i].id === c.charId) return list[i];
    }
    return {};
  }
  function ticketMix(a, b, t) {
    var x = parseInt(a.replace('#', ''), 16), z = parseInt(b.replace('#', ''), 16);
    function ch(s) { var p = (x >> s) & 255, q = (z >> s) & 255; return Math.round(p + (q - p) * t); }
    return 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')';
  }
  function ticketLuminance(hex) {
    var n = parseInt(hex.replace('#', ''), 16);
    var rgb = [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
    for (var i = 0; i < rgb.length; i++) {
      rgb[i] = rgb[i] <= .03928 ? rgb[i] / 12.92 : Math.pow((rgb[i] + .055) / 1.055, 2.4);
    }
    return .2126 * rgb[0] + .7152 * rgb[1] + .0722 * rgb[2];
  }
  function ticketTextColor(hex) {
    var l = ticketLuminance(hex);
    var dark = ticketLuminance('#17131c'), light = ticketLuminance('#f7f2f4');
    var darkContrast = (Math.max(l, dark) + .05) / (Math.min(l, dark) + .05);
    var lightContrast = (Math.max(l, light) + .05) / (Math.min(l, light) + .05);
    return darkContrast >= lightContrast ? '#17131c' : '#f7f2f4';
  }
  function ticketDrawSpaced(ctx, text, x, y, spacing) {
    for (var i = 0; i < text.length; i++) {
      var ch = text[i]; ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + spacing;
    }
  }
  function ticketDrawSpacedFit(ctx, text, x, y, maxW, size, min, spacing) {
    var font = ctx.font, width;
    function measure() {
      var total = spacing * Math.max(0, text.length - 1);
      for (var i = 0; i < text.length; i++) total += ctx.measureText(text[i]).width;
      return total;
    }
    width = measure();
    while (width > maxW && size > min) {
      size -= 1; spacing *= .94;
      ctx.font = font.replace(/\d+(?:\.\d+)?px/, size + 'px');
      width = measure();
    }
    ticketDrawSpaced(ctx, text, x, y, spacing);
  }
  function ticketRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function ticketFitText(ctx, text, x, y, maxW, size, min) {
    var font = ctx.font;
    while (ctx.measureText(text).width > maxW && size > min) {
      size -= 2; ctx.font = font.replace(/\d+px/, size + 'px');
    }
    ctx.fillText(text, x, y);
  }
  function ticketFontSamples(c) {
    var theme = ticketTheme(c);
    return {
      volkhov: c.name + ' ' + c.label,
      garamond: 'Sam Rockwell ' + c.film + ' Character Accent Screen Night Subtitle Light Film Patina Wardrobe Cast Backstage',
      noto: [
        theme.cn || '角色主色', theme.bg_cn || '银幕夜色',
        theme.text_cn || '字幕浅光', theme.muted_cn || '旧片余色',
        '戏服间', '演员表', '后台电话'
      ].join(''),
      special: 'ADMIT ONE CHARACTER ARCHIVE ' + c.film.toUpperCase() + ' ' + c.year
    };
  }
  function ensureTicketFonts(c) {
    var sample = ticketFontSamples(c);
    // Google Fonts 会将中文字形拆成多个 unicode-range 分包。
    // 只加载字体名不保证本张票根用到的汉字已到位，所以必须带实际文字触发加载。
    return Promise.all([
      document.fonts.load('700 80px Volkhov', sample.volkhov),
      document.fonts.load('italic 500 20px "EB Garamond"', sample.garamond),
      document.fonts.load('600 24px "Noto Serif SC"', sample.noto),
      document.fonts.load('20px "Special Elite"', sample.special)
    ]).then(function () { return document.fonts.ready; });
  }
  // 票根由系列页原有画图函数生成；这里只为它留出完整的一块，台词排在票下。
  function ticketWallpaper(c, ticketImage) {
    var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    cv.height = 2340;
    var W = cv.width, H = cv.height;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, c.bg); g.addColorStop(1, darken(c.bg, .45));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var glow = ctx.createRadialGradient(W/2, 520, 40, W/2, 520, 950);
    glow.addColorStop(0, hexA(c.accent, .15)); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    var ticketW = 900;
    var ticketH = ticketW * ticketImage.height / ticketImage.width;
    var en, cn, size, cnSize, quoteH, mainH;
    // 先量完整内容，再把「日期＋票根＋台词＋署名」作为一个整体纵向居中。
    // 票根没有照片时变矮，也不会再把所有内容挤在壁纸上半截。
    for (size = 48; size >= 30; size -= 2) {
      cnSize = Math.max(27, Math.round(size * .72));
      ctx.font = 'italic 500 ' + size + 'px "Cormorant Garamond", serif';
      en = wrapText(ctx, c.line, W - 256);
      ctx.font = '300 ' + cnSize + 'px "Noto Serif SC", serif';
      cn = wrapCJK(ctx, c.lineCN, W - 256);
      quoteH = 175 + en.length * size * 1.45 + 70 + cn.length * cnSize * 1.82 + 132;
      mainH = 85 + ticketH + 90 + quoteH;
      if (mainH <= H - 285) break;
    }
    var usableTop = 120, usableBottom = H - 165;
    var groupTop = usableTop + Math.max(0, (usableBottom - usableTop - mainH) / 2);
    var dateY = groupTop + 30;
    var ticketTop = groupTop + 85;
    var quoteTop = ticketTop + ticketH + 90;

    ctx.textAlign = 'center';
    ctx.fillStyle = c.accent;
    ctx.font = '30px "Special Elite", monospace';
    ctx.fillText('TODAY’S LINE  ·  ' + todayStr(), W/2, dateY);

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 35; ctx.shadowOffsetY = 18;
    ctx.drawImage(ticketImage, (W-ticketW)/2, ticketTop, ticketW, ticketH);
    ctx.restore();

    var y = quoteTop, left = 128;
    ctx.textAlign = 'left';
    ctx.fillStyle = c.accent;
    ctx.font = '24px "Special Elite", monospace';
    ctx.fillText('SCENE  /  ' + c.year, left, y);
    ctx.fillStyle = hexA(c.accent, .65);
    ctx.fillRect(left, y + 34, W - 2 * left, 2);
    ctx.fillStyle = hexA(c.accent, .55);
    ctx.save();
    ctx.textBaseline = 'top';
    ctx.font = 'italic 118px "Playfair Display", serif';
    ctx.fillText('“', left + 8, y + 54);
    ctx.restore();
    y += 175;
    ctx.fillStyle = c.text;
    ctx.font = 'italic 500 ' + size + 'px "Cormorant Garamond", serif';
    for (var i = 0; i < en.length; i++) { ctx.fillText(en[i], left, y); y += size * 1.45; }
    ctx.fillStyle = c.accent;
    ctx.fillRect(left, y + 26, 126, 3);
    y += 70;
    ctx.fillStyle = hexA(c.text, .82);
    ctx.font = '300 ' + cnSize + 'px "Noto Serif SC", serif';
    for (var j = 0; j < cn.length; j++) { ctx.fillText(cn[j], left, y); y += cnSize * 1.82; }
    y += 54;
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(c.text, .72);
    ctx.font = '30px "Special Elite", "Courier New", monospace';
    ctx.fillText('SAM ROCKWELL', W/2, y);
    ctx.fillStyle = hexA(c.accent, .72);
    ctx.font = '22px "Special Elite", "Courier New", monospace';
    ctx.fillText(c.film.toUpperCase() + '  ·  ' + c.year, W/2, y + 44);
    ctx.fillStyle = hexA(c.text, .45);
    ctx.font = 'italic 28px "Cormorant Garamond", serif';
    ctx.fillText('Winter Sun · a shrine for Sam', W/2, H - 75);
    return cv;
  }
  function loadTicket(c) {
    if (!c.auLink) {
      // 字形未就绪就不绘制，防止同一张票根里混入系统黑体。
      return ensureTicketFonts(c).then(function () { return characterTicket(c); });
    }
    return new Promise(function (resolve) {
      var frame = document.createElement('iframe'), finished = false;
      frame.title = '票根绘制'; frame.tabIndex = -1;
      frame.setAttribute('aria-hidden', 'true');
      frame.style.cssText = 'position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;visibility:hidden';
      function finish(result) {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        frame.remove();
        resolve(result || characterTicket(c));
      }
      var timer = setTimeout(function () { finish(null); }, 12000);
      frame.onload = function () {
        try {
          var doc = frame.contentDocument;
          var photo = doc.getElementById('js-ticket-photo');
          var save = doc.getElementById('js-ticket-save');
          if (!doc.getElementById('js-series-ticket') || !save) { finish(null); return; }
          if (photo) photo.loading = 'eager';
          var ready = photo ? photo.decode().catch(function () {}) : Promise.resolve();
          Promise.all([ready, doc.fonts.ready]).then(function () {
            if (finished) return;
            save.click();
            (function waitForTicket() {
              if (finished) return;
              var preview = doc.querySelector('.c-tk-saved img');
              if (!preview || !preview.src) { setTimeout(waitForTicket, 80); return; }
              var image = new Image();
              image.onload = function () { finish(image); };
              image.onerror = function () { finish(null); };
              image.src = preview.src;
            })();
          }).catch(function () { finish(null); });
        } catch (e) { finish(null); }
      };
      frame.onerror = function () { finish(null); };
      frame.src = c.auLink + (c.auLink.indexOf('?') === -1 ? '?' : '&') + '_ticket=' + Date.now();
      document.body.appendChild(frame);
    });
  }
  function spaced(s, px) { return s.split('').join(' '); }
  function hexA(hex, a) {
    var h = hex.replace('#','');
    return 'rgba(' + parseInt(h.substr(0,2),16) + ',' + parseInt(h.substr(2,2),16) + ',' + parseInt(h.substr(4,2),16) + ',' + a + ')';
  }

  // 与 AU 页「保存票根」共用同一套交付方式：
  // 电脑点下载；iPhone / iPad 调系统分享菜单，再选「存储图像」。
  function showWallpaperPreview(blob) {
    var url = URL.createObjectURL(blob);
    var name = 'sam-today-' + todayStr().replace(/\./g, '') + '.png';
    var ov = document.createElement('div');
    ov.className = 'c-tk-saved';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-label', '保存壁纸');
    ov.innerHTML = '<img alt="今日台词壁纸"><p aria-live="polite"></p>' +
      '<div class="c-tk-saved__row"><a class="is-primary">下载</a><button type="button">关掉</button></div>';

    ov.querySelector('img').src = url;
    var hint = ov.querySelector('p');
    hint.textContent = '长按图片存到相册，或点「下载」';
    var row = ov.querySelector('.c-tk-saved__row');
    var download = row.querySelector('a');
    download.href = url;
    download.download = name;

    if (navigator.share && navigator.canShare && typeof File === 'function') {
      var shareData = { files: [new File([blob], name, { type: blob.type })] };
      if (navigator.canShare(shareData)) {
        var share = document.createElement('button');
        share.type = 'button';
        var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
        share.textContent = isIOS ? '存到相册' : '分享图片';
        row.insertBefore(share, download);
        hint.textContent = isIOS ? '点「存到相册」，再选「存储图像」' : '点「分享图片」打开系统菜单，或点「下载」';
        share.addEventListener('click', function () {
          navigator.share(shareData).catch(function (error) {
            if (error.name !== 'AbortError') hint.textContent = '分享菜单没能打开，可以长按图片或点「下载」';
          });
        });
      }
    }

    function close() {
      ov.remove();
      document.removeEventListener('keydown', onKeyDown);
      URL.revokeObjectURL(url);
    }
    function onKeyDown(e) { if (e.key === 'Escape') close(); }
    row.lastElementChild.addEventListener('click', close);
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    document.addEventListener('keydown', onKeyDown);
    document.body.appendChild(ov);
  }

  function saveWallpaper() {
    if (!current) return;
    var btn = document.getElementById('save');
    var old = btn.textContent; btn.textContent = '生成中…';
    var fonts = [
      document.fonts.load('italic 500 66px "Cormorant Garamond"'),
      document.fonts.load('italic 320px "Playfair Display"'),
      document.fonts.load('300 40px "Noto Serif SC"', current.lineCN + '今日年日更第天'),
      document.fonts.load('30px "Special Elite"'),
      ensureTicketFonts(current)
    ];
    Promise.all(fonts).catch(function(){}).then(function () {
      return document.fonts.ready;
    }).then(function () {
      return ticketPromise;
    }).then(function (ticket) {
      var cv = ticket ? ticketWallpaper(current, ticket) : drawWallpaper(current);
      btn.setAttribute('data-export-size', cv.width + 'x' + cv.height);
      cv.toBlob(function (blob) {
        if (!blob) { btn.textContent = old; return; }
        showWallpaperPreview(blob);
        btn.textContent = old;
      }, 'image/png');
    });
  }

  // ── boot ──────────────────────────────────────────────────────
  document.getElementById('save').addEventListener('click', saveWallpaper);

  // ?char=<角色id> 或 ?char=<角色id>:<第几句> —— 与台词墙「复制到桌面小组件」
  // 按钮、小组件参数同一套代码格式，用来网页预览「固定」效果。找不到就照常
  // 走当天全站轮换。
  function pinnedQuote(data) {
    var raw = new URLSearchParams(window.location.search).get('char');
    if (!raw) return null;
    var bits = raw.split(':');
    var character = data.characters.filter(function (c) { return c.id === bits[0]; })[0];
    if (!character) return null;
    var n = parseInt(bits[1], 10);
    var quotes = character.quotes;
    return mergeQ(character, (n >= 1 && n <= quotes.length) ? quotes[n - 1] : quotes[todayIndex(quotes.length)]);
  }

  fetch('../lines.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var pool = data.pool;
      MF_ALIAS = (data.meta && data.meta.mf_alias) || {};
      document.getElementById('all').textContent = '看全部 ' + pool.length + ' 句 →';
      render(pinnedQuote(data) || dailyPick(data.characters));
    })
    .catch(function () {
      document.getElementById('line').textContent = '今天的一句，暂时没能取到。';
      document.getElementById('gloss').textContent = '请检查网络后刷新。';
    });
})();
</script>
