<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="description" content="每天一句，只对你说的话。四十八个角色，日日轮转。">

<meta property="og:description" content="每天一句，只对你说的话。">
<meta property="og:url" content="https://dxwintersun.github.io/WinterSunBlog/sam/today/">
<meta name="twitter:card" content="summary">
<!-- PWA / 添加到主屏幕 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今日的 Sam">
<meta name="theme-color" content="#14110d" id="theme-color">
<link rel="icon" type="image/png" href="/WinterSunBlog/images/heading-normal.png">
<link rel="apple-touch-icon" sizes="180x180" href="/WinterSunBlog/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500;1,600&family=Special+Elite&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    min-height: 100%; min-height: 100dvh;
    background: #14110d; color: #ede2d0;
    -webkit-font-smoothing: antialiased;
    font-family: 'Noto Serif SC', serif;
    display: flex; flex-direction: column;
    transition: background 1s ease;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: rgba(255,255,255,.18); }

  .wrap {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    padding: max(28px, env(safe-area-inset-top)) 26px max(24px, env(safe-area-inset-bottom));
    max-width: 620px; margin: 0 auto; width: 100%;
    position: relative; z-index: 1;
  }
  .glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    transition: background 1s ease;
  }
  .eyebrow {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 30px; opacity: .9;
  }
  .quote-mark {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 96px; line-height: 0; height: 40px; opacity: .16;
  }
  .line {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: clamp(28px, 8vw, 46px); line-height: 1.34; letter-spacing: .3px;
    margin: 30px 0 0; max-width: 15em;
  }
  .gloss {
    font-family: 'Noto Serif SC', serif; font-weight: 300;
    font-size: clamp(15px, 4.2vw, 18px); line-height: 1.95;
    margin: 22px auto 0; max-width: 20em; opacity: .82;
  }
  .sign {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(15px, 4vw, 18px); margin-top: 34px;
  }
  .sign b { font-weight: 600; font-style: normal; }
  .sign a.mflink {
    color: inherit; text-decoration: none;
    border-bottom: 1px solid currentColor; padding-bottom: 1px;
    transition: opacity .2s;
  }
  .sign a.mflink:hover { opacity: .68; }
  .meta {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: 10.5px; letter-spacing: 2px; margin-top: 12px; opacity: .55;
  }
  .actions {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    margin-top: 44px;
  }
  .btn {
    font-family: 'Noto Serif SC', serif; font-size: 13.5px; font-weight: 500;
    padding: 11px 20px; border-radius: 999px; letter-spacing: .5px;
    border: 1px solid; background: transparent; transition: all .2s ease;
    text-decoration: none; display: inline-block;
  }
  .btn--primary { color: #14110d; border-color: transparent; }
  .btn--ghost { background: transparent; }
  .home {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 16px; z-index: 2;
    font-family: 'Noto Serif SC', serif; font-size: 12.5px; letter-spacing: 1px;
    text-decoration: none; opacity: .7; transition: opacity .2s;
  }
  .home:hover { opacity: 1; }
  .widget-link {
    display: inline-block; margin-top: 22px;
    font-family: 'Noto Serif SC', serif; font-size: 12.5px; letter-spacing: .5px;
    text-decoration: none; opacity: .62; border-bottom: 1px solid currentColor; padding-bottom: 2px;
    transition: opacity .2s;
  }
  .widget-link:hover { opacity: 1; }
  .foot {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 13px; opacity: .4; padding: 0 0 max(18px, env(safe-area-inset-bottom));
    text-align: center; position: relative; z-index: 1;
  }
  canvas { display: none; }
</style>
</head>
<body>
  <div class="glow" id="glow"></div>
  <a class="home" id="home" href="/WinterSunBlog/sam/">← Sam</a>

  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Today’s Line</div>
    <div class="quote-mark">&ldquo;</div>
    <p class="line" id="line">…</p>
    <p class="gloss" id="gloss"></p>
    <p class="sign" id="sign"></p>
    <p class="meta" id="meta"></p>
    <div class="actions">
      <button class="btn btn--primary" id="save">保存为壁纸</button>
      <a class="btn btn--ghost" id="all" href="/WinterSunBlog/sam/wall/">看全部句子 →</a>
    </div>
    <a class="widget-link" id="widget" href="/WinterSunBlog/sam/widget/">把它放上手机桌面 · 做成小组件 →</a>
  </div>

  <div class="foot">a quiet shrine, kept by 冬璇</div>
  <canvas id="cv" width="1080" height="1920"></canvas>

<script>
(function () {
  var DAY = 86400000;
  var START = Date.UTC(2026, 1, 13); // 2026-02-13 — 与台词墙 / 小组件同一起点

  // 与 sam/wall 完全一致的「今日 index」算法，保证三处同步
  function todayIndex(n) {
    var now = new Date();
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((today - START) / DAY);
    return ((days % n) + n) % n;
  }
  // 防重复：pool 会因新增角色按年份「插页」，导致 days%n 的顺序走读
  // 撞上最近读过的句子。这里用本机记忆（与台词墙共用 ws-daily-pick）
  // 记住读过哪些，撞上就往后翻到没读过的；同一天内保持同一句。
  function dailyPick(pool) {
    var n = pool.length;
    var qkey = function (q) { return q.charId + '|' + q.line; };
    var dstr = todayStr();
    var store = {};
    try { store = JSON.parse(localStorage.getItem('ws-daily-pick') || '{}'); } catch (e) {}
    if (store.date === dstr && store.key) {
      for (var i = 0; i < n; i++) if (qkey(pool[i]) === store.key) return pool[i];
    }
    var seen = Array.isArray(store.seen) ? store.seen : [];
    var idx = todayIndex(n), q = pool[idx], hops = 0;
    while (seen.indexOf(qkey(q)) >= 0 && hops < n) { idx = (idx + 1) % n; q = pool[idx]; hops++; }
    if (hops >= n) { seen = []; idx = todayIndex(n); q = pool[idx]; }
    seen.push(qkey(q));
    var cap = Math.max(60, Math.floor(n * 0.8));
    if (seen.length > cap) seen = seen.slice(-cap);
    try { localStorage.setItem('ws-daily-pick', JSON.stringify({ date: dstr, key: qkey(q), seen: seen })); } catch (e) {}
    return q;
  }
  function dayNumber() {
    var now = new Date();
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((today - START) / DAY) + 1;
  }
  function pad(x) { return x < 10 ? '0' + x : '' + x; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
  }
  function darken(hex, amt) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    r = Math.max(0, Math.round(r * (1 - amt)));
    g = Math.max(0, Math.round(g * (1 - amt)));
    b = Math.max(0, Math.round(b * (1 - amt)));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  var current = null;
  var MF_ALIAS = {}; // charId → 画册锚点 id（仅不一致者，来自 lines.json meta.mf_alias）

  function render(c) {
    current = c;
    document.body.style.background = c.bg;
    document.getElementById('glow').style.background =
      'radial-gradient(120% 90% at 50% 0%, ' + c.accent + '22, transparent 55%),' +
      'radial-gradient(100% 80% at 50% 108%, ' + c.accent + '18, transparent 60%)';
    document.getElementById('theme-color').setAttribute('content', c.bg);

    document.body.style.color = c.text;
    document.getElementById('eyebrow').textContent = c.label;
    document.getElementById('eyebrow').style.color = c.accent;
    var q = document.querySelector('.quote-mark'); q.style.color = c.accent;
    document.getElementById('line').textContent = c.line;
    document.getElementById('line').style.color = c.text;
    document.getElementById('gloss').textContent = c.lineCN;
    var mfAnchor = MF_ALIAS[c.charId] || c.charId;
    var mfUrl = '/WinterSunBlog/sam/many-faces/#' + mfAnchor;
    document.getElementById('sign').innerHTML = '— <a class="mflink" href="' + mfUrl + '" title="在画册里看看他"><b>' + c.name + '</b></a> · ' + c.filmCN + ' <span style="opacity:.7">' + c.year + '</span>';
    document.getElementById('sign').style.color = c.muted;
    var mflink = document.querySelector('.sign .mflink');
    if (mflink) { mflink.style.color = c.text; mflink.style.borderColor = c.accent + '80'; }
    document.getElementById('meta').textContent = '今日 · ' + todayStr() + ' · 日更第 ' + dayNumber() + ' 天';
    document.getElementById('meta').style.color = c.muted;

    var save = document.getElementById('save');
    save.style.background = c.accent;
    var all = document.getElementById('all');
    all.style.color = c.accent; all.style.borderColor = c.accent + '66';
    document.getElementById('home').style.color = c.text;
    document.getElementById('widget').style.color = c.muted;

    document.title = '今日的 Sam · ' + c.name;
  }

  // ── 壁纸导出（纯 Canvas，无外部库）───────────────────────────────
  function wrapText(ctx, text, maxWidth) {
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function wrapCJK(ctx, text, maxWidth) {
    var lines = [], cur = '';
    for (var i = 0; i < text.length; i++) {
      var test = cur + text[i];
      if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = text[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  function drawWallpaper(c) {
    var cv = document.getElementById('cv');
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, c.bg);
    g.addColorStop(1, darken(c.bg, 0.45));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // soft accent glow top
    var rg = ctx.createRadialGradient(W/2, H*0.16, 40, W/2, H*0.16, W*0.9);
    rg.addColorStop(0, hexA(c.accent, 0.16)); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';

    // big quote mark
    ctx.fillStyle = hexA(c.accent, 0.18);
    ctx.font = 'italic 320px "Playfair Display", serif';
    ctx.fillText('“', W/2, H*0.24);

    // label
    ctx.fillStyle = c.accent;
    ctx.font = '30px "Special Elite", monospace';
    ctx.fillText(spaced(c.label, 6), W/2, H*0.30);

    // English line
    ctx.fillStyle = c.text;
    ctx.font = 'italic 500 66px "Cormorant Garamond", serif';
    var el = wrapText(ctx, c.line, W - 220);
    var y = H*0.40, lh = 86;
    for (var i = 0; i < el.length; i++) { ctx.fillText(el[i], W/2, y); y += lh; }

    // gloss CN
    y += 34;
    ctx.fillStyle = hexA(c.text, 0.82);
    ctx.font = '300 40px "Noto Serif SC", serif';
    var gl = wrapCJK(ctx, c.lineCN, W - 200);
    for (var j = 0; j < gl.length; j++) { ctx.fillText(gl[j], W/2, y); y += 64; }

    // signature
    y += 40;
    ctx.fillStyle = c.muted;
    ctx.font = 'italic 40px "Cormorant Garamond", serif';
    ctx.fillText('— ' + c.name, W/2, y);
    y += 58;
    ctx.font = '300 30px "Noto Serif SC", serif';
    ctx.fillText(c.filmCN + ' · ' + c.year, W/2, y);

    // footer
    ctx.fillStyle = hexA(c.text, 0.4);
    ctx.font = 'italic 30px "Cormorant Garamond", serif';
    ctx.fillText('Winter Sun · a shrine for Sam · ' + todayStr(), W/2, H - 90);

    return cv;
  }
  function spaced(s, px) { return s.split('').join(' '); }
  function hexA(hex, a) {
    var h = hex.replace('#','');
    return 'rgba(' + parseInt(h.substr(0,2),16) + ',' + parseInt(h.substr(2,2),16) + ',' + parseInt(h.substr(4,2),16) + ',' + a + ')';
  }

  function saveWallpaper() {
    if (!current) return;
    var btn = document.getElementById('save');
    var old = btn.textContent; btn.textContent = '生成中…';
    var fonts = [
      document.fonts.load('italic 500 66px "Cormorant Garamond"'),
      document.fonts.load('italic 320px "Playfair Display"'),
      document.fonts.load('300 40px "Noto Serif SC"'),
      document.fonts.load('30px "Special Elite"')
    ];
    Promise.all(fonts).catch(function(){}).then(function () {
      return document.fonts.ready;
    }).then(function () {
      var cv = drawWallpaper(current);
      cv.toBlob(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'sam-today-' + todayStr().replace(/\./g,'') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        btn.textContent = old;
      }, 'image/png');
    });
  }

  // ── boot ──────────────────────────────────────────────────────
  document.getElementById('save').addEventListener('click', saveWallpaper);

  // ?char=<角色id> 或 ?char=<角色id>:<第几句> —— 与台词墙「复制到桌面小组件」
  // 按钮、小组件参数同一套代码格式，用来网页预览「固定」效果。找不到就照常
  // 走当天全站轮换。
  function pinnedQuote(data) {
    var raw = new URLSearchParams(window.location.search).get('char');
    if (!raw) return null;
    var bits = raw.split(':');
    var character = data.characters.filter(function (c) { return c.id === bits[0]; })[0];
    if (!character) return null;
    var n = parseInt(bits[1], 10);
    var quotes = character.quotes;
    var q = (n >= 1 && n <= quotes.length) ? quotes[n - 1] : quotes[todayIndex(quotes.length)];
    return {
      charId: character.id, name: character.name, film: character.film, filmCN: character.filmCN, year: character.year,
      accent: character.accent, bg: character.bg, text: character.text, muted: character.muted, auLink: character.auLink,
      label: q.label, line: q.line, lineCN: q.lineCN, kind: q.kind,
    };
  }

  fetch('../lines.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var pool = data.pool;
      MF_ALIAS = (data.meta && data.meta.mf_alias) || {};
      document.getElementById('all').textContent = '看全部 ' + pool.length + ' 句 →';
      render(pinnedQuote(data) || dailyPick(pool));
    })
    .catch(function () {
      document.getElementById('line').textContent = '今天的一句，暂时没能取到。';
      document.getElementById('gloss').textContent = '请检查网络后刷新。';
    });
})();
</script>
</body>
</html>
