<style>
  html, body { margin: 0; padding: 0; }
  body { background: #14110d; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: rgba(203,161,76,.3); }

  /* ── 两栏版式：左侧人物名录（吸顶、独立滚动），右侧详情区（雷达图 + 维度条）──
     解决旧版「显示区在顶部、41 人的选择器在页面最底部」的来回滚动问题：
     选一个人要滚到底，点完还要滚回顶部看图。改成同屏可见，桌面各自独立
     滚动，手机名录变吸顶横条，思路与台词墙（sam/wall）一致。 */
  .spectrum-layout { display: flex; align-items: flex-start; gap: 26px; }
  .spectrum-picker {
    flex: 0 0 258px;
    position: sticky;
    top: 18px;
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    padding-right: 4px;
  }
  .spectrum-picker::-webkit-scrollbar { width: 5px; }
  .spectrum-picker::-webkit-scrollbar-thumb { background: #2a241b; border-radius: 3px; }
  .spectrum-detail { flex: 1; min-width: 0; scroll-margin-top: 18px; }
  .spectrum-decade-label { display: block; }

  @media (max-width: 900px) {
    .spectrum-layout { display: block; }
    .spectrum-picker {
      position: sticky;
      top: 0;
      z-index: 20;
      max-height: none;
      overflow-y: visible;
      overflow-x: auto;
      display: flex;
      gap: 8px;
      padding: 12px 2px 14px;
      margin: 0 -4px 22px;
      background: #14110d;
      border-bottom: 1px solid #211c14;
      scrollbar-width: none;
    }
    .spectrum-picker::-webkit-scrollbar { display: none; }
    /* 手机横向滚动条里放不下按年代分组的标题，展开成一条扁平的人物流 */
    .spectrum-decade { display: contents; }
    .spectrum-decade-label { display: none; }
    .spectrum-picker-item, .spectrum-picker-avg {
      flex: 0 0 auto !important; width: auto !important;
      border-radius: 999px !important; white-space: nowrap;
    }
    .spectrum-detail { scroll-margin-top: 68px; }
  }
</style>

const SERIF = "'Noto Serif SC', serif";
const DISPLAY = "'Playfair Display', serif";
const GARA = "'Cormorant Garamond', serif";
const TYPE = "'Special Elite', 'Courier New', monospace";

const DIMS = [
  { key: "guile",   cn: "狡黠", en: "GUILE",   desc: "算计与机锋" },
  { key: "forbear", cn: "隐忍", en: "FORBEAR", desc: "沉默里扛住的" },
  { key: "chaos",   cn: "疯狂", en: "CHAOS",   desc: "失控与不管不顾" },
  { key: "raw",     cn: "璞真", en: "RAW",     desc: "笨拙的真心" },
  { key: "romance", cn: "浪漫", en: "ROMANCE", desc: "对你的那点软" },
  { key: "grace",   cn: "优雅", en: "GRACE",   desc: "骨子里的教养" },
];

const AVG_ACCENT = "#a2897c";

// 全站联动：光谱 ↔ 台词墙 ↔ 画册。三处角色 id 命名空间基本一致，只有这
// 三个不同（画册用了另一套短 id）——同一张表台词墙/画册两边都在用。
const MF_ALIAS = { johnmoon: "john", sambell: "sam", klenz: "hendrix" }; // charId → 画册 id
function mfHrefFor(charId) {
  return "/WinterSunBlog/sam/many-faces/#" + (MF_ALIAS[charId] || charId);
}
function wallHrefFor(charId) {
  return "/WinterSunBlog/sam/wall/?char=" + charId; // 台词墙与光谱共用同一套 charId，无需换算
}

const AVERAGE = (() => {
  const p = {};
  DIMS.forEach(d => {
    p[d.key] = CHARS.reduce((s, c) => s + c.profile[d.key], 0) / CHARS.length;
  });
  return {
    id: "__avg", name: "五十二个他 · 平均的 Sam", film: "The Average of Fifty-Two Faces",
    filmCN: "五十二张面孔叠在一起", year: "", label: "THE MEAN OF ALL",
    tagline: "把他演过的每一个人叠在一起，露出的那张脸。",
    line: "", lineCN: "", accent: AVG_ACCENT, text: "#ede4dc", muted: "#8a7a6e",
    bg: "#1a1610", profile: p, auLink: null, isAvg: true,
  };
})();

/* ── Hexagon radar ─────────────────────────────────────────── */
function Radar({ c, ghost }) {
  const size = 300, cx = size / 2, cy = size / 2, R = 108;
  const pt = (i, r) => {
    const a = (-90 + i * 60) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const poly = (vals) => DIMS.map((d, i) => pt(i, (vals[d.key] / 10) * R).join(",")).join(" ");
  const rings = [2, 4, 6, 8, 10];

  return (
    <svg viewBox={"0 0 " + size + " " + size} style={{ width: "100%", maxWidth: 360, display: "block", margin: "0 auto" }}>
      {rings.map((lv, ri) => (
        <polygon key={ri}
          points={DIMS.map((d, i) => pt(i, (lv / 10) * R).join(",")).join(" ")}
          fill="none" stroke="#332c21" strokeWidth={lv === 10 ? 1.4 : 1} opacity={lv === 10 ? 1 : .7} />
      ))}
      {DIMS.map((d, i) => {
        const [x, y] = pt(i, R);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#332c21" strokeWidth="1" />;
      })}

      {ghost && (
        <polygon points={poly(ghost.profile)} fill="none"
          stroke={AVG_ACCENT} strokeWidth="1.4" strokeDasharray="4 4" opacity=".5" />
      )}

      <polygon points={poly(c.profile)}
        fill={c.accent + "33"} stroke={c.accent} strokeWidth="2.2"
        strokeLinejoin="round" style={{ filter: "drop-shadow(0 0 10px " + c.accent + "66)" }} />

      {DIMS.map((d, i) => {
        const [x, y] = pt(i, (c.profile[d.key] / 10) * R);
        return <circle key={i} cx={x} cy={y} r="3.4" fill={c.accent} stroke="#14110d" strokeWidth="1.2" />;
      })}

      {DIMS.map((d, i) => {
        const [x, y] = pt(i, R + 26);
        return (
          <g key={i} textAnchor="middle">
            <text x={x} y={y - 3} fontFamily={SERIF} fontSize="14" fontWeight="500" fill="#c9b48c">{d.cn}</text>
            <text x={x} y={y + 11} fontFamily={TYPE} fontSize="7.5" letterSpacing="1.2" fill="#6f6047">{d.en}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ── Dimension spectrum strips ─────────────────────────────── */
function Strip({ dim, selIdx }) {
  const sel = selIdx >= 0 ? CHARS[selIdx] : null;
  const selVal = sel ? sel.profile[dim.key] : AVERAGE.profile[dim.key];
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 9 }}>
        <span>
          <span style={{ fontFamily: SERIF, fontSize: 14, fontWeight: 500, color: "#c9b48c" }}>{dim.cn}</span>
          <span style={{ fontFamily: TYPE, fontSize: 9.5, letterSpacing: 1.5, color: "#6f6047", marginLeft: 8 }}>{dim.en}</span>
          <span style={{ fontFamily: SERIF, fontSize: 11.5, color: "#6f6047", marginLeft: 10 }}>{dim.desc}</span>
        </span>
        <span style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 17, color: sel ? sel.accent : AVG_ACCENT }}>
          {selVal % 1 === 0 ? selVal : selVal.toFixed(1)}<span style={{ fontSize: 11, color: "#5f5340" }}> / 10</span>
        </span>
      </div>
      <div style={{ position: "relative", height: 30, borderRadius: 6, background: "#191510", border: "1px solid #241f18" }}>
        <div style={{ position: "absolute", left: "50%", top: 4, bottom: 4, width: 1, background: "#241f18" }}></div>
        {CHARS.map((c, i) => {
          const v = c.profile[dim.key];
          const active = i === selIdx;
          const off = ((i * 37) % 11 - 5) * 1.4;
          return (
            <span key={c.id} title={c.name + " · " + v}
              style={{
                position: "absolute", left: (v / 10 * 100) + "%",
                top: "calc(50% + " + off + "px)", transform: "translate(-50%,-50%)",
                width: active ? 11 : 6, height: active ? 11 : 6, borderRadius: "50%",
                background: active ? c.accent : (selIdx < 0 ? "#7a6a4a" : "#4a4130"),
                boxShadow: active ? "0 0 10px " + c.accent + ", 0 0 0 2px #14110d" : "none",
                zIndex: active ? 3 : 1, transition: "all .3s ease",
              }} />
          );
        })}
      </div>
    </div>
  );
}

// 左侧名录里的一行——与台词墙（sam/wall）的 RosterItem 同一套视觉语言，
// 保持这个「Sam 互动小站」系列的一致性。desktop 是完整一行，mobile 靠
// CSS 折成只剩名字的胶囊（见 <style> 里的 @media 规则）。
function PickerItem({ c, active, onClick }) {
  return (
    <button className="spectrum-picker-item" onClick={onClick} style={{
      display: "flex", alignItems: "center", gap: 8, width: "100%",
      textAlign: "left", marginBottom: 6, fontFamily: SERIF,
      background: active ? "#231d14" : "transparent",
      border: "1px solid " + (active ? c.accent + "70" : "#211c14"),
      borderLeft: "3px solid " + (active ? c.accent : "transparent"),
      borderRadius: 10, padding: "9px 11px",
    }}>
      <span style={{
        fontSize: 13.5, fontWeight: 500, whiteSpace: "nowrap",
        overflow: "hidden", textOverflow: "ellipsis",
        color: active ? c.accent : "#ede2d0",
      }}>{c.name}</span>
      {c.year ? (
        <span style={{
          marginLeft: "auto", flexShrink: 0, fontFamily: DISPLAY, fontStyle: "italic",
          fontSize: 11, color: "#8a7558", opacity: active ? .85 : .55,
        }}>{c.year}</span>
      ) : null}
    </button>
  );
}

const DECADES = (() => {
  const groups = {};
  CHARS.forEach((c, i) => {
    const d = Math.floor(parseInt(c.year, 10) / 10) * 10;
    (groups[d] = groups[d] || []).push({ c, i });
  });
  return Object.keys(groups).sort().map(d => ({ label: d + "s", items: groups[d] }));
})();

function initialSelIdx() {
  if (typeof window === "undefined") return -1;
  const wanted = new URLSearchParams(window.location.search).get("char");
  if (!wanted) return -1;
  return CHARS.findIndex(function (c) { return c.id === wanted; }); // -1（未找到）自动落回「平均的 Sam」
}

function App() {
  const [selIdx, setSelIdx] = useState(initialSelIdx);
  const cur = selIdx < 0 ? AVERAGE : CHARS[selIdx];
  const detailRef = useRef(null);

  const top = useMemo(() => {
    return DIMS.map(d => ({ d, v: cur.profile[d.key] })).sort((a, b) => b.v - a.v)[0];
  }, [selIdx]);

  function syncUrl(i) {
    if (!(window.history && window.history.replaceState)) return;
    const params = new URLSearchParams(window.location.search);
    if (i < 0) params.delete("char"); else params.set("char", CHARS[i].id);
    const qs = params.toString();
    window.history.replaceState(null, "", window.location.pathname + (qs ? "?" + qs : ""));
  }

  function selectChar(i) {
    setSelIdx(i);
    syncUrl(i);
    if (detailRef.current) detailRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  return (
    <div style={{ maxWidth: 1180, margin: "0 auto", padding: "clamp(28px,6vw,64px) clamp(18px,5vw,40px) 90px" }}>

      <header style={{ textAlign: "center", marginBottom: "clamp(26px,5vw,44px)" }}>
        <a href="/WinterSunBlog/sam/" style={{
          fontFamily: SERIF, fontSize: 12.5, color: "#8a7558", textDecoration: "none",
          letterSpacing: 2, display: "inline-block", marginBottom: 26,
        }}>&larr; 回到 Sam</a>
        <h1 style={{
          margin: 0, fontFamily: DISPLAY, fontWeight: 700, fontStyle: "italic",
          fontSize: "clamp(40px, 10.5vw, 72px)", lineHeight: 1.02, color: "#ede2d0",
          letterSpacing: .5,
        }}>Six Dimensions</h1>
        <div style={{
          fontFamily: SERIF, fontWeight: 500, fontSize: "clamp(15px, 4.4vw, 20px)",
          letterSpacing: 8, color: "#c9b48c", marginTop: 16, paddingLeft: 8,
        }}>六维光谱</div>
        <p style={{
          margin: "22px auto 0", maxWidth: 486, fontFamily: SERIF, fontWeight: 300,
          fontSize: "clamp(14px,3.8vw,16px)", lineHeight: 2, color: "#a08b6b",
        }}>
          狡黠、隐忍、疯狂、璞真、浪漫、优雅——<br />
          同一个人，五十二种配比。左边点一个角色，看他的形状；<br />
          或者就停在<span style={{ color: "#a2897c" }}>平均的那张脸</span>上。
        </p>
      </header>

      <div style={{ display: "flex", alignItems: "center", gap: 16, margin: "clamp(30px,5vw,44px) 0 20px" }}>
        <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, transparent, #3a3226)" }}></span>
        <span style={{ fontFamily: TYPE, fontSize: 11.5, letterSpacing: 3, color: "#8a7558", textTransform: "uppercase", whiteSpace: "nowrap" }}>
          选一个他 · Pick a Face
        </span>
        <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, #3a3226, transparent)" }}></span>
      </div>

      <div className="spectrum-layout">
        <nav className="spectrum-picker" aria-label="角色名录">
          <button className="spectrum-picker-avg" onClick={() => selectChar(-1)} style={{
            display: "block", width: "100%", textAlign: "center", marginBottom: 12,
            fontFamily: SERIF, fontSize: 13.5, color: selIdx < 0 ? "#14110d" : AVG_ACCENT,
            background: selIdx < 0 ? AVG_ACCENT : "transparent",
            border: "1px solid " + AVG_ACCENT, borderRadius: 999,
            padding: "9px 16px", fontWeight: 500, letterSpacing: 1,
            whiteSpace: "nowrap",
          }}>◆ 平均的 Sam</button>

          {DECADES.map(dec => (
            <div key={dec.label} className="spectrum-decade">
              <div className="spectrum-decade-label" style={{
                fontFamily: DISPLAY, fontStyle: "italic", fontWeight: 700, fontSize: 15,
                color: "#8a7558", margin: "16px 4px 8px",
              }}>{dec.label} <span style={{ fontFamily: TYPE, fontSize: 9.5, fontStyle: "normal", color: "#5f5340" }}>{dec.items.length}</span></div>
              {dec.items.map(({ c, i }) => (
                <PickerItem key={c.id} c={c} active={i === selIdx} onClick={() => selectChar(i)} />
              ))}
            </div>
          ))}
        </nav>

        <div className="spectrum-detail" ref={detailRef}>
          <div style={{
            background: "linear-gradient(155deg, " + cur.bg + " 0%, #0d0b08 130%)",
            border: "1px solid " + cur.accent + "33", borderRadius: 18,
            padding: "30px 22px 26px", boxShadow: "0 30px 80px -46px " + cur.accent + "55",
          }}>
            <Radar c={cur} ghost={cur.isAvg ? null : AVERAGE} />
            <div style={{ textAlign: "center", marginTop: 18 }}>
              <div style={{ fontFamily: TYPE, fontSize: 10, letterSpacing: 2.5, color: cur.accent, textTransform: "uppercase", marginBottom: 8 }}>
                最强的一面 · {top.d.cn} {top.v % 1 === 0 ? top.v : top.v.toFixed(1)}
              </div>
              <h2 style={{ margin: 0, fontFamily: DISPLAY, fontWeight: 700, fontSize: "clamp(22px,5vw,30px)", color: cur.text, lineHeight: 1.2 }}>
                {cur.isAvg ? cur.name : (
                  <a href={mfHrefFor(cur.id)} title="在画册里看看他" style={{
                    color: "inherit", textDecoration: "none",
                    borderBottom: "1px dashed " + cur.accent + "70", paddingBottom: 2,
                  }}>{cur.name}</a>
                )}
              </h2>
              <div style={{ fontFamily: GARA, fontStyle: "italic", fontSize: 16, color: cur.muted, marginTop: 6 }}>
                {cur.filmCN}{cur.year ? " · " + cur.year : ""}
              </div>
              <p style={{ margin: "16px auto 0", maxWidth: 420, fontFamily: SERIF, fontWeight: 300, fontSize: 14, lineHeight: 1.85, color: cur.text, opacity: .8 }}>
                {cur.tagline}
              </p>
              {cur.line && (
                <a href={wallHrefFor(cur.id)} title="看看他的五句台词" style={{ display: "block", textDecoration: "none" }}>
                  <p style={{ margin: "16px auto 0", maxWidth: 420, fontFamily: GARA, fontStyle: "italic", fontSize: 17, lineHeight: 1.5, color: cur.accent }}>
                    &ldquo;{cur.line}&rdquo;
                  </p>
                  <p style={{
                    margin: "6px 0 0", fontFamily: TYPE, fontSize: 9.5, letterSpacing: 2,
                    color: cur.muted, textTransform: "uppercase", opacity: .75,
                  }}>他的五句台词 · SIGNATURES &rarr;</p>
                </a>
              )}
              {cur.auLink && (
                <a href={cur.auLink} style={{
                  display: "inline-block", marginTop: 18, fontFamily: SERIF, fontSize: 13,
                  color: cur.accent, textDecoration: "none", borderBottom: "1px solid " + cur.accent + "55", paddingBottom: 2,
                }}>读他的 AU &rarr;</a>
              )}
            </div>
          </div>

          <div style={{ marginTop: "clamp(20px,4vw,32px)" }}>
            <div style={{ fontFamily: TYPE, fontSize: 11, letterSpacing: 2.5, color: "#8a7558", textTransform: "uppercase", marginBottom: 20 }}>
              在五十二人里的位置
            </div>
            {DIMS.map(d => <Strip key={d.key} dim={d} selIdx={selIdx} />)}
            <p style={{ fontFamily: SERIF, fontSize: 11.5, color: "#5f5340", lineHeight: 1.7, marginTop: 4 }}>
              每个点是一个角色，横轴是该维度 0→10。虚线六边形是五十二人的平均。
            </p>
          </div>
        </div>
      </div>

      <footer style={{ textAlign: "center", marginTop: 72 }}>
        <p style={{ fontFamily: GARA, fontStyle: "italic", fontSize: 17, color: "#8a7558", margin: 0 }}>
          He was never just one kind of man.
        </p>
        <p style={{ fontFamily: SERIF, fontSize: 12, color: "#5f5340", letterSpacing: 2, marginTop: 14 }}>
          a quiet shrine, kept by 冬璇
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
