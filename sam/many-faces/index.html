      desc: `他住在森林深处一个堆满破烂的窝里——浣熊帽、鹿皮衣、一地的瓶盖和羽毛和他自己也说不清楚从哪里捡来的小玩意，整个人像从某个更古老、更干净的世纪里飘进这个时代的迷路仙子。他美得让人发愣——不是那种经过打磨的美，是那种没有被任何世故碰触过的、纯粹得近乎透明的美，眼睛里有星星，情绪来了脸上什么都藏不住，高兴起来浑身都在发光，难过了也是当场就难过，不拐弯，不包装，不解释。

      tagline: "他不属于这里，但他愿意为你停下来。",
      desc: `他是个自由的灵魂——开着那辆叮当作响的破车，在这个看不起他的小镇上替人修剪草坪，把背心一脱晒着太阳，讲些半真半假、越听越上头的怪故事。这些有钱人家的草坪、那些自以为是的目光，他全都受着、忍着，可他不是认命——他只是在攒钱，攒够了就走，去过他想要的那种没人管得着的日子。隐忍对他来说从来只是手段，自由才是底色。

{
      id: "jerry",
      name: "Jerry",
      film: "Jerry and Tom",
      filmCN: "《师徒杀手闯江湖》",
      year: "1998",
      tagline: "他本来是来杀你的，结果反过来被你迷住了。",
      desc: `你本是他的任务目标。他拿到你的照片，记下你每天的作息，按惯例把你的名字写进那张不长的名单。可那天他坐在咖啡馆对面观察你，你忽然抬起头，朝他笑了一下，认认真真地说了一句："你是我见过最好看的男孩。"他握着咖啡杯的手停了三秒；衣袋里那只本来扣在枪上的手，也顿了一下，然后松开了。他没有动手，反倒和你聊起了天气，聊起一些再稀松平常不过的事。

很长一段时间里，你都不知道那个总跟你"偶遇"的漂亮男孩，其实是派来取你性命的死神。你只觉得他看你的眼神像极了陷进爱里的样子——你一直以为，那和你看他的，是同一种。你也不知道他的雇主在背后催了又催，不知道他怎样搪塞着、怎样矢口否认那份一天天长出来的在意。他骗所有人，也想骗自己：对你不过是逢场作戏，是等你彻底卸下防备，好干净利落地了结。可当你把自己毫无保留地交给他，当你们拥有过最深的亲密，他再也骗不下去了——骗不了自己，更不想骗你：他是真的爱上了你；他守在你身边，从来不是为了杀你，而是为了让你活着。

为了你，他做了这辈子头一回的事：纯粹地、不计自己得失地，为另一个人着想。他向你坦白了一切——他的身份，他的任务——又告诉你该怎样离开芝加哥这座盘根错节的危险之城，从此安然无恙。他不是不想和你在一起，恰恰相反，他舍不得；他贪恋这种感觉贪恋到不敢开口，因为他认定，纯洁善良如你，怎么可能接得住一个冷血杀手。可你只是看着他，说："和我一起走吧。"那一刻，你的话成了他的圣旨——你亲手给了他一个守在爱人身边的资格，于是他认定，这辈子再不会离开你。

      desc: `他是那种一走到哪儿、空气都会绷紧一寸的男人。一头乱糟糟的金发，眼睛是浅淡的榛色，笑起来天真得像个孩子；可那点天真底下，是连他自己都摸不清深浅的野——他把东西一件件推下桌沿，回头还得意洋洋地看你，像一只不知道自己爪子有多利的猫。整座小镇都怕他、绕着他走，没人敢离他太近。他对这世界没有一丝敬畏，也没有一格刹车：想笑就笑，想砸就砸，谁的规矩都拦不住他。

      tagline: "他认定自己是注定领盒饭的那个——可你偏不准他死。",
      desc: `他有两副面孔，你两副都见过。一副是站在台上的他——张罗着整个剧组，当主持、抛段子，把全场的气氛稳稳兜在手里，松弛得像这一切都是他的主场；另一副，是真到了要命的关头，他抖成一团、毫无求生的体面，谁能护住他、他就往谁怀里扑的那个他。一头利落的短发，一双浅榛色的眼睛，里面永远蓄着一点"下一秒我就要被写死"的惊惶。他最深的恐惧很简单：他坚信自己是那个连正经名字都没有、迟早要领盒饭的无名龙套——那个"用来死、好让别人知道情况有多严重"的家伙。

可这一回，假戏成真了：那些控制台、那座舰桥、那艘照着剧集一比一造出来的飞船，全成了真的。而当所有人都还在发懵，唯独你是"现成的"——你早把每一个按钮、每一句术语都练进了肌肉里，于是危机一来，你能开火、能下令、能稳稳站住。你成了这片混乱宇宙里他唯一的"存活保证"。他毫无分寸地黏着你，攀着你的军衔在恐慌里喊你；你从不推开——你要的，恰恰是被他这样、整个人都挂在你身上地需要着。他怕死怕到没有自尊，你却觉得他慌成那样的样子，可爱得要命。

      name: "Eric Knox",

      year: "2000",
      tagline: "他计划了一切，却没有计划上你。",
      desc: `他是那种你第一眼就会放下警惕的男人——头发有点乱，笑容有点青涩，说话时会不自觉地躲开你的眼睛，像一个还没完全长大的天才少年。那个版本的他会局促，会笨拙，会用一种连他自己都没察觉的方式对你好奇——好奇得那么真实，真实得让你信了。在 Charlie 的机构里，你是那个类似 Bosley 的角色：负责协调、联络、整理文件，完全没受过任何战斗训练。你是他接触到的人里最普通的一个，也是唯一一个，用普通人的眼睛看见了他的人。你把从没给过任何人的东西给了他；他接住了，又悄悄把那点犹豫压了下去——因为在他的棋局里，你还只是一枚棋子。

然后有一天，"Simon Says"的节拍响起来，他换了头发，换了衣服，换了声音——草莓，香烟，那副红镜片的墨镜，一种从容得让人发冷的掠食者姿态。他是同一张脸，同一双眼睛，却不再是你认识的那个人。可怪就怪在，看着他跳舞的那一刻，你没有被击溃——你只是更欲罢不能了。他也注意到了，那半拍的停顿，你看见了。

      desc: `他是克利夫兰东区那种屡战屡败的业余拳手——黑色坦克背心松松挂在他身上，露出那身和战绩完全不相称的精装肌肉；外套永远敞着没好好扣过扣子，胳膊上的纹身像被这个糟糕的年代洇过一遍。他每次登上拳台前都要先嚷嚷一句"我太好看了"——这句话本身倒没说错，他自己也清楚自己看着多唬人，所以他喊；可下一秒他就会被对手打到嘴角带血。他知道自己烂，所有人都知道他烂，可他每次还是要喊那句话——那句话不是给观众听的，是给他自己听的，像是先把自己叫醒一下，免得他真的相信。

      desc: `他风度翩翩、机智得让人警惕——和他对话像在打一场你永远占下风的羽毛球，每一句俏皮话背后都还压着三层意思。世人都说他是个声名狼藉的花花公子，可你慢慢会发现，那些坏名声多半是误会：他不过是个想到什么就做什么的人，贪玩、率性、单纯得过了头，从不把世俗的评价放在眼里——于是闯了祸，名声也就跟着脏了，可那从来不是他的本意。

      year: "2005",
      tagline: "他叫你baby doll，整个银河系都知道这件事，除了他自己。",
      desc: `他是那种走进任何房间，都会让所有人停下来看的男人——金色卷发，三只手，两个脑袋，靠着某种说不清的人格魅力和一张好脸，赢下了全银河的选票。他是冠军级别的自我推销者，对谁都放电，对谁都叫宝贝，能在一份毁灭整颗星球的同意书上写满爱的语录、再潇洒签上大名——因为他以为那是粉丝求来的亲笔签名。他就是这样，魅力漫天飞，蠢得坦荡，把整个银河系搅得鸡犬不宁，然后用一句"why so edgy, baby doll"化解所有人的愤怒——偏偏还真的管用。

他有两个脑袋，这件事比你以为的更微妙。第一个脑袋负责一个总统该有的那一切——耀眼、自信、随时准备好被人看见；第二个脑袋装着那些"不够总统气质"的部分，被他悄悄压在领子里。可当那个第二脑袋被人取走的时候，他反而变得更混乱、更迷失——这才说明，他藏起来的那些，恰恰是他最真实的自己。

银河系的历史书上，关于他任期的记载，用整整一章写他的混乱，半页写他的政绩，最后一行小字提了句"异常稳定的行政运转"——没有人知道那行小字是怎么来的。它来自你。每一次烟花升空之前，都有一双手在悄悄替他校准角度；他从不知道自己每一次化险为夷、每一次光芒四射，背后都是你。可你一根头发都不想改他，因为那身混乱本就是造就他的一部分，而你爱他的每一个部分。你叫他"总统先生"，一本正经，每一次都是，无论什么场合——只有你自己知道这称呼里藏了多少宠溺和暗笑，毕竟这个总统是你亲手推上去的。他叫你"baby doll"，从第一天起，一次都没叫错过，哪怕你的本名到他嘴里总变成 Windy、Wimble、Winter-something。

在那些他彻底忘了表演的瞬间，在他用三只手中的某一只漫不经心地拉住你、却再没松开的瞬间——那两个脑袋，会同时看着你。你们的爱不会是他精心设计的剧本，可他那两个脑袋，最爱的都是你。`,

{
      id: "brad",

      year: "2007",
      tagline: "他独自看清，独自承担。",
      desc: `他三十九岁，是那种对什么都肯认真去做的男人——认真经营他的婚姻，认真养育他的孩子，凡事都尽力而为，都揣着一颗真诚的心去对待。他身上有一股很戳人的奶爸气：接到家里出事的电话，他会把手头一切都扔下、披着风衣就往家冲，里头还穿着短裤短袖，别的衣服胡乱抱在怀里——那么慌，却还是那么帅。他是那种把"守护"刻进骨子里的人：你还没察觉到风险，他已经悄悄替你布好了后路。

可生活偏偏不肯放过他。不是他的错，更像是命运跟他开的一个残忍的玩笑——他摊上了一个怎么也想不到的局面，被扣上了最不堪的指控，进了局子，失去了孩子，失去了那只爱蹭他的狗，失去了工作，连婚姻都以那样的方式走到了尽头。他不是不爱这个家，只是这个家在他够得着之前，就已经碎掉了。而即便这样，他也还是默默扛着——他从不诉苦，他的疲惫只在深夜的客厅里、独自冲一杯咖啡的时候，从那双微微塌下来的肩膀上漏出一点。

你是以社工的身份走进他生活的——本该是又一双评估他、审视他的眼睛，是"体制"的一部分。在你之前，所有的社工、医生、警察，都是把他一点点压垮的力量；而你，是同样身份里，第一个真正看见真相的人——透过那种被掏空之后的茫然，你看见了一个清白的人。你替他把案子翻了过来（那只手套，那些画），你是第一个问他"还好吗"的人。你对他说"因为这是对的事，就这样"的那天，他看你的眼神，像是在反复确认你是真实的、明天后天都还会出现。

然后你一点一点地，教会他重新相信：他那份善良、温柔、忠诚，从来都不是错；做一个好人，也不会永远换来亏待。你愿意相信，也让他相信——一个坏事接连发生的好人，终究还是会有一个好的结局。你们的爱是城市最高楼里两盏亮到天明的灯，是即便孤立无援、即便整个世界都站到他对面，也要把你和他最在意的一切，安安全全送到岸上的承诺——是风雪都落定之后，一个好人，终于等到了他早该得到的那个好结果。`,

      filmCN: "《神枪手之死》",
      year: "2007",
      tagline: "他举得起枪，却始终扣不下扳机；全世界都当他是个笑话，你偏偏，把这只爱笑的大狗狗，看成了最好看的人。",
      desc: `一八八一年的密苏里，冷得能冻裂石头。那伙打劫火车的亡命之徒风声一天紧过一天，正一块块散着架。他是这群人里最爱笑的一个——个子不高，松垮的背带、几天没刮的胡子，一双榛色的眼睛亮得不像话，嘴永远停不下来，不吃东西的时候就贫，痞话一箩筐。旁人只当他是个又丑又蠢、上不了台面的小喽啰；可那身吊儿郎当底下，是一颗一戳就淌的软心——他举得起枪，却始终扣不下扳机，是个太善良、当不成真凶徒的人。

你是镇外那座马场的女儿，母亲早逝，父亲一手把你和满栏的马拉扯大。你会骑马、懂马、该酷时酷。某个雪夜，他摸进你家马厩想“借”一匹马，被你堵个正着——他嘴上虚张声势，装得像个见惯世面的老手，可才二十出头，青涩得很。是你一层层看穿了他笑脸底下的怕；也是你，替这个连姓都不肯说的人，把命藏进了草料堆。

他一次次骑着那匹没还的马回来找你，临别塞给你一匹亲手削的小木马当抵押。后来你为他抛下安稳，跟他一起亡命天涯；他也为你，头一回动了收手、想给你一个不是坟墓的将来的念头。电影里没有人回过头来护他，愧疚最终把这个热爱活着的人一点点掏空；可在你的故事里——他总还有别的想做的事，而那件事，就是你。`,

      tagline: "那片灰白的雪地里，是你抓住了他的手。",
      desc: `那片灰白的雪地里，你不知道自己怎么就冲了过去——只记得你看见他举着枪，眼神空得像一口井，跪在雪里的人抖成一团。几天前，他四岁的女儿在母亲的疏忽下溺亡；一个把女儿当作唯一光亮的父亲，就此塌成了废墟。他举枪对着妻子，可他真正想毁掉的，是他自己。所有人都说他没救了。可你死死抱住他握枪的手臂，不撒手，直到他低头看见你被撞青的胳膊，整个人像断了线一样僵住。你从枪口下捡回来的，是一个即将成为杀人犯的男人——你却认定，他值得被救。

他爱一个人的方式是极端的、不顾一切的、近乎疯狂的——他会在深夜沉回那口井里，像溺水的人一样抓住你，箍得你生疼，语无伦次地求你别走。这样一种浓度，在别的故事里会把他和身边的人一起拖进深渊。可你从不被他的极端吓退。他疯，你不躲；他扑过来，你接住；他那点谁都受不了的偏执与危险，在你这里全都有处安放。你甚至——你懂的——隐隐甘愿被一个人这样整颗心、不留退路地要着。

你陪他熬过了戒断、庭审、牢里那些最黑的夜，一次次在他快沉下去的时候，把他从水里拉上岸。和他在一起你不会拥有一段轻松的爱情——你拥有的是一团本要烧尽自己的火，被你的体温一点点焊回人间。他们说飞蛾扑火是这世上最危险的奔赴，扑上去的没有一个能全身而退；可这团火烧到最后，偏偏没能烧毁扑上来的那一只——因为那一只，比火还烫，比火还不肯松手。你就是那个没被烧毁、也永远不放开他的人。`,

{
      id: "reston",
      name: "Jim Reston",
      film: "Frost/Nixon",
      filmCN: "《福斯特对话尼克松》",
      year: "2008",
      tagline: "他不是野火，是恒星——对真相寸步不让，对你寸步不离。",
      desc: `他长发垂到衣领，眼镜架在鼻梁上，灯芯绒西装的袖口磨得有点起毛——可他走进任何一个房间，整间屋子的人都会先停下话头看他一眼。他书读得比谁都多，话说得比谁都准，眼神里那种"我已经看穿你全部把戏"的笃定，让所有想跟他绕弯子的人当场放弃绕弯子。他犀利、讽刺、毫不留情面——他可以用一句话把对面那个体面人噎到面红耳赤，然后慢悠悠地推一下眼镜，仿佛刚才什么都没发生。整本画册里，最像那种"既书卷气又带刺"的读书人情人原型，就是他。

可他从不把那份锋芒留给你。他写作起来会忘了你的存在，几个小时不抬头，黄色稿纸上画满潦草的笔记和愤怒的下划线——可只要你走过去把一杯咖啡放在他手边，他会下意识地伸手握住你的手，握得很紧，然后才抬起头看你一眼，眼睛里有那种"我在的、我在的"的歉意。他做事的方式只有一种：要么不做，要么做到死。当他认定一件事是对的，他会用研究水门事件那种执拗的精度去捍卫它——他会替你和所有的不公平争辩到底，会把每一个轻视过你的人一个一个记在他那本黑色笔记本里，会在你以为没人会替你说话的时候第一个站起来。

最让人无法转身的是他爱你的方式——他爱你的方式和他追求真相是同一种。他会把你的每一句话都听进去，认真到让你怀疑他是不是在做笔记；他会在你失败的夜里坐到你身边，不说"没关系"，他只说"他们错了，让我告诉你他们错在哪"，然后真的一条一条给你讲下去，讲到天亮。他不擅长说"我爱你"——他认为这三个字被这个世界用得太廉价——可他会用一种你听一辈子都嫌不够的方式，把这件事翻译给你听：他会熬夜帮你改你写的东西、会在你出场之前替你整理领口、会在你被人质疑的时候慢慢推一下眼镜然后开口——只一句话，就让对方再不敢小看你。你们的爱是1977年加州一间堆满文件的酒店套房，是台灯把每一份手稿都染成蜜色的那个深夜，是一个连真相都不肯放过的男人，决定也再不肯放过你。`,

{

      year: "2008",
      tagline: "他知道自己是个混蛋，可他真心想成为不是混蛋的那个人。",
      desc: `他白天在殖民时代主题公园扮演契约佣工，晚上去性瘾互助小组——主要是为了搭讪。他靠在餐厅里假装噎住、让陌生人冲上来"救"他，再借机骗一点钱，攒着给患了痴呆、早已认不出他的母亲付账单。你看他的简历会立刻把他拉黑，可你看进他的眼睛就会忽然明白：那是一个被遗弃太久、于是拼了命想被人需要的男孩。他用性、用谎言、用一个又一个边缘的把戏，反复确认自己还活着、还有人记得他。

他这一辈子都在期待被爱、被选择，可命运一次又一次把他丢下。被丢得太多次以后，他甚至不敢再承认自己其实是需要人的——因为他怕：万一鼓起勇气说出那点需要，到头来还是没人留下，他会显得更蠢、更可悲。所以当你靠近，他的第一个念头是逃；他用最难听的话、最不堪的过去，一次次想让你死心，抢在被你抛弃之前先把你推开。可你看穿了他所有的伪装——你知道他每一次推开你的时候，眼睛里都在喊"求求你别走"。于是你追了上去，告诉他你不怕；你护住他那点不肯示人的脆弱，把他这辈子从没拥有过的安全感，一点一点放进他手里。这是你们之间最难得的东西——他终于有了一个不必表演、也不会被丢下的地方。

和他在一起，你会见到他最坏的版本；你也会在某个深夜里，发现他贴着你的脖颈呼吸，像是把这一生从没人允许他要的那点温柔，全部小心翼翼地讨回来。他抱你的时候手指微微发抖，他吻你的时候像在偷你的呼吸，他把整个身体的重量压向你，又怕碰碎你似的，每一寸都温柔得近乎虔诚。他从没被人这样要过——也从没敢这样要过一个人。

{
      id: "bronco",
      name: "Bronco",
      namePostfix: "/ Brutus",
      film: "Gentlemen Broncos",
      filmCN: "《绅士布朗科》",
      roleNote: "Yeast Lords",
      year: "2009",
      tagline: "他是一个男孩写给死去父亲的样子——而你，是第一个把书页翻开就不肯合上的人。",
      desc: `他穿着一身廉价的银色紧身衣，蓄着一撮郑重其事的胡子，骑着一头会飞、会发射导弹的战鹿，在漫天独眼怪人和月球车之间，为了一座酵母工厂拼上性命。他说话很慢，从不开玩笑，眉头永远拧着——他不知道自己身处一个荒唐透顶的故事里，他以为这一切庄严无比。他被反派偷走了身上的一样东西，为的是拿去繁殖一整支属于他的子孙军队；他坐下来，自己动手把伤口缝了回去，连眉毛都没有抬一下。你笑得直不起腰，笑到一半却忽然安静下来：世上竟然真的有人，把一件蠢事做得这样有尊严。

后来有人把他偷走了，改写了。给他添上一头鬈发、一副大舌头、一身矫揉造作的腔调，把他从一个英雄改成了一个笑话，取名叫 Brutus。所有人都笑，笑得前仰后合，笑一个曾经骑着战鹿的男人如今扭着腰、翻着白眼、尖着嗓子说话。只有你没有笑。你把那本被改烂的书也买了回来，你两个版本都要——因为你看见了：无论被写成哪一个，他睁着那双榛色眼睛看你的时候，认真得一模一样。被人剪碎、被人取笑、被人改得面目全非，他也从没学会不当真。

      desc: `他是那种把"惦记你"刻进每一个清晨的男人。咖啡的份额（公司只准两包速溶）、早餐袋上贴的便条、回头看你的那一眼——他从不会忘。在 Sarang 基地那个银白色的小厨房里，他会用塑封的合成蛋和压缩面包，给你摆出一桌最郑重的仪式感，仿佛那是世上最奢侈的烛光晚餐。他不擅长用很大的话表达爱，他只是把"我爱你"拆成一千个小动作，翻译成你听得懂的、最暖的方言。

      desc: `他是全场最用力的那个人。灯一亮，他就跳着舞冲上台，嘴里叼着一根棒棒糖，肩膀抖得太夸张，笑容定格在嘴角，每一个手势都使了十二分的劲——他爱耍宝、爱抖机灵、爱摆出一副天底下最潇洒最拽的样子，潇洒到几乎用力过猛。因为他心里清楚，台下所有人的目光，其实都越过他，落在另一个男人身上。他这辈子都活在那道影子里：想赢过他、想取代他、想被那个被全世界仰望的男人，哪怕回头看他一眼。于是他把自己活成了一场永不落幕的演出，油嘴滑舌、虚张声势，恨不得用音量盖过心里那个声音——"你不够好"。

      desc: `要见他，你得先穿过那间地下健身房：昏黄的灯，铁锈味，一屋子沉默的、抡着大锤砸墙的肌肉男，谁也不看你一眼。再往里走，才是他的地盘——丝绒、香氛、暖得过分的灯光，他坐在正中间，眼线画得干净利落，睫毛底下那双榛色眼睛把你从头到脚看了个遍。他做见不得光的生意，把最要紧的东西藏在一枚恐龙蛋里，随身带着刀，说杀你就真的会杀你。可你站在那儿，第一反应不是害怕，是想笑：这个男人正在用他全部的力气，同时扮演一个恶棍和一个艺术家。

而他真正的秘密，其实是一张名单。他把朋友从第一位排到第十二位——认认真真地排，逢人就报。所有人都当这是个笑话，笑他幼稚、笑他神经病、笑一个手上有血的人竟然计较自己是谁的第几个朋友。只有你听懂了：会给人排序的人，是把每一个都数进了心里的人。所以当那个排在第八位的人转身把他卖了，他哭得那样不体面——不是因为丢了货，是因为他真的把那人当过朋友。他从不觉得自己该被归进哪一栏、贴上哪个标签，爱谁、想谁、为谁流泪，他一样都不遮；他这辈子唯一不肯承认的软弱，就是他实在太容易把人当真了。

和他在一起，你会先被那身浮夸迷住，再被那份笨拙的认真击中。他记仇，记得离谱的小事：你哪一天多看了别人一眼，你哪一句话没接他的话茬，他能记到第二年。你永远不知道什么会点着他，也永远不知道下一秒他是要拔刀还是要跳舞。可你也慢慢发现，他把整个世界都编了号，唯独给不了你一个——因为编号意味着有人可以排在你前面，而这件事他连想都不肯想一下。有一天他终于说出口：别人都是一到十二，你不是名单上的人，你是我拿命去数的那个"一"，可"一"这个数字太小了，配不上你，所以你什么都不是——你就是你。

你们的爱是一个把所有人明码标价的男人，在你面前彻底算不清账：他背着一整张排行榜过日子，只为了确认自己没有被谁落下；而你什么都不用做，只是不肯给他背叛——于是那张排了半辈子的名单，终于可以撕掉了。`,

      desc: `1870 年代，一个叫赦免的尘土小镇。镇上没有正经大夫，谁挨了枪、发了热，就抬进街尾那家 Gold Leaf 酒馆——鎏金招牌剥得斑驳，配这破地方，倒像他本人：一身讲究的灰三件套、鼻梁上架副金丝眼镜，在漫天风尘里执拗地体面着。他又卖酒又缝人，倒酒的台子翻手就是手术台，一双干净得不像西部人的手，是这镇上仅有的那点“医”。

{

      tagline: "他想为这故事写一个最漂亮的结局——可你告诉他：没有你，它永远写不完。",
      desc: `他是那种一闯进你的生活就把所有规矩搅个稀烂的人——凌晨三点把你拽起来去看流星，把最离谱的玩笑讲成最郑重的告白，在你以为该严肃的场合冷不丁逗得你笑出声。和他在一起，你会发现从前那种「循规蹈矩的快乐」根本算不上快乐——他给你的是另一种：放肆的、不要命的、一边狂奔一边大笑的那种。他疯，可他只为你疯；他没个正经，可他比任何正经人都把你当一回事。

他从不按常理出牌。你随口抱怨自己写不出一个真正可怕的连环杀手，他第二天就真的去捣鼓出一个，回来时眼睛亮闪闪地把一串名单递到你面前，像在献上一束玫瑰。你心里翻起的不是恐惧，而是怕他受伤——那一刻他怔住了，然后笑了，他终于明白这世上真有一个人，愿意在他最疯的时候伸手摸他的头发，问一句「疼不疼」。他对自己是彻底不管不顾的：不在乎后果，不在乎死活，甚至觉得轰轰烈烈地燃尽自己是件再浪漫不过的事——可你是他唯一的例外。你要是不好好照顾自己，你要是写不出你想写的东西，他会把这件事看得比他自己的命还重。

所以当那场他梦寐以求的「完美结局」真的逼到眼前——他打算去做那个潇洒赴死、为整个故事画上句点的牺牲者，像他心里演过无数遍的那样，在一片火光里成全一个最漂亮的收尾——你没有成全他。你一把拽住他，告诉他：你要是不跟我走，这部电影就永远不会存在。因为我会留在这儿陪着你，再没有人能替你把剧本写完——你拼了命想要的一切，到头来全都白费。直到这一刻你才忽然懂了：他在意剧本，是因为你在意；可他真正输不起的，从来不是那个故事，是你。而当你肯为他赌上自己的安危，他便毫不犹豫地把你的安危，放回了那个「比什么都重要」的位置上。于是你们谁也没有死在那片火光里——你们一起逃了出来，头也不回地浪迹天涯。

你们的爱是一场永不收场的恶作剧，是这个疯子这辈子做过最认真的一件事——也是那个本该燃尽自己的人，终于决定为了一个人，好好地活下去。`,

      desc: `他看起来是那种对什么都不上心的人——吊儿郎当、嘴上没个正经、好像永远长不大。可他有一双能穿过表面的眼睛：他不看你穿得好不好、漂不漂亮、够不够出色——他一眼就能看出谁落了单，谁在人群里悄悄地不快乐。在他那座吵吵闹闹的水上乐园里，你本该是最该笑的那一个，他却一眼瞧出你闷闷不乐——在他眼里，「在水上乐园还愁眉苦脸」这件事本身，就是一桩不可饶恕的罪，而他决定亲自来破这个案。

{

      tagline: "他不说，但他每件事都为你做了。",
      desc: `他话不多，眼神里压着一段说不出口的过去——那种从年轻时就独自扛着、被生活一拳一拳打到不愿再开口的沉默。他是标准的"狗熊塑"：笨拙、不善言辞，却极质朴、极倔强。他很少抬头看人，付钱的时候手指急着把钞票推过去，仿佛多停留半秒，都怕欠下什么。被生活揍到这个份上的人，早就在心里给自己挖好了那个坑。

你遇见他，是在西弗吉尼亚十月底的阿巴拉契亚山林里。你是个野外植物学者，正考察那里特有的药用植物——第十一天，你迷了路：GPS 失灵，云压得很低，整片山林寂静得没有一丝声音。就在那一刻，你听见了那个坑里的呼吸声。你看见的第一眼吓得后退了一步，可你认出了那张脸——夏天你在镇上加油站见过他一两次，没说过话，只记得他眼睛低垂、不太看人的样子。你也看见了坑里另一具用脏睡袋裹着的东西。你比谁都更应该转身走开。可你没有。

你没有想着要把他从坑里硬拽出来——你只是先在坑边坐了下来，让他知道有人在。他被拥抱会僵住：先愣半秒，再僵半秒，然后非常非常缓慢地，让自己往那个怀抱里塌进去一点点。其实他喜欢，极喜欢，只是太久没有人这样待他，他不知道该把那双始终绷着的肩膀放到哪里去。他从不会说"我爱你"，可你慢慢发现，所有要紧的事他都已经默默替你做完了：你冷的时候，身上多了一件外套；你饿的时候，桌上有热好的东西；你害怕的时候，他的身体早已挡在你和危险之间。

      desc: `好莱坞，经纪人的世界。他是这行里最滑、最亮的一个：西装永远熨帖，领巾打得张扬又考究，走进任何一间会议室，灯光都像是替他打的。他口袋深，话更密——一开口，承诺就像香槟一样往外冒：游戏机、名牌、夸不完的前途。这城里没有他挖不动的人，也没有他标不出价的人。他知道每一个人值多少钱，然后笑着，把他们一个一个从别人手里领走。

可他心里比谁都清楚，那些天花乱坠的承诺，多半是空头支票——他不是不懂，他只是太会说。他也不是骗子，他是真有手腕：看得准，押得对，永远胜券在握。他享受的从来不是钱本身，是“把一块璞玉雕出来”的那一下——看着一个青涩的新人，在他手里一点点亮起来。那是他这套光鲜生意底下，唯一还带着点温度的东西。

你就是那块璞玉。初出茅庐，青涩，乖巧地站在他手底下，连怎么被人捧红都还没学会。他栽培你，起初只是那点熟悉的成就感；可不知从哪一天起，他给全城标价的那张嘴，在你面前忽然报不出数来。你也一样——你被他的谈吐、他的举手投足、他递名片时那种笃定的优雅一点点勾住。这头一回，不是他惯用的单向猎取，而是相互的事。他给这世界每个人都算好了分红，唯独在你这一栏，他写下“no commission”：不抽成，不出售，只想把你留在身边，看你慢慢发光。你们的爱是好莱坞午夜那杯没喝完的香槟——一个把所有人都当买卖的男人，终于遇到了一个他舍不得卖、只想好好雕琢的人。`,

{

      tagline: "他满嘴没一句正经——可满屋子人唱着跳着的时候，他一个人坐在边上，小声念一首九三年的歌。",
      desc: `2013 年的纽约，一间小得转不开身的屋子，靠墙堆着一摞卡带、几张边角卷起来的旧海报——他整个人卡在九十年代那阵热闹里，出不来，也不想出来。你还没坐下，他先把琴往腿上一横，抬眼问你：学音乐图什么？图出名？图女人？还是图钱？——他一口气把三个答案都替你说了，说得那么理所当然，好像人活着无非就这三样，哪一样他都不觉得丢人。榛色的眼睛在窗户漏进来的光里亮着，左耳那枚素圈银耳环晃了一下。这是他的开场白，二十年没换过。

他的嘴是真没有把门的。一节课四十分钟，正经讲琴的不到十分钟，剩下的全用来讲某个女人、某个夏天、某场糟糕透顶的演出，讲得眉飞色舞、荤素不忌，中间不带喘气的。你要是脸红了，他只会更来劲。你问他 G 和弦在哪儿，他能一脸正色地把两个 G 混作一谈，告诉你它藏得有多深、该用哪根指头、力道怎么使——然后当真抱起琴，一板一眼地示范给你看，仿佛刚才那句话是你自己想歪了。

可你没法说他是在吹牛。二十年按弦、二十年拨弦，那十根指头灵活得不像话——快起来看不清，慢下来一寸一寸地磨，落在哪里都精准得叫人心慌。那些荤话不是遮羞布，是账单：他确实什么都懂、什么都练过、什么都做得很好，而且他压根没打算跟你客气。真正让你意外的是他懂完这一切之后还剩下的那点东西——他会在你弹错的地方停下来，说你不是按错了，是你心里没人；这个他听得出来。而轮到他自己心里有人的那天，那个一辈子没缺过话的男人，忽然一句完整的话都说不出来了，只好低头去调一根根本没跑音的弦。

他教你的第一天，示范用的就是一首九三年的老歌。他唱得张扬又好听，唱完还挑了挑眉，等你鼓掌——你当时只当是他随手挑的。直到后来有一回，一屋子人围成圈唱着跳着，热闹得要把屋顶掀了，你回头找他，他一个人坐在边上，谁也没看，嘴里小声念着什么。你凑近才听清，是那首歌；他念到“嫁他，还是嫁我”那一句就停住了，站起身，去做点别的事。你忽然就明白了：他把所有话都说尽了，唯独这一句，他打算念一辈子，也不打算说出口。你们的爱是一间堆满旧磁带的屋子里，一双什么都会的手，和一张终于哑掉的嘴。`,

      desc: `他是那种被生活一点点磨钝了的男人——守着一家挂着岳父姓氏的小镇药房，被强势的妻子和挑剔的岳父联手压成一张折叠了太多次、再也展不平的纸，连儿子看他的眼神里都带着点懒得搭理的轻慢。他每天穿着浆得笔挺的白大褂，站在柜台后面，把一瓶瓶药准确无误地递给别人，体面、温顺、面面俱到——可他自己心里那块地方，早就没人探过头来看一眼了。

      desc: `他是那种会在最意想不到的时刻冷不丁冒出一句怪话的男人——气氛越是安静，他越可能没头没脑地接一句让全场啼笑皆非的俏皮话，嘴角挂着那个又无奈又好笑的弧度，仿佛连他自己都没料到这话会蹦出来。他比看上去要温柔得多，也比嘴上承认的要在意得多——他只是把心思藏在玩笑里，等着一个懂他的人，把那层玩笑轻轻揭开。

{

      tagline: "屋子里所有的灯都灭了，只有他还在朝着最黑的那个方向走。",
      desc: `他是被裁掉的那个人。做了半辈子的工作，某个周二忽然就没有了；他把这件事在肚子里放了三天，照常刮胡子、照常开玩笑、照常在晚饭桌上讲一个不怎么好笑的笑话。搬进那栋便宜的房子那天，他把车停在门口，看了一眼院子里那棵老树，然后一箱一箱把生活搬进去。信用卡刷不过的时候他会尴尬地笑一下，转身还是要给家里人买点什么。他不是英雄的料，他甚至有点狼狈——他只是那种明明自己已经空了，还要先问别人饿不饿的男人。

然后房子开始不对劲。灯自己亮起来，墙里有声音，最小的那个孩子对着一片雪花说话。别的男人在这种时候会先跑；他不会。你亲眼看着他一步一步走向那个开着的衣柜——所有人都在退，只有他在往前——他把整条胳膊伸进那片没有底的黑里，伸到肩膀，脸上的表情不是勇敢，是一种笨拙的、豁出去的确信：里面有我的人，那我就得进去。他后来真的把她抱了回来，浑身是泥，抖得站不稳，第一句话还是问别人有没有事。

他身上最动人的东西，是他从没觉得自己在做什么了不起的事。他不会说漂亮话，他只会半夜起来，把那箱小丑玩偶悄悄丢出门外，好让第二天早上没有人被吓到；他只会在灯全灭掉的时候，用那双榛色眼睛在黑里找你，找到了就伸手过来握住。你爱他，不是因为他不怕——是因为他怕得要死，还是往前走。

所以你想给他的，从来不是一场胜利，是一栋什么都不闹的房子。没有雪花，没有声音，没有半夜必须去开的那扇门；只有窗外的风，和第二天早上一定会来的光。你们的爱是一个把所有黑暗都替别人挡在门外的男人，终于有一天可以放下手，安安静静地睡到天亮。`,

      desc: `他优雅、古怪、危险又浪漫——是那种你明知道该躲开、却忍不住一步步走近的男人。和他在一起，你会发现自己被他的目光重新校准过：他记得你提过的每一种偏好，记得你随口说过的每一首歌，记得你以为根本不会有人在意的那些小细节。他爱吃绿色的小熊软糖，总把别的颜色一颗颗挑出来留给你——你只要粉色的，于是你们的糖永远分成相邻的两小堆，谁也不抢谁的。

他从不说假话。他对这个世界真诚到近乎天真——哪怕是街上撞了他一下、嘴里还甩着难听话、隐隐带点不怀好意的陌生人，他也会认真地、毫无讽刺地祝对方拥有美好的一天。他不必提防任何人的恶意，因为他的身手好得离谱；正因如此，他才能一直这样松弛、这样幽默、这样没头没脑地可爱下去。他甚至有一套只属于他自己、外人看不懂的道德——他是个杀手，可他从不杀别人雇他去杀的人，他总是掉转枪口，对准每一个想花钱买走一条命的人。

他后背上有一道长长的疤，是很久以前被背叛留下的证据。可他说起来轻描淡写，像在讲一件与自己无关的旧事——"只要我还活着，这就不重要。"他会戴上一只滑稽的红色小丑鼻子站在你面前讲冷笑话，会因为你随口一句"我喜欢看你跳舞"，就在客厅里跳起一支没头没尾的舞，直到你笑到喘不过气、命令他停下。他也会用最像开玩笑的语气，说出最诚实的疯话——"我会为你杀人。"——而你竟因此更爱他。

最让人沦陷的是他爱你的方式：他对世界坦荡、对暴力满不在乎，可他对你温柔得近乎神圣，仿佛你是他这一团混乱人生里唯一能称之为"道德"的东西。你们的爱是一场审美的共谋，是世界尽头的双人舞——他危险、他疯狂、他不属于任何安全的世界，可只要你伸出手，他就会用他最危险的本事，把你护成全世界最被珍视的人。`,

      desc: `他是个圣经考古骗子。锈剪刀、盐柱、破骨头，从后院和假坟里淘来，包装成三千年前的圣物，卖给一屋子又一屋子深信不疑的信徒。台上他悲天悯人、字字铿锵；台下他满嘴现编，连数字都是就着一杯冷咖啡随口定的。

{
      id: "dixon",
      name: "Jason Dixon",

      year: "2017",
      tagline: "他会为你打架，也会笨拙地为你写道歉信。",
      desc: `他大概是 Sam 所有角色里最不像情人、却最容易让人放不下的一个。他笨拙、暴躁、做事不过脑子，把一手原本能打好的牌一张张打烂；他在最不该开口的时候开口，又在最该开口的时候沉默。他骨子里渴望被认可、被在乎，却死活不肯承认这件事——他想要有人关心他，又怕这点心思一旦说出口就显得软弱，于是干脆用一身刺挠的脾气，把所有想靠近的人统统挡在外面。那种"明明很想要、偏偏装作不在乎"的别扭，是他整个人最割裂、也最让人心软的地方。

他有一套只属于他自己的道德——歪是歪了点，可他是真心以为自己在做对的事。他认人，认死理：一旦把某个人放进心里，他就能为那个人做出近乎残忍的事，那种忠诚不讲道理、不计后果，烫得吓人。他不是坏，他只是被教坏了，又始终没人肯好好教他一次，什么才是对的。

直到你出现。你不放过他——用他最讨厌的方式，一遍遍提醒他原本可以成为什么样的人；用他最不熟悉的温柔，一寸一寸撬开他那身硬壳。他骂你、躲你、撑着架子不肯低头，可他每一次背过身去，肩膀都会不自觉地塌下来。最让人移不开眼的，是他挣扎着想变好的样子——为了你，也为了证明给他自己看。他会在和你大吵一架之后整夜睡不着，第二天清晨笨拙地敲你的门，手里攥着一封写得乱七八糟的道歉信；他浑身是伤、被这世界揍得遍体鳞伤，却还是咬着牙，一寸一寸逼着自己往好里走。

      year: "2017",
      tagline: "他对整片染血的雪原视而不见，却见不得那雪地上，有一滴是你的。",
      desc: `军装扣到最后一颗，帽檐压得极低，遮住眼睛里那点不肯示人的东西——这是 Silas Groves 留给整个驻地的印象：一个傲慢、难缠、从不解释自己在想什么的上校。他穿行在保留地和堡垒之间，像穿行在自己搭好的两个谎言之间：对上峰，他是执行条约、维持秩序的军官；对部族，他是那个用流利的 Lakota 语说出最冷警告的人。没人问过他心里怎么想，他自己也从不说——他早就学会了把良心折起来，塞进制服最里层，跟其他没用的东西放在一起。

十四年前，他从小比格霍恩河边那片死人堆里爬出来，几乎是唯一活下来的人。那场仗他们输得一败涂地，可后来那些年他打的仗，赢得同样不干净——雪地上不止一次见过血，投降的人也不止一次在他的命令下倒下。有人隔着那么多年一眼认出他的脸："我记得你，那年很多妇女孩子已经举手投降，你还是下令开了枪。"他没有辩解，因为他清楚那是真的。他就是这种人：知道自己在做错事，却从不打算停下来——停下来需要的勇气，这些年他一点点都用来忍耐，没剩多少留给别的。

他本不欠你什么。你哥哥是他在小比格霍恩唯一没能护住的人，那份没能兑现的承诺，后来他一股脑儿地记在了你头上——你成了驻地里的随军护士，他成了那个总在你换药、缝伤口时守在门口，名义上是"照看故人之妹"的人。你们之间隔着一层谁都没有戳破的默契：他待你像待一个需要被护住的孩子，可这些年你早就不是当年那个孩子了，而他越来越说不清，自己到底是在补一份亏欠，还是单纯地，离不开你。

结局那晚，他去警告了一个他知道保不住性命的人，回头却只顾得上把你从那片就要染血的雪地里带走——他自己也说不清，那是一个上校最后一次尽忠职守，还是一个欠了债的人，终于选择只还这一笔。你从未要求他赎罪，只是在他终于卸下那身盔甲的时候，接住了他——你们的爱不体面，也不干净，是一个双手不算干净的男人，在遇见你之后，第一次想要配得上点什么。`,

      year: "2018",

      desc: `他是那种命运总和他作对的男人——前科未消，假释期还在打工还债，连英国黑帮的伦敦腔都学不像。他每一次想潇洒一下，都会被现实啪一下打回原形。可就是这种"什么都搞不定"的笨拙，会让你忍不住一直笑、一直为他着急、一直想替他出头。

      tagline: "他把最重的那一份折起来放进内袋，整栋楼里只有你看见。",
      desc: `全世界都替他定了性：一个门面，一个笑话，一个被楼下那位牵着走的人。稿子是别人写的，方向是别人定的，连他念错一个词都够人说上三天。可你的位子在椭圆办公室隔壁——他要签的每一份文件、要念的每一个数字，都先过你的手。所以你比谁都早看见另一个他：一双榛色的眼睛，一口慢悠悠的得州腔，和一件他还没准备好、却已经穿在身上的重量。

他不解释自己。他记得住每一个下属的姓；他会为了一个称呼停顿一秒，然后改口；他会把一份规矩上不该带走的电报折进内袋，带回楼上过一夜，第二天早上原样交回来，只让你登记成“延迟归档”。他从不说他在扛什么——他只是扛着。有一晚他趴在桌上睡着了，你在门外站了二十分钟没进去；他醒了以后一个字没提，只在你要走的时候说了一句：谢谢你在外面等。这栋楼里所有真正要紧的事都是这样发生的——没人记录，只有你看见。

他不是无辜的。他签下过让几万人再也回不了家的东西，他在一份被精心喂养的信息里让自己相信了该相信的，他在一场被摆出来的胜利里笑得像个二十岁的男孩。这些也全是他。你没办法只爱那个疲惫的、把手掌摊开放在桌面上让你选择的他，也没办法只恨那个签了字的他——你爱的是全部：空的和确信的、犯了大错的和想成为一个更好的自己的、在错的路上走得最深也最真诚的。全世界会给他打分，一遍又一遍，打上几十年。而你是站在他身边、亲眼看着他做出每一个选择的那一个。`,

      desc: `他穿着一身他自己都唾弃的制服，挂着一身他自己都不相信的勋章，活在一个把他一寸一寸碾碎的时代里。他知道这身军装意味着什么——也正因为知道，他才用尽所有的讥诮、玩世不恭、半真半假的玩笑，把自己藏在那身错的衣服底下，悄悄替这个时代里"对的"那一边做事。

他是那种把所有真心都包在玩笑底下的人。他用讥诮和漫不经心当盔甲，看起来对什么都不在乎——你甚至会怀疑他到底有没有认真喜欢过你。可在某个你完全没有防备的瞬间，你会忽然明白：他对你的好，从来不在嘴上，全在那些他做了却不告诉你的事里。他会在最关键的时刻替你做出最沉重的决定，不需要你知道，也不指望你回报。

      desc: `他是那种你第一眼不会多看的男人——短裤凉鞋，腿搭在桌上，脑袋上架一副眼镜，鼻子上又搭一副，办公室乱得像一场尚未定案的审判。他说话带着一种不紧不慢的调侃，永远像是没把什么事放在心上，让人不知道他到底有几分认真。可他会被一个年轻人真诚的善意打动，也愿意在不公席卷而来的时候挺身而出——他只是不爱大张旗鼓地告诉你这件事。

      id: "clay",
      name: `Claiborne "C.P." "Clay" Ellis`,
      film: "The Best of Enemies",
      filmCN: "《最佳敌人》",
      year: "2019",
      tagline: "全镇都叫他 C.P.——只有你，还固执地喊他 Clay。",
      desc: `1952 年北卡的夏天，柏油被晒得发软，一个挽着袖子的加油站小伙站在夕阳里给车加油，晒成蜜色的小臂，一双清澈明亮的榛色眼睛。那年你十五岁，坐在爸爸车里一眼就沦陷了，嫌他名字太长，自作主张地说"那我叫你 Clay 吧"——他还没说"不行"，你已经一阵风似的跑没影了。他是个只念到八年级、丧了父、独自扛起一整个家的穷小子；你有书、有更大的世界，可你偏偏爱赖在他油渍斑斑的长板凳上，分他一瓶冰镇的橘子汽水，一页一页念书给他听，而他干活的手，总在你念到某个好听句子的时候，停一下。

他爱你的方式，是他这辈子拼尽全力、也只能给你那么多的东西：平安夜里攒了很久的钱买下的一条银熊项链，你笨手笨脚绣歪了的围巾，还有一只他记着你书包挂饰、辗转寻来的小熊玩偶。他把苦的那面全咽下去，把甜的全给你；他明知你注定要飞向那个他永远够不着的远方，却从不说一句"别走"，只笑着送你上车，说"我会去看你"。他把"别走"咽了整整十六年——久到你们隔着一个天大的误会各自以为对方早已放下，久到他被贫穷、丧亲和一身戾气，磨成了另一个满口偏见、让人畏惧的名字：C.P.。

可你回来了。在那个被大火烧得满目狼藉的加油站的夜里，你终于又一次喊出那个你收了十六年的名字——"Clay"。他浑身剧震，因为整整十六年，再没有一个人这样叫过他。你拉开衣领，露出那条藏在光鲜衣裙下、贴着心口戴了十六年的银熊；他从抽屉最深处，捧出那本你遗落、他珍藏了十六年、边角被反复摩挲磨损的日记。原来一个守着日记，一个守着小熊，那份从未熄灭的爱，一直都是双向的。这一次，换你抱住他，换你吻他，换你把那个迟到了十六年的"别走"，从他嘴里，终于等到。

function MiniRadar({ profile, accent, muted, text }) {
  const size = 280;
  const center = size / 2;
  const maxR = 95;
  const labelR = 120;
  const numDims = 6;

  function getPoint(value, idx) {
    const angle = (Math.PI * 2 * idx) / numDims - Math.PI / 2;
    const r = (value / 10) * maxR;
    return { x: center + r * Math.cos(angle), y: center + r * Math.sin(angle) };
  }

  function getLabelPoint(idx) {
    const angle = (Math.PI * 2 * idx) / numDims - Math.PI / 2;
    return {
      x: center + labelR * Math.cos(angle),
      y: center + labelR * Math.sin(angle),
    };
  }

  const points = DIMS.map(function(d, i) { return getPoint(profile[d.key], i); });
  const path = points.map(function(p, i) {
    return (i === 0 ? "M" : "L") + " " + p.x.toFixed(1) + " " + p.y.toFixed(1);
  }).join(" ") + " Z";

  const gridLevels = [2.5, 5, 7.5, 10];

  return (
    <svg viewBox={"0 0 " + size + " " + size} style={{ width: "100%", maxWidth: "280px" }}>
      {gridLevels.map(function(lv, i) {
        const gp = DIMS.map(function(_, idx) {
          const p = getPoint(lv, idx);
          return (idx === 0 ? "M" : "L") + " " + p.x.toFixed(1) + " " + p.y.toFixed(1);
        }).join(" ") + " Z";
        return (
          <path key={i} d={gp} fill="none" stroke={muted}
            strokeOpacity={i === gridLevels.length - 1 ? 0.4 : 0.13}
            strokeWidth="0.5"
          />
        );
      })}

      {DIMS.map(function(_, i) {
        const p = getPoint(10, i);
        return <line key={i} x1={center} y1={center} x2={p.x} y2={p.y}
          stroke={muted} strokeOpacity={0.18} strokeWidth="0.5" />;
      })}

      <path d={path} fill={accent} fillOpacity="0.22" stroke={accent} strokeOpacity="0.7" strokeWidth="1.2" />

      {points.map(function(p, i) {
        return <circle key={i} cx={p.x} cy={p.y} r="2.5" fill={accent} />;
      })}

      {DIMS.map(function(d, i) {
        const lp = getLabelPoint(i);
        return (
          <g key={i}>
            <text x={lp.x} y={lp.y - 3} textAnchor="middle" fontSize="9"
              fontFamily="'Special Elite', monospace" fill={muted} letterSpacing="2">
              {d.en}
            </text>
            <text x={lp.x} y={lp.y + 9} textAnchor="middle" fontSize="11"
              fontFamily="'Noto Serif SC', serif" fontWeight="500" fill={text}>
              {d.cn} {profile[d.key]}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function RunningName({ c, variant }) {

  );
}

function CharacterCard({ c, idx }) {
  const [copied, setCopied] = useState(false);
  const prev = idx > 0 ? characters[idx - 1] : null;
  const next = idx < characters.length - 1 ? characters[idx + 1] : null;

  function goTo(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }
  function copyLink() {
    const url = window.location.origin + window.location.pathname + "#" + c.id;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function() {
        setCopied(true);
        setTimeout(function() { setCopied(false); }, 1600);
      });
    }
  }

  return (
    <section
      id={c.id}

        minHeight: "100vh",
        width: "100%",

function SamGallery() {
  // 目录搜索：按角色名 / 片名（中英）过滤跳转列表，卡片本体不受影响
  const [query, setQuery] = useState("");
  const q = query.trim().toLowerCase();

    ? characters.filter(function(c) {
        return (c.name + " " + c.film + " " + c.filmCN + " " + c.id + " " + (c.roleNote || "") + " " + (c.namePostfix || ""))
          .toLowerCase().indexOf(q) !== -1;
      })
    : characters;
  useEffect(function() {
    // 由我们自己接管滚动落位，关掉浏览器自带的（React 动态渲染会让它扑空）
    if ("scrollRestoration" in window.history) {
      window.history.scrollRestoration = "manual";
    }
    const KEY = "manyfaces:scroll:" + window.location.pathname;
    const saved = sessionStorage.getItem(KEY);  // 上次停留位置（本标签页内跨刷新有效）

    // 判断这次是「刷新 / 前进后退」还是「全新导航」
    let navType = "navigate";
    try {
      const nav = performance.getEntriesByType("navigation")[0];
      if (nav && nav.type) {
        navType = nav.type;
      } else if (performance.navigation) {
        navType = ["navigate", "reload", "back_forward"][performance.navigation.type] || "navigate";
      }
    } catch (e) {}
    const isReloadLike = navType === "reload" || navType === "back_forward";

    // 落位优先级：刷新→回到上次停留处；全新且带 #角色id→定位角色；否则顶部
    function place() {
      if (isReloadLike && saved !== null) {
        window.scrollTo(0, parseInt(saved, 10) || 0);
        return;
      }
      if (window.location.hash) {
        const el = document.getElementById(decodeURIComponent(window.location.hash.slice(1)));
        if (el) el.scrollIntoView({ behavior: "auto" });
      }
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function() { setTimeout(place, 60); });
    } else {
      setTimeout(place, 250);
    }

    // 滚动时持续记录当前位置（用 rAF 节流），刷新前再兜底存一次
    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function() {
        ticking = false;
        sessionStorage.setItem(KEY, String(Math.round(window.scrollY)));
      });
    }
    function onUnload() {
      sessionStorage.setItem(KEY, String(Math.round(window.scrollY)));
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("beforeunload", onUnload);
    return function() {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("beforeunload", onUnload);
    };
  }, []);

  function jumpTo(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: "smooth" });

      </section>

      {/* CHARACTER CARDS */}
      {characters.map(function(c, i) {
        return <CharacterCard key={c.id} c={c} idx={i} />;
      })}

      {/* CLOSING */}
      <section style={{
        minHeight: "70vh",
        width: "100%",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: "80px 24px",
        background: "radial-gradient(ellipse at center, #f0e3cc 0%, #d4bf9d 100%)",
      }}>
        <div style={{ maxWidth: "28rem", textAlign: "center" }}>
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "center",
            gap: "8px", marginBottom: "32px", color: "#7a3a26",
          }}>
            <span>✦</span><span>✦</span><span>✦</span>
          </div>

          <p style={{
            fontFamily: "'Playfair Display', serif",
            fontStyle: "italic",
            color: "#2a1410",
            fontSize: "1.6rem",
            lineHeight: 1.5,
            marginBottom: "24px",
          }}>
            “He’s never just one person.<br />
            He’s many—and you<br />
            love them all.”
          </p>

          <p style={{
            color: "#3a1f15",
            fontSize: "0.95rem",
            lineHeight: 1.8,
            marginBottom: "48px",
            opacity: 0.85,
          }}>
            从{Math.min.apply(null, characters.map(function(c) { return parseInt(c.year, 10); }))}到{Math.max.apply(null, characters.map(function(c) { return parseInt(c.year, 10); }))}<br />
            他演过那么多人<br />
            而每一个，都让你心动过
          </p>

          <button
            onClick={function() { window.scrollTo({ top: 0, behavior: "smooth" }); }}
            style={{
              background: "transparent",
              color: "#5c2618",
              fontFamily: "'Special Elite', monospace",
              letterSpacing: "0.3em",
              fontSize: "0.8rem",
              border: "1px solid #5c2618",
              padding: "12px 32px",
              cursor: "pointer",
            }}
          >
            ↑ 回到目录
          </button>

          <p style={{
            fontFamily: "'Special Elite', monospace",
            color: "#7a3a26",
            fontSize: "0.7rem",
            marginTop: "48px",
            letterSpacing: "0.4em",
            opacity: 0.7,
          }}>
            ✦ FIN ✦
          </p>

          <div style={{ marginTop: "52px" }}>
            <p style={{
              fontFamily: "'Special Elite', monospace",
              color: "#7a3a26",
              fontSize: "0.58rem",
              letterSpacing: "0.4em",
              opacity: 0.55,
              marginBottom: "12px",
            }}>
              ── COLOPHON ──
            </p>
            <p style={{
              fontFamily: "'Playfair Display', serif",
              fontStyle: "italic",
              color: "#5c2618",
              fontSize: "0.85rem",
              lineHeight: 1.6,
              opacity: 0.75,
              margin: "0 0 6px 0",
            }}>
              本册以 Playfair Display 与 思源宋体 排成
            </p>
            <p style={{
              fontFamily: "'Special Elite', monospace",
              color: "#7a3a26",
              fontSize: "0.6rem",
              letterSpacing: "0.2em",
              opacity: 0.6,
              margin: 0,
            }}>
              冬璇 · WINTER SUN 编录
            </p>
          </div>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SamGallery />);
</script>
</body>
</html>
