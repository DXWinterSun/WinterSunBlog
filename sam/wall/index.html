<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signatures · 台词签名墙 · Winter Sun</title>
<meta name="description" content="Sam Rockwell 四十个角色，两百句只对你说的话。每天回来，都有新的一句。">
<meta property="og:type" content="website">
<meta property="og:title" content="Signatures · 台词签名墙 · Winter Sun">
<meta property="og:description" content="四十个角色，两百句只对你说的话。每天回来，都有新的一句。">
<meta property="og:url" content="https://dxwintersun.github.io/WinterSunBlog/sam/wall/">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="/WinterSunBlog/images/heading-normal.png">
<link rel="shortcut icon" href="/WinterSunBlog/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/WinterSunBlog/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700;1,900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Special+Elite&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { background: #14110d; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: rgba(203,161,76,.3); }
</style>
</head>
<body>
<div id="root"></div>
<meta name="cache-bust" content="20260704-wall-2-pool">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const SERIF = "'Noto Serif SC', serif";
const DISPLAY = "'Playfair Display', serif";
const GARA = "'Cormorant Garamond', serif";
const TYPE = "'Special Elite', 'Courier New', monospace";

function todayIndex(n) {
  const d = new Date();
  const start = Date.UTC(2026, 1, 13); // 2026-02-13, the day it began
  const today = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((today - start) / 86400000);
  return ((days % n) + n) % n;
}

// merge a character's meta with one of its quotes → same shape as a pool item
function mergeQ(c, q) {
  return {
    charId: c.id, name: c.name, film: c.film, filmCN: c.filmCN, year: c.year,
    accent: c.accent, bg: c.bg, text: c.text, muted: c.muted, auLink: c.auLink,
    label: q.label, line: q.line, lineCN: q.lineCN, kind: q.kind,
  };
}

function Signed({ c }) {
  return (
    <div style={{ fontFamily: GARA, fontSize: 16, color: c.muted, fontStyle: "italic" }}>
      — {c.name} <span style={{ fontStyle: "normal" }}>·</span> {c.filmCN} <span style={{ opacity: .7 }}>{c.year}</span>
    </div>
  );
}

function Hero({ c, onDraw }) {
  return (
    <div style={{
      position: "relative", borderRadius: 18, overflow: "hidden",
      background: "linear-gradient(155deg, " + c.bg + " 0%, #0d0b08 120%)",
      border: "1px solid " + c.accent + "40",
      boxShadow: "0 30px 80px -40px " + c.accent + "55, inset 0 1px 0 " + c.accent + "22",
      padding: "42px 30px 34px",
    }}>
      <div style={{
        position: "absolute", top: -40, right: -20, fontFamily: DISPLAY, fontStyle: "italic",
        fontSize: 200, lineHeight: 1, color: c.accent, opacity: .08, pointerEvents: "none",
      }}>&ldquo;</div>

      <div style={{
        fontFamily: TYPE, fontSize: 11, letterSpacing: 3, color: c.accent,
        textTransform: "uppercase", marginBottom: 22,
      }}>{c.label}</div>

      <blockquote style={{ margin: 0 }}>
        <p style={{
          margin: 0, fontFamily: GARA, fontStyle: "italic", fontWeight: 500,
          fontSize: "clamp(24px, 6.5vw, 38px)", lineHeight: 1.34, color: c.text,
          letterSpacing: .2,
        }}>{c.line}</p>
        <p style={{
          margin: "18px 0 26px", fontFamily: SERIF, fontWeight: 300,
          fontSize: "clamp(15px, 4vw, 18px)", lineHeight: 1.85, color: c.text, opacity: .82,
        }}>{c.lineCN}</p>
      </blockquote>

      <Signed c={c} />

      <div style={{ display: "flex", gap: 14, alignItems: "center", marginTop: 28, flexWrap: "wrap" }}>
        <button onClick={onDraw} style={{
          fontFamily: SERIF, fontSize: 14, fontWeight: 500, color: "#14110d",
          background: c.accent, border: "none", borderRadius: 999,
          padding: "11px 22px", letterSpacing: 1,
        }}>再抽一句 &rarr;</button>
        {c.auLink && (
          <a href={c.auLink} style={{
            fontFamily: SERIF, fontSize: 13, color: c.accent, textDecoration: "none",
            borderBottom: "1px solid " + c.accent + "55", paddingBottom: 2,
          }}>读他的 AU &rarr;</a>
        )}
      </div>
    </div>
  );
}

// a single quote inside a character's collection
function QuoteCard({ c, q, active, onClick }) {
  const [hover, setHover] = useState(false);
  const lift = hover || active;
  const edge = active ? c.accent + "aa" : lift ? c.accent + "44" : "#2a241b";
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        textAlign: "left", width: "100%", display: "block",
        background: lift ? "linear-gradient(160deg, " + c.bg + " 0%, #100e0a 130%)" : "#181510",
        borderTop: "1px solid " + edge, borderRight: "1px solid " + edge, borderBottom: "1px solid " + edge,
        borderLeft: "3px solid " + c.accent,
        borderRadius: 12, padding: "16px 16px 18px",
        transform: lift ? "translateY(-3px)" : "none",
        transition: "transform .25s ease, border-color .25s ease, background .25s ease",
        boxShadow: lift ? "0 20px 44px -28px " + c.accent + "77" : "none",
      }}>
      <div style={{
        fontFamily: TYPE, fontSize: 9, letterSpacing: 1.6, color: c.accent,
        textTransform: "uppercase", marginBottom: 11, opacity: .9,
      }}>{q.label}</div>
      <p style={{
        margin: 0, fontFamily: GARA, fontStyle: "italic", fontSize: 18, lineHeight: 1.36,
        color: c.text,
      }}>{q.line}</p>
      <p style={{
        margin: "9px 0 0", fontFamily: SERIF, fontWeight: 300, fontSize: 13,
        lineHeight: 1.7, color: c.text, opacity: .66,
      }}>{q.lineCN}</p>
    </button>
  );
}

// one character = a collapsible collection of quotes
function CharacterGroup({ c, activeLine, onPick, isOpen, onToggle }) {
  const [hover, setHover] = useState(false);
  const hasActive = c.quotes.some(function (q) { return q.line === activeLine; });
  const edge = isOpen || hover ? c.accent + "55" : "#2a241b";
  return (
    <div style={{ marginBottom: 12 }}>
      <button onClick={onToggle}
        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        style={{
          width: "100%", textAlign: "left", display: "flex", alignItems: "center", gap: 11,
          background: isOpen ? "#1c1811" : "#181510",
          borderTop: "1px solid " + edge, borderRight: "1px solid " + edge, borderBottom: "1px solid " + edge,
          borderLeft: "3px solid " + c.accent,
          borderRadius: 12, padding: "15px 18px",
          transition: "background .2s ease, border-color .2s ease",
        }}>
        <span style={{ fontFamily: DISPLAY, fontWeight: 700, fontSize: "clamp(19px,4.4vw,25px)", color: c.text, lineHeight: 1.1 }}>
          {c.name}
        </span>
        <span style={{ fontFamily: GARA, fontStyle: "italic", fontSize: 15, color: c.muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
          {c.filmCN} <span style={{ opacity: .7 }}>{c.year}</span>
        </span>
        {hasActive && (
          <span title="今天这句在这里" style={{ flexShrink: 0, width: 6, height: 6, borderRadius: "50%", background: c.accent, boxShadow: "0 0 8px " + c.accent }}></span>
        )}
        <span style={{ flex: 1 }}></span>
        <span style={{ flexShrink: 0, fontFamily: TYPE, fontSize: 10, letterSpacing: 1, color: c.muted }}>{c.quotes.length} 句</span>
        <span style={{ flexShrink: 0, fontFamily: GARA, fontSize: 20, color: c.accent, display: "inline-block",
          transform: isOpen ? "rotate(90deg)" : "none", transition: "transform .25s ease" }}>&rsaquo;</span>
      </button>

      {isOpen && (
        <div style={{
          display: "grid", gap: 13, marginTop: 13, marginBottom: 8,
          gridTemplateColumns: "repeat(auto-fill, minmax(min(100%, 258px), 1fr))",
        }}>
          {c.quotes.map((q, qi) => (
            <QuoteCard key={qi} c={c} q={q} active={q.line === activeLine}
              onClick={() => onPick(mergeQ(c, q))} />
          ))}
          {c.auLink && (
            <a href={c.auLink} style={{
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: SERIF, fontSize: 13, color: c.accent, textDecoration: "none",
              border: "1px dashed " + c.accent + "55", borderRadius: 12, padding: "16px",
              minHeight: 60,
            }}>读他的 AU &rarr;</a>
          )}
        </div>
      )}
    </div>
  );
}

function Centered({ children }) {
  return (
    <div style={{ minHeight: "70vh", display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: GARA, fontStyle: "italic", fontSize: 20, color: "#8a7558", textAlign: "center", padding: 30 }}>
      {children}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(false);
  const [hero, setHero] = useState(null);
  const [open, setOpen] = useState({});

  useEffect(() => {
    fetch("../lines.json", { cache: "no-cache" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var h = d.pool[todayIndex(d.pool.length)];
        var o = {}; o[h.charId] = true;
        setData(d); setHero(h); setOpen(o);
      })
      .catch(function () { setErr(true); });
  }, []);

  if (err) return <Centered>今天的一句，暂时没能取到。<br />请检查网络后刷新。</Centered>;
  if (!data || !hero) return <Centered>正在把他的话一句句取回来……</Centered>;

  const pool = data.pool;
  function draw() {
    let n = Math.floor(Math.random() * pool.length);
    let guard = 0;
    while (pool[n].line === hero.line && guard++ < 12) n = Math.floor(Math.random() * pool.length);
    var h = pool[n];
    setHero(h);
    setOpen(function (o) { var x = Object.assign({}, o); x[h.charId] = true; return x; });
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function pick(q) {
    setHero(q);
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function toggle(id) { setOpen(function (o) { var x = Object.assign({}, o); x[id] = !o[id]; return x; }); }
  function setAll(v) {
    var o = {};
    if (v) data.characters.forEach(function (c) { o[c.id] = true; });
    setOpen(o);
  }

  return (
    <div style={{ maxWidth: 1120, margin: "0 auto", padding: "clamp(28px,6vw,64px) clamp(18px,5vw,40px) 90px" }}>

      <header style={{ textAlign: "center", marginBottom: "clamp(30px,6vw,52px)" }}>
        <a href="/WinterSunBlog/sam/" style={{
          fontFamily: SERIF, fontSize: 12.5, color: "#8a7558", textDecoration: "none",
          letterSpacing: 2, display: "inline-block", marginBottom: 26,
        }}>&larr; 回到 Sam</a>
        <h1 style={{
          margin: 0, fontFamily: DISPLAY, fontWeight: 700, fontStyle: "italic",
          fontSize: "clamp(40px, 10.5vw, 72px)", lineHeight: 1.02, color: "#ede2d0",
          letterSpacing: .5,
        }}>Signatures</h1>
        <div style={{
          fontFamily: SERIF, fontWeight: 500, fontSize: "clamp(15px, 4.4vw, 20px)",
          letterSpacing: 8, color: "#c9b48c", marginTop: 16, paddingLeft: 8,
        }}>台词签名墙</div>
        <p style={{
          margin: "22px auto 0", maxWidth: 500, fontFamily: SERIF, fontWeight: 300,
          fontSize: "clamp(14px,3.8vw,16px)", lineHeight: 2, color: "#a08b6b",
        }}>
          四十个角色，两百句只对你说的话。<br />
          上面这句，是<span style={{ color: "#cba14c" }}>今天的</span>——每天回来，都会换一个人开口。
        </p>
      </header>

      <Hero c={hero} onDraw={draw} />

      <div style={{ display: "flex", alignItems: "center", gap: 16, margin: "clamp(46px,8vw,72px) 0 18px" }}>
        <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, transparent, #3a3226)" }}></span>
        <span style={{ fontFamily: TYPE, fontSize: 11.5, letterSpacing: 3, color: "#8a7558", textTransform: "uppercase", whiteSpace: "nowrap" }}>
          他们的语录集 · The Collections
        </span>
        <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, #3a3226, transparent)" }}></span>
      </div>

      <div style={{ display: "flex", justifyContent: "center", gap: 10, marginBottom: 26 }}>
        <button onClick={() => setAll(true)} style={{
          fontFamily: SERIF, fontSize: 12.5, color: "#c9b48c", background: "transparent",
          border: "1px solid #3a3226", borderRadius: 999, padding: "7px 16px",
        }}>全部展开</button>
        <button onClick={() => setAll(false)} style={{
          fontFamily: SERIF, fontSize: 12.5, color: "#8a7558", background: "transparent",
          border: "1px solid #3a3226", borderRadius: 999, padding: "7px 16px",
        }}>全部收起</button>
      </div>

      {data.characters.map(function (c) {
        return <CharacterGroup key={c.id} c={c} activeLine={hero.line} onPick={pick}
          isOpen={!!open[c.id]} onToggle={function () { toggle(c.id); }} />;
      })}

      <footer style={{ textAlign: "center", marginTop: 64 }}>
        <p style={{ fontFamily: GARA, fontStyle: "italic", fontSize: 17, color: "#8a7558", margin: 0 }}>
          He walked across the screen, and stopped right in front of you.
        </p>
        <p style={{ fontFamily: SERIF, fontSize: 12, color: "#5f5340", letterSpacing: 2, marginTop: 14 }}>
          a quiet shrine, kept by 冬璇
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
