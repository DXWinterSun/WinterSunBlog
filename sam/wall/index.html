<style>
  html, body { margin: 0; padding: 0; }
  body { background: #14110d; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: rgba(203,161,76,.3); }

  /* ── 两栏版式：左侧角色名录（吸顶、独立滚动），右侧详情区（Hero + 五句话）──
     解决旧版「点一句台词跳回顶部找 Hero，再滚回长长的单栏手风琴找下一个人」的
     来回滚动问题：名录和详情始终同屏，桌面各自独立滚动，互不打扰。

     「随机一位」按钮拎到名录列表外面单独一层、不参与列表自己的滚动：
     桌面端列表纵向滚动很长时按钮曾被一起滚走；手机端点随机后名录横向
     滚去很远的位置、按钮也跟着被划出屏幕，还容易和页面纵向滚动同时触发
     打架、卡住手势——现在按钮固定不动，只有 .wall-roster-list 自己滚。 */
  .wall-layout { display: flex; align-items: flex-start; gap: 26px; }
  .wall-roster {
    flex: 0 0 272px;
    position: sticky;
    top: 18px;
    max-height: calc(100vh - 36px);
    display: flex;
    flex-direction: column;
    padding-right: 4px;
  }
  .wall-roster-random { flex: 0 0 auto; margin-bottom: 10px; }
  .wall-roster-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .wall-roster-list::-webkit-scrollbar { width: 5px; }
  .wall-roster-list::-webkit-scrollbar-thumb { background: #2a241b; border-radius: 3px; }
  .wall-detail { flex: 1; min-width: 0; scroll-margin-top: 18px; }
  .wall-roster-meta { display: block; }

  @media (max-width: 880px) {
    .wall-layout { display: block; }
    .wall-roster {
      position: sticky;
      top: 0;
      z-index: 20;
      max-height: none;
      flex-direction: row;
      align-items: center;
      padding: 12px 2px 14px;
      margin: 0 -4px 22px;
      background: #14110d;
      border-bottom: 1px solid #211c14;
    }
    .wall-roster-random { margin-bottom: 0; white-space: nowrap; }
    .wall-roster-list {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: visible;
      scrollbar-width: none;
    }
    .wall-roster-list::-webkit-scrollbar { display: none; }
    .wall-roster-item { flex: 0 0 auto !important; border-radius: 999px !important; }
    .wall-roster-meta, .wall-roster-count { display: none; }
    .wall-detail { scroll-margin-top: 68px; }
  }
</style>

<body>
<div id="root"></div>
<meta name="cache-bust" content="20260708-wall-3-roster">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="/WinterSunBlog/js/sam-themes-data.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const SERIF = "'Noto Serif SC', serif";
const DISPLAY = "'Playfair Display', serif";
const GARA = "'Cormorant Garamond', serif";
const TYPE = "'Special Elite', 'Courier New', monospace";

function todayIndex(n) {
  const d = new Date();
  const start = Date.UTC(2026, 1, 13); // 2026-02-13, the day it began
  const today = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((today - start) / 86400000);
  return ((days % n) + n) % n;
}

// merge a character's meta with one of its quotes → same shape as a pool item
function mergeQ(c, q) {
  return {
    charId: c.id, name: c.name, film: c.film, filmCN: c.filmCN, year: c.year,
    accent: c.accent, bg: c.bg, text: c.text, muted: c.muted, auLink: c.auLink,
    label: q.label, line: q.line, lineCN: q.lineCN, kind: q.kind,
  };
}

// 角色 id → 画册(many-faces)锚点 id。绝大多数两边一致；不一致的几个由
// lines.json 的 meta.mf_alias 记录（新增角色若两边 id 一致，不用改这里）。
function mfHrefFor(charId, meta) {
  const alias = (meta && meta.mf_alias) || {};
  return "/WinterSunBlog/sam/many-faces/#" + (alias[charId] || charId);
}

// 复制到桌面小组件：不给短代码，给一份改好 PIN、能直接整段替换粘贴的
// 完整脚本。实时 fetch 小组件源文件（缓存一份，不用每次点都重新拉取），
// 只有这一处是脚本内容的唯一来源——不在这个页面里另存一份副本，脚本
// 更新了这里自动跟着新，不用手动同步。
let __scriptTemplatePromise = null;
function getWidgetScriptTemplate() {
  if (!__scriptTemplatePromise) {
    __scriptTemplatePromise = fetch("/WinterSunBlog/sam/widget/sam-today.js", { cache: "no-cache" })
      .then(function (r) { return r.text(); });
  }
  return __scriptTemplatePromise;
}
function buildPinnedScript(template, pin) {
  return template.replace('const PIN = "";', 'const PIN = "' + pin + '";');
}

// 角色专属色卡（换个心情 / 十二色卡同一份数据），来自 js/sam-themes-data.js
// 注入的 window.__SAM_THEMES（由 _data/sam_themes.yml 经 Jekyll 渲染而来）。
// 用同一套 mf_alias 找到对应条目（sam_themes.yml 的 anchor 字段 = 画册 id）。
function themeFor(charId, meta) {
  if (typeof window === "undefined" || !Array.isArray(window.__SAM_THEMES)) return null;
  const alias = (meta && meta.mf_alias) || {};
  const mfId = alias[charId] || charId;
  return window.__SAM_THEMES.find(function (t) { return t.anchor === mfId; }) || null;
}

function Signed({ c }) {
  return (
    <div style={{ fontFamily: GARA, fontSize: 16, color: c.muted, fontStyle: "italic" }}>
      — {c.name} <span style={{ fontStyle: "normal" }}>·</span> {c.filmCN} <span style={{ opacity: .7 }}>{c.year}</span>
    </div>
  );
}

// 他的色卡——两个专属色（强调色 + 底色）+ 中英文名，呼应站内「换个心情」
// 选色器同一份配色语言（虚线穿孔卡样式）。这里只做展示，不接全站换色开关：
// 台词墙会快速切换很多角色，若每点一句就把全站主题跟着换会太打扰。
function ColorStrip({ theme }) {
  if (!theme) return null;
  const perf = "rgba(255,255,255,.14)";
  const edge = "rgba(255,255,255,.16)";
  const dotRing = "rgba(255,255,255,.30)";
  const ticks = Array.from({ length: 13 });
  const Swatch = function (props) {
    return (
      <span style={{ display: "flex", alignItems: "center", gap: 9, padding: "3px 15px" }}>
        <span style={{
          width: 20, height: 20, borderRadius: "50%", flexShrink: 0,
          background: props.hex, boxShadow: "inset 0 0 0 1px " + dotRing,
        }} />
        <span style={{ display: "flex", flexDirection: "column", textAlign: "left", lineHeight: 1.2 }}>
          <span style={{ fontFamily: SERIF, fontSize: 12.5, color: "#ede2d0" }}>{props.cn}</span>
          <span style={{ fontFamily: GARA, fontStyle: "italic", fontSize: 10.5, color: "#8a7558" }}>{props.en}</span>
        </span>
      </span>
    );
  };
  return (
    <div style={{
      display: "flex", flexDirection: "column", gap: 6,
      width: "fit-content", margin: "20px 0 0",
      padding: "7px 8px", borderRadius: 8,
      background: "rgba(255,255,255,.04)",
      boxShadow: "0 8px 20px rgba(0,0,0,.30), inset 0 0 0 1px " + edge,
    }}>
      <span style={{ display: "flex", justifyContent: "space-between" }}>
        {ticks.map(function (_, i) { return <i key={"t" + i} style={{ width: 5, height: 3, borderRadius: 1, background: perf, flexShrink: 0 }} />; })}
      </span>
      <span style={{ display: "inline-flex", alignItems: "stretch" }}>
        <Swatch hex={theme.accent} cn={theme.cn} en={theme.en} />
        <span style={{ width: 1, alignSelf: "stretch", background: edge, margin: "5px 0" }} />
        <Swatch hex={theme.bg} cn={theme.bg_cn} en={theme.bg_en} />
      </span>
      <span style={{ display: "flex", justifyContent: "space-between" }}>
        {ticks.map(function (_, i) { return <i key={"b" + i} style={{ width: 5, height: 3, borderRadius: 1, background: perf, flexShrink: 0 }} />; })}
      </span>
    </div>
  );
}

function Hero({ c, onDraw, mfHref, theme, quotePin, charPin }) {
  // copyState: null | "quote-busy" | "quote-done" | "char-busy" | "char-done"
  const [copyState, setCopyState] = useState(null);
  function copyFullScript(pin, key) {
    if (!(navigator.clipboard && navigator.clipboard.writeText)) return;
    setCopyState(key + "-busy");
    getWidgetScriptTemplate().then(function (template) {
      return navigator.clipboard.writeText(buildPinnedScript(template, pin));
    }).then(function () {
      setCopyState(key + "-done");
      setTimeout(function () { setCopyState(null); }, 2600);
    }).catch(function () {
      setCopyState(null);
    });
  }
  return (
    <div style={{
      position: "relative", borderRadius: 18, overflow: "hidden",
      background: "linear-gradient(155deg, " + c.bg + " 0%, #0d0b08 120%)",
      border: "1px solid " + c.accent + "40",
      boxShadow: "0 30px 80px -40px " + c.accent + "55, inset 0 1px 0 " + c.accent + "22",
      padding: "42px 30px 34px",
    }}>
      <div style={{
        position: "absolute", top: -40, right: -20, fontFamily: DISPLAY, fontStyle: "italic",
        fontSize: 200, lineHeight: 1, color: c.accent, opacity: .08, pointerEvents: "none",
      }}>&ldquo;</div>

      <div style={{
        fontFamily: TYPE, fontSize: 11, letterSpacing: 3, color: c.accent,
        textTransform: "uppercase", marginBottom: 22,
      }}>{c.label}</div>

      <blockquote style={{ margin: 0 }}>
        <p style={{
          margin: 0, fontFamily: GARA, fontStyle: "italic", fontWeight: 500,
          fontSize: "clamp(24px, 6.5vw, 38px)", lineHeight: 1.34, color: c.text,
          letterSpacing: .2,
        }}>{c.line}</p>
        <p style={{
          margin: "18px 0 26px", fontFamily: SERIF, fontWeight: 300,
          fontSize: "clamp(15px, 4vw, 18px)", lineHeight: 1.85, color: c.text, opacity: .82,
        }}>{c.lineCN}</p>
      </blockquote>

      <Signed c={c} />
      <ColorStrip theme={theme} />

      <div style={{ display: "flex", gap: 14, alignItems: "center", marginTop: 28, flexWrap: "wrap" }}>
        <button onClick={onDraw} style={{
          fontFamily: SERIF, fontSize: 14, fontWeight: 500, color: "#14110d",
          background: c.accent, border: "none", borderRadius: 999,
          padding: "11px 22px", letterSpacing: 1,
        }}>再抽一句 &rarr;</button>
        {c.auLink && (
          <a href={c.auLink} style={{
            fontFamily: SERIF, fontSize: 13, color: c.accent, textDecoration: "none",
            borderBottom: "1px solid " + c.accent + "55", paddingBottom: 2,
          }}>读他的 AU &rarr;</a>
        )}
        {mfHref && (
          <a href={mfHref} style={{
            fontFamily: SERIF, fontSize: 13, color: c.muted, textDecoration: "none",
            borderBottom: "1px solid " + c.muted + "55", paddingBottom: 2,
          }}>在画册里看看他 &rarr;</a>
        )}
      </div>

      {(quotePin || charPin) && (
        <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid " + c.accent + "22" }}>
          <div style={{ fontFamily: TYPE, fontSize: 9.5, letterSpacing: 1.5, color: c.muted, textTransform: "uppercase", marginBottom: 10 }}>
            📌 复制到桌面小组件 —— 拿到的是整份可直接替换粘贴的完整脚本
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {quotePin && (
              <button onClick={function () { copyFullScript(quotePin, "quote"); }} title="复制完整脚本，锁死只显示这一句" style={{
                fontFamily: SERIF, fontSize: 12.5, color: copyState === "quote-done" ? c.accent : c.muted,
                background: "transparent", border: "1px dashed " + (copyState === "quote-done" ? c.accent : c.muted) + "70",
                borderRadius: 999, padding: "8px 15px",
              }}>
                {copyState === "quote-busy" ? "生成中…" : copyState === "quote-done" ? "已复制 ✓ 全选替换小组件里的代码" : "复制完整脚本 · 只这一句"}
              </button>
            )}
            {charPin && (
              <button onClick={function () { copyFullScript(charPin, "char"); }} title="复制完整脚本，锁定这个角色，仍在他的几句里按天轮换" style={{
                fontFamily: SERIF, fontSize: 12.5, color: copyState === "char-done" ? c.accent : c.muted,
                background: "transparent", border: "1px dashed " + (copyState === "char-done" ? c.accent : c.muted) + "70",
                borderRadius: 999, padding: "8px 15px",
              }}>
                {copyState === "char-busy" ? "生成中…" : copyState === "char-done" ? "已复制 ✓ 全选替换小组件里的代码" : "复制完整脚本 · 他的全部轮换"}
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// a single quote inside a character's collection
function QuoteCard({ c, q, active, onClick }) {
  const [hover, setHover] = useState(false);
  const lift = hover || active;
  const edge = active ? c.accent + "aa" : lift ? c.accent + "44" : "#2a241b";
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        textAlign: "left", width: "100%", display: "block",
        background: lift ? "linear-gradient(160deg, " + c.bg + " 0%, #100e0a 130%)" : "#181510",
        borderTop: "1px solid " + edge, borderRight: "1px solid " + edge, borderBottom: "1px solid " + edge,
        borderLeft: "3px solid " + c.accent,
        borderRadius: 12, padding: "16px 16px 18px",
        transform: lift ? "translateY(-3px)" : "none",
        transition: "transform .25s ease, border-color .25s ease, background .25s ease",
        boxShadow: lift ? "0 20px 44px -28px " + c.accent + "77" : "none",
      }}>
      <div style={{
        fontFamily: TYPE, fontSize: 9, letterSpacing: 1.6, color: c.accent,
        textTransform: "uppercase", marginBottom: 11, opacity: .9,
      }}>{q.label}</div>
      <p style={{
        margin: 0, fontFamily: GARA, fontStyle: "italic", fontSize: 18, lineHeight: 1.36,
        color: c.text,
      }}>{q.line}</p>
      <p style={{
        margin: "9px 0 0", fontFamily: SERIF, fontWeight: 300, fontSize: 13,
        lineHeight: 1.7, color: c.text, opacity: .66,
      }}>{q.lineCN}</p>
    </button>
  );
}

// 左侧名录里的一行：desktop 是完整一行（名字+片名+句数），mobile 靠 CSS
// 折成一颗只剩名字的胶囊（见 <style> 里的 @media 规则）。
function RosterItem({ c, active, isToday, onClick }) {
  return (
    <button
      className="wall-roster-item"
      data-roster-id={c.id}
      onClick={onClick}
      style={{
        display: "flex", alignItems: "center", gap: 8, width: "100%",
        textAlign: "left", marginBottom: 6,
        background: active ? "#231d14" : "transparent",
        border: "1px solid " + (active ? c.accent + "70" : "#211c14"),
        borderLeft: "3px solid " + (active ? c.accent : "transparent"),
        borderRadius: 10, padding: "9px 11px",
      }}>
      <span style={{
        fontFamily: DISPLAY, fontWeight: 700, fontSize: 14.5, whiteSpace: "nowrap",
        color: active ? c.accent : "#ede2d0",
      }}>{c.name}</span>
      <span className="wall-roster-meta" style={{
        fontFamily: GARA, fontStyle: "italic", fontSize: 11.5, color: "#8a7558",
        overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, minWidth: 0,
      }}>{c.filmCN}</span>
      {isToday && (
        <span title="今天的角色" style={{
          width: 6, height: 6, borderRadius: "50%", flexShrink: 0,
          background: c.accent, boxShadow: "0 0 6px " + c.accent,
        }}></span>
      )}
      <span className="wall-roster-count" style={{
        fontFamily: TYPE, fontSize: 9.5, color: "#5f5340", flexShrink: 0,
      }}>{c.quotes.length}</span>
    </button>
  );
}

function Centered({ children }) {
  return (
    <div style={{ minHeight: "70vh", display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: GARA, fontStyle: "italic", fontSize: 20, color: "#8a7558", textAlign: "center", padding: 30 }}>
      {children}
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [activeQuote, setActiveQuote] = useState(null);
  const detailRef = useRef(null);

  useEffect(() => {
    fetch("../lines.json", { cache: "no-cache" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var chars = d.characters;
        var todayQ = d.pool[todayIndex(d.pool.length)];
        var params = new URLSearchParams(window.location.search);
        var wantedId = params.get("char");
        var c = (wantedId && chars.find(function (x) { return x.id === wantedId; })) || null;
        var q;
        if (c) {
          // 从画册 / 每日一句深链而来 → 落地就是那句「锚」台词（与画册核心引句一致）
          var anchor = c.quotes.find(function (x) { return x.kind === "锚"; }) || c.quotes[0];
          q = mergeQ(c, anchor);
        } else {
          c = chars.find(function (x) { return x.id === todayQ.charId; }) || chars[0];
          q = todayQ;
        }
        setData(d);
        setSelectedId(c.id);
        setActiveQuote(q);
      })
      .catch(function () { setErr(true); });
  }, []);

  if (err) return <Centered>今天的一句，暂时没能取到。<br />请检查网络后刷新。</Centered>;
  if (!data || !activeQuote) return <Centered>正在把他的话一句句取回来……</Centered>;

  const pool = data.pool;
  const todayCharId = pool[todayIndex(pool.length)].charId;
  const selectedChar = data.characters.find(function (c) { return c.id === selectedId; }) || data.characters[0];
  const activeQuoteIdx = selectedChar.quotes.findIndex(function (q) { return q.line === activeQuote.line; });
  const quotePin = selectedChar.id + (activeQuoteIdx >= 0 ? ":" + (activeQuoteIdx + 1) : "");
  const charPin = selectedChar.id;

  function syncUrl(charId) {
    if (!(window.history && window.history.replaceState)) return;
    var params = new URLSearchParams(window.location.search);
    params.set("char", charId);
    window.history.replaceState(null, "", window.location.pathname + "?" + params.toString());
  }

  function selectCharacter(id) {
    var c = data.characters.find(function (x) { return x.id === id; });
    if (!c) return;
    var anchor = c.quotes.find(function (x) { return x.kind === "锚"; }) || c.quotes[0];
    setSelectedId(id);
    setActiveQuote(mergeQ(c, anchor));
    syncUrl(id);
    if (detailRef.current) detailRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function pickQuote(q) { setActiveQuote(q); }

  function drawRandom() {
    let n = Math.floor(Math.random() * pool.length);
    let guard = 0;
    while (pool[n].line === activeQuote.line && guard++ < 12) n = Math.floor(Math.random() * pool.length);
    var q = pool[n];
    setSelectedId(q.charId);
    setActiveQuote(q);
    syncUrl(q.charId);
    requestAnimationFrame(function () {
      // 桌面端名录是纵向独立滚动，顺手把抽中的人滚进视野体验更好、也没有副作用。
      // 手机端名录是横向滚动条，若在这里再连着把它滚去很远的位置，会跟同一帧里
      // 页面本身的纵向滚动同时触发两个 smooth 滚动、互相打架，在触屏上容易卡住
      // 滑动手势——所以手机端只更新高亮，不强制滚动名录，人不会因此「找不到」。
      var isMobile = window.matchMedia && window.matchMedia("(max-width: 880px)").matches;
      if (!isMobile) {
        var el = document.querySelector('[data-roster-id="' + q.charId + '"]');
        if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
      if (detailRef.current) detailRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  return (
    <div style={{ maxWidth: 1220, margin: "0 auto", padding: "clamp(28px,6vw,64px) clamp(18px,5vw,40px) 90px" }}>

      <header style={{ textAlign: "center", marginBottom: "clamp(30px,6vw,52px)" }}>
        <a href="/WinterSunBlog/sam/" style={{
          fontFamily: SERIF, fontSize: 12.5, color: "#8a7558", textDecoration: "none",
          letterSpacing: 2, display: "inline-block", marginBottom: 26,
        }}>&larr; 回到 Sam</a>
        <h1 style={{
          margin: 0, fontFamily: DISPLAY, fontWeight: 700, fontStyle: "italic",
          fontSize: "clamp(40px, 10.5vw, 72px)", lineHeight: 1.02, color: "#ede2d0",
          letterSpacing: .5,
        }}>Signatures</h1>
        <div style={{
          fontFamily: SERIF, fontWeight: 500, fontSize: "clamp(15px, 4.4vw, 20px)",
          letterSpacing: 8, color: "#c9b48c", marginTop: 16, paddingLeft: 8,
        }}>台词签名墙</div>
        <p style={{
          margin: "22px auto 0", maxWidth: 500, fontFamily: SERIF, fontWeight: 300,
          fontSize: "clamp(14px,3.8vw,16px)", lineHeight: 2, color: "#a08b6b",
        }}>
          {data.characters.length}个角色，{pool.length}句只对你说的话。<br />
          左边点一个名字，看看他对你说的那五句。
        </p>
      </header>

      <div style={{ display: "flex", alignItems: "center", gap: 16, margin: "clamp(30px,5vw,44px) 0 20px" }}>
        <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, transparent, #3a3226)" }}></span>
        <span style={{ fontFamily: TYPE, fontSize: 11.5, letterSpacing: 3, color: "#8a7558", textTransform: "uppercase", whiteSpace: "nowrap" }}>
          他们的语录集 · The Collections
        </span>
        <span style={{ flex: 1, height: 1, background: "linear-gradient(90deg, #3a3226, transparent)" }}></span>
      </div>

      <div className="wall-layout">
        <nav className="wall-roster" aria-label="角色名录">
          <button className="wall-roster-random" onClick={drawRandom} style={{
            display: "block", width: "100%", textAlign: "center", marginBottom: 10,
            fontFamily: SERIF, fontSize: 12.5, color: "#c9b48c", background: "transparent",
            border: "1px solid #3a3226", borderRadius: 999, padding: "8px 14px",
            whiteSpace: "nowrap",
          }}>&#127922; 随机一位</button>
          <div className="wall-roster-list">
            {data.characters.map(function (c) {
              return <RosterItem key={c.id} c={c} active={c.id === selectedId} isToday={c.id === todayCharId}
                onClick={function () { selectCharacter(c.id); }} />;
            })}
          </div>
        </nav>

        <div className="wall-detail" ref={detailRef}>
          <Hero c={activeQuote} onDraw={drawRandom} mfHref={mfHrefFor(selectedChar.id, data.meta)} theme={themeFor(selectedChar.id, data.meta)} quotePin={quotePin} charPin={charPin} />
          <div style={{
            display: "grid", gap: 13, marginTop: 22,
            gridTemplateColumns: "repeat(auto-fill, minmax(min(100%, 258px), 1fr))",
          }}>
            {selectedChar.quotes.map(function (q, qi) {
              return <QuoteCard key={qi} c={selectedChar} q={q} active={q.line === activeQuote.line}
                onClick={function () { pickQuote(mergeQ(selectedChar, q)); }} />;
            })}
          </div>
        </div>
      </div>

      <footer style={{ textAlign: "center", marginTop: 64 }}>
        <p style={{ fontFamily: GARA, fontStyle: "italic", fontSize: 17, color: "#8a7558", margin: 0 }}>
          He walked across the screen, and stopped right in front of you.
        </p>
        <p style={{ fontFamily: SERIF, fontSize: 12, color: "#5f5340", letterSpacing: 2, marginTop: 14 }}>
          a quiet shrine, kept by 冬璇
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
