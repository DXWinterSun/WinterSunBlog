<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hotline · 深夜热线 · Winter Sun</title>

<meta property="og:type" content="website">

<meta property="og:description" content="一部只打得通他的电话。选一个他，说一句话——他会用自己的话回你。">
<meta property="og:url" content="https://dxwintersun.github.io/WinterSunBlog/sam/hotline/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#14110d" id="theme-color">
<link rel="icon" type="image/png" href="/WinterSunBlog/images/heading-normal.png">
<link rel="shortcut icon" href="/WinterSunBlog/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/WinterSunBlog/images/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Special+Elite&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ————————————————————————————————————————————————
     深夜热线 · Hotline（2026-08）
     角色数据零内嵌：全部来自 ../lines.json（与今日页/台词墙/放映室同源）。
     新角色照常加进 lines.json，通讯录会自动多一个号码，这里不用改任何东西。
     回复逻辑：先认「你这句在说什么事」（intentOf → greet/miss/tired/sleepless/
     night/love/meet/praise/tease/daily），到 ../hotline-replies.json 里取该角色
     对应情境的回复；没写回复库的角色，退回按情绪把他 5 句台词分桶（锚 / 情话系 /
     暗告白系）来挑。两种都避开最近说过的。
     一个角色有两个 AU 时（Bill Greaves / Jim Crocker），回复库里写成 aus 数组，
     聊天室顶部出现切换条：两边各一套回复、各存各的对话（localStorage 键加 @auKey）。
     除了按情境取回复，还有四招让他显得「在接话」：动作对答（抱抱/亲亲/摸头…）、
     镜像接话（你说「你是我的天空」他接「那你是我的月亮」）、主题回应（认出你在说
     工作/学生/家里/天气…，把这件事的名字原样还给你）、问句先答一声——模板在
     hotline-replies.json 的 actions / mirror / topics+topic_tpl / question，按声口档取。
     命中主题时他多半会再补一句自己的台词（先接住那件事，再说他自己的话）。
     交互口径（2026-08 Winter 定）：默认「他在听」——你自己打的字他只听不插话，
     点「让他回应」他才把你刚说的这一段合起来回一句；下方那排现成短句
     则是直接说给他听的，点了就有回应。对话历史只存在本机 localStorage
     （键 ws-hotline-v1），谁也看不见。
     ———————————————————————————————————————————————— */
  html, body { margin: 0; padding: 0; height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #14110d;
    --accent: #cba14c;
    --text: #ede2d0;
    --muted: #8a7558;
    --ink: #161310;
  }
  body {
    min-height: 100%; min-height: 100dvh;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-family: 'Noto Serif SC', serif;
    transition: background .8s ease;
  }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; }
  ::selection { background: rgba(255,255,255,.18); }

  .hidden { display: none !important; }

  /* ————— 通讯录（roster）————— */
  .roster {
    max-width: 760px; margin: 0 auto;
    padding: clamp(28px,6vw,60px) clamp(18px,5vw,36px) 80px;
  }
  .roster-head { text-align: center; margin-bottom: clamp(26px,5vw,44px); }
  .roster-back {
    font-size: 12.5px; color: var(--muted); text-decoration: none;
    letter-spacing: 2px; display: inline-block; margin-bottom: 24px;
  }
  .roster-title {
    margin: 0; font-family: 'Playfair Display', serif; font-weight: 700; font-style: italic;
    font-size: clamp(40px, 10.5vw, 68px); line-height: 1.02; letter-spacing: .5px;
  }
  .roster-sub {
    font-weight: 500; font-size: clamp(15px,4.4vw,20px);
    letter-spacing: 8px; color: var(--accent); margin-top: 15px; padding-left: 8px;
  }
  .roster-lede {
    margin: 20px auto 0; max-width: 460px; font-weight: 300;
    font-size: clamp(13.5px,3.8vw,15.5px); line-height: 2; color: var(--muted);
  }
  .roster-divider {
    display: flex; align-items: center; gap: 16px;
    margin: clamp(26px,5vw,40px) 0 18px;
  }
  .roster-divider i { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #3a3226); }
  .roster-divider i:last-child { background: linear-gradient(90deg, #3a3226, transparent); }
  .roster-divider span {
    font-family: 'Special Elite', monospace; font-size: 11.5px; letter-spacing: 3px;
    color: var(--muted); text-transform: uppercase; white-space: nowrap;
  }
  .roster-search { position: relative; margin-bottom: 10px; }
  .roster-search input {
    width: 100%; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    padding: 11px 40px 11px 42px; color: var(--text);
    /* 同输入框：iOS Safari 对 <16px 的输入框会自动放大整页，恒用 16px */
    font-family: inherit; font-size: 16px; letter-spacing: .5px;
    outline: none; transition: border-color .2s ease;
  }
  .roster-search input::placeholder { color: var(--muted); opacity: .8; }
  /* 藏掉浏览器自带的清空叉与装饰，只留我们自己那个 */
  .roster-search input::-webkit-search-cancel-button,
  .roster-search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
  .roster-search input:focus { border-color: var(--accent); }
  .roster-search__icon {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--muted); pointer-events: none; opacity: .8;
  }
  .roster-search__clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: var(--muted);
    font-size: 17px; line-height: 1; padding: 8px 12px;
  }
  .roster-empty {
    text-align: center; color: var(--muted); font-size: 13.5px;
    line-height: 2; padding: 26px 10px; opacity: .9;
  }
  .roster-count {
    text-align: center; font-family: 'Special Elite', monospace;
    font-size: 10.5px; letter-spacing: 2px; color: var(--muted);
    opacity: .75; margin: 2px 0 10px;
  }
  .roster-random {
    display: block; width: 100%; text-align: center; margin: 0 0 14px;
    font-size: 13px; color: var(--accent); background: transparent;
    border: 1px solid #3a3226; border-radius: 999px; padding: 10px 14px;
    letter-spacing: 1px; transition: border-color .25s ease;
  }
  .roster-random:hover { border-color: var(--accent); }
  .roster-list { display: grid; gap: 9px; }
  .contact {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px; padding: 12px 16px; color: var(--text);
    transition: border-color .25s ease, background .25s ease;
  }
  .contact:hover { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.05); }
  .contact-dot {
    flex: 0 0 auto; width: 13px; height: 13px; border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(255,255,255,.07);
  }
  .contact-name {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
    font-size: 19px; letter-spacing: .4px; line-height: 1.2;
  }
  .contact-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; letter-spacing: .5px; }
  .contact-unread {
    margin-left: auto; flex: 0 0 auto;
    font-family: 'Special Elite', monospace; font-size: 10.5px; letter-spacing: 1.5px;
    color: var(--muted); opacity: .85;
  }
  .roster-foot { text-align: center; margin-top: 56px; }
  .roster-foot .en {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 16.5px; color: var(--muted); margin: 0;
  }
  .roster-foot .cn { font-size: 12px; color: #5f5340; letter-spacing: 2px; margin-top: 12px; }
  .roster-foot .cn a { text-decoration: none; border-bottom: 1px dotted #5f5340; }

  /* ————— 聊天室（chat）————— */
  .chat {
    height: 100dvh; display: flex; flex-direction: column;
    max-width: 680px; margin: 0 auto; width: 100%;
  }
  .chat-top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 86%, black); position: relative; z-index: 2;
  }
  .chat-back {
    flex: 0 0 auto; background: transparent; border: none; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 6px 8px 6px 2px;
  }
  .chat-id { min-width: 0; flex: 1; text-decoration: none; }
  .chat-name {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
    font-size: 20px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-status { font-size: 11px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
  .chat-status b {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 5px; vertical-align: 1px;
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  .chat-clear {
    flex: 0 0 auto; background: transparent; border: none; color: var(--muted);
    font-size: 11px; letter-spacing: 1.5px; padding: 6px 2px 6px 8px; opacity: .8;
  }

  /* 一个角色有两个 AU 时，聊天室顶部出现这排切换（每个 AU 各存各的对话） */
  .chat-aus {
    flex: 0 0 auto; display: flex; gap: 7px; justify-content: center;
    padding: 9px 14px 10px; border-bottom: 1px solid rgba(255,255,255,.07);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 92%, black);
  }
  .chat-au {
    background: transparent; border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 6px 14px; color: var(--muted);
    font-size: 12px; letter-spacing: .8px; line-height: 1.25;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }
  .chat-au b { display: block; font-weight: 500; }
  .chat-au i { display: block; font-style: normal; font-size: 10px; opacity: .75; margin-top: 1px; }
  .chat-au.on { color: var(--ink); background: var(--accent); border-color: var(--accent); }

  .chat-log {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 20px 16px 12px; scroll-behavior: smooth;
  }
  .chat-log::-webkit-scrollbar { width: 5px; }
  .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

  .chat-day {
    text-align: center; font-family: 'Special Elite', monospace;
    font-size: 10.5px; letter-spacing: 2.5px; color: var(--muted);
    margin: 10px 0 18px; opacity: .8;
  }
  .msg { max-width: 82%; margin-bottom: 13px; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  .msg-time {
    font-size: 10px; color: var(--muted); letter-spacing: 1px;
    margin-top: 5px; opacity: .75;
  }
  .msg--me { margin-left: auto; text-align: right; }
  .msg--me .msg-bubble {
    display: inline-block; text-align: left;
    background: var(--accent); color: var(--ink);
    border-radius: 16px 16px 4px 16px; padding: 9px 14px;
    font-size: 14.5px; line-height: 1.75; letter-spacing: .3px;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .msg--me.msg--emoji .msg-bubble {
    background: transparent; color: inherit; font-size: 34px; line-height: 1.25; padding: 2px 2px;
  }
  .msg--him .msg-bubble {
    display: inline-block;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.09);
    border-radius: 16px 16px 16px 4px; padding: 11px 15px 10px;
  }
  .msg-stamp {
    font-family: 'Special Elite', monospace; font-size: 10px; letter-spacing: 2.5px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 6px; opacity: .9;
  }
  .msg-line {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500;
    font-size: 17.5px; line-height: 1.5; letter-spacing: .2px;
  }
  .msg-gloss {
    font-size: 13px; font-weight: 300; line-height: 1.8; color: var(--muted);
    margin-top: 6px;
  }
  .typing .msg-bubble { padding: 13px 16px; }
  .typing i {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); margin: 0 2.5px;
    animation: blink 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,100% { opacity: .25; transform: none; } 45% { opacity: 1; transform: translateY(-2.5px); } }

  .chat-input {
    flex: 0 0 auto; padding: 10px 12px max(14px, env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,.08);
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 86%, black);
  }
  .chat-hint {
    font-size: 10.5px; color: var(--muted); letter-spacing: 1.5px;
    text-align: center; margin: 0 0 9px; opacity: .8;
  }
  .chat-free { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 9px; }
  .chat-vent {
    flex: 0 0 auto; height: 38px; border-radius: 999px; padding: 0 13px;
    background: transparent; border: 1px solid rgba(255,255,255,.18);
    color: var(--muted); font-size: 12px; letter-spacing: 1.5px; white-space: nowrap;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  .chat-vent.on {
    background: var(--accent); color: var(--ink); border-color: var(--accent);
  }
  .chat-vent:disabled { opacity: .4; cursor: default; }
  .chat-free textarea {
    flex: 1; min-width: 0; resize: none; overflow-y: hidden;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px; padding: 8px 15px; color: var(--text);
    /* iOS Safari：输入框字号 < 16px 会在聚焦时自动放大整页且不回弹，恒用 16px 防触发 */
    font-family: inherit; font-size: 16px; line-height: 1.6; letter-spacing: .3px;
    outline: none; transition: border-color .2s ease;
  }
  .chat-free textarea::placeholder { color: var(--muted); opacity: .75; }
  .chat-free textarea:focus { border-color: var(--accent); }
  .chat-free button[type="submit"] {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: var(--ink); border: none;
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center;
    transition: opacity .2s ease;
  }
  .chat-free button[type="submit"]:disabled { opacity: .4; cursor: default; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    color: var(--text); font-size: 13.5px; letter-spacing: .5px;
    padding: 8px 15px; transition: border-color .2s ease, background .2s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip:disabled { opacity: .4; cursor: default; }
  .chip--emoji { font-size: 17px; padding: 6px 12px; }

  .boot {
    min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13.5px; letter-spacing: 2px; text-align: center; padding: 0 30px;
  }
</style>
</head>
<body>

<div class="boot" id="boot">正在接线……</div>

<main class="roster hidden" id="roster">
  <header class="roster-head">
    <a class="roster-back" href="../">&larr; 回到 Sam</a>
    <h1 class="roster-title">Hotline</h1>
    <div class="roster-sub">深夜热线</div>
    <p class="roster-lede" id="lede">一部只打得通他的电话。<br>选一个号码，说一句话——他会用自己的话回你。</p>
  </header>
  <div class="roster-divider" aria-hidden="true"><i></i><span>他们都在线 · All Lines Open</span><i></i></div>
  <div class="roster-search">
    <svg class="roster-search__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="6.8" cy="6.8" r="4.8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10.4 10.4 L14.2 14.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input id="search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="搜他的名字、电影、年份……" aria-label="搜索角色">
    <button class="roster-search__clear hidden" id="searchclear" type="button" aria-label="清空">&times;</button>
  </div>
  <button class="roster-random" id="random" type="button">&#127922; 随便拨一个</button>
  <div class="roster-count hidden" id="count"></div>
  <div class="roster-list" id="list" role="list"></div>
  <div class="roster-empty hidden" id="empty">这儿没有这个人。<br>换个名字，或者点上面那颗骰子。</div>
  <footer class="roster-foot">
    <p class="en">Whoever you call, someone picks up on the first ring.</p>
    <p class="cn">这些话都收在 <a href="../wall/">台词签名墙</a> · a quiet shrine, kept by 冬璇</p>
  </footer>
</main>

<section class="chat hidden" id="chat" aria-label="对话">
  <div class="chat-top">
    <button class="chat-back" id="back" type="button" aria-label="返回通讯录">&larr;</button>
    <a class="chat-id" id="chatid" href="../many-faces/" title="去他的画册页">
      <div class="chat-name" id="cname"></div>
      <div class="chat-status"><b></b><span id="cstatus"></span></div>
    </a>
    <button class="chat-clear" id="clear" type="button">撕掉这页</button>
  </div>
  <div class="chat-aus hidden" id="aus" role="group" aria-label="选择这个角色的哪一个 AU"></div>
  <div class="chat-log" id="log" aria-live="polite"></div>
  <div class="chat-input">
    <p class="chat-hint" id="hint">你说的他都听着 · 想他开口，点左边那颗键</p>
    <form class="chat-free" id="freeform">
      <button type="button" class="chat-vent on" id="vent">让他回应</button>
      <textarea id="freetext" rows="1" maxlength="600" placeholder="跟他说点什么……"></textarea>
      <button type="submit" id="freesend" aria-label="发送">&#8593;</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>
</section>

<script>
(function () {
  'use strict';

  /* ————— 预设消息 —————
     intent = 情境（对上 hotline-replies.json 的分桶，他就答得上题）；
     pref   = 老的情绪桶，给「还没写回复库」的角色回退用（从他 5 句台词里挑）。
     桶：anchor = 锚句；love = 情话系；soft = 暗告白系；any = 全部 */
  var CHIPS = [
    { t: '在吗？',        intent: 'greet',     pref: ['anchor', 'any'] },
    { t: '想你了。',      intent: 'miss',      pref: ['love', 'any'] },
    { t: '今天有点累。',  intent: 'tired',     pref: ['soft', 'love'] },
    { t: '睡不着。',      intent: 'sleepless', pref: ['soft', 'love'] },
    { t: '跟我说句话。',  intent: 'daily',     pref: ['any'] },
    { t: '晚安。',        intent: 'night',     pref: ['love', 'soft'] },
    { t: '❤️', intent: 'love',   pref: ['love', 'any'], emoji: true },
    { t: '🌙', intent: 'night',  pref: ['soft', 'any'], emoji: true },
    { t: '✨', intent: 'praise', pref: ['any'],         emoji: true }
  ];

  var STORE_KEY = 'ws-hotline-v1';
  var chars = [];          // 按年份升序（与放映室同序）
  var MF_ALIAS = {};
  var REPLIES = {};        // 对题回复库的 chars 部分（缺了就退回台词）
  var EXTRA = {};          // 动作 / 接话 / 问句模板（按声口档 warm·playful·gruff·smooth 分）
  var personas = [];       // 当前角色的 AU 列表（多数人只有一个）
  var au = null;           // 当前选中的 AU（决定用哪套回复库、以及对话存哪个键）
  var current = null;      // 当前聊天对象
  var busy = false;        // 他正在输入时锁住输入区

  /* ————— 小工具 ————— */
  function $(id) { return document.getElementById(id); }
  function yearNum(y) { var m = String(y || '').match(/\d{4}/); return m ? +m[0] : 9999; }
  function lum(hex) {
    var h = (hex || '').replace('#', '');
    if (h.length !== 6) return 0;
    var r = parseInt(h.substr(0, 2), 16) / 255, g = parseInt(h.substr(2, 2), 16) / 255, b = parseInt(h.substr(4, 2), 16) / 255;
    return .2126 * r + .7152 * g + .0722 * b;
  }
  function fmtTime(ms) {
    var d = new Date(ms);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function mfHref(id) { return '../many-faces/#' + (MF_ALIAS[id] || id); }
  /* 一个角色可能有两个 AU：回复库里写成 aus 数组，各带一套 buckets；
     没写 aus 的就是单个人格，buckets 即整条目。没有回复库的角色 buckets 为 null，
     照旧退回 lines.json 的 5 句台词。 */
  function personasOf(charId) {
    var e = REPLIES[charId];
    if (!e) return [{ key: '', label: '', labelCN: '', buckets: null }];
    if (e.aus && e.aus.length) {
      return e.aus.map(function (a) {
        return { key: a.key, label: a.label, labelCN: a.labelCN,
                 buckets: a.buckets, register: a.register || 'warm' };
      });
    }
    return [{ key: '', label: '', labelCN: '', buckets: e, register: e.register || 'warm' }];
  }
  /* 每个 AU 各存各的对话，互不串台 */
  function histKey(c, auKey) {
    var k = auKey === undefined ? (au && au.key) : auKey;
    return c.id + (k ? '@' + k : '');
  }
  function totalMsgs(charId) {
    var n = 0;
    personasOf(charId).forEach(function (p) { n += history(charId + (p.key ? '@' + p.key : '')).length; });
    return n;
  }

  /* ————— 本机对话存档（localStorage，读写都兜底）————— */
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { chats: {} }; }
    catch (e) { return { chats: {} }; }
  }
  function saveMsg(charId, msg) {
    try {
      var s = loadStore();
      (s.chats[charId] = s.chats[charId] || []).push(msg);
      if (s.chats[charId].length > 80) s.chats[charId] = s.chats[charId].slice(-80);
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    } catch (e) {}
  }
  function history(charId) { return loadStore().chats[charId] || []; }
  function clearHistory(charId) {
    try {
      var s = loadStore();
      delete s.chats[charId];
      if (s.meta) delete s.meta[charId];
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    } catch (e) {}
  }
  /* 每段对话的小记性：他问了什么还没答（pending）、上次聊的是哪件事（topic）、
     上次回来打招呼是什么时候（lastBack）、上次问过哪个问题（lastAsk） */
  function getMeta(charId) { var s = loadStore(); return (s.meta && s.meta[charId]) || {}; }
  function setMeta(charId, patch) {
    try {
      var s = loadStore();
      s.meta = s.meta || {};
      var m = s.meta[charId] || {};
      for (var k in patch) { if (patch.hasOwnProperty(k)) { if (patch[k] === null) delete m[k]; else m[k] = patch[k]; } }
      s.meta[charId] = m;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    } catch (e) {}
  }

  /* ————— 台词分桶：kind 字符串包含关键词即归桶 ————— */
  function bucketOf(kind) {
    var k = String(kind || '');
    if (k.indexOf('锚') !== -1) return 'anchor';
    if (/情话|甜|缱绻|忠诚|痞话|贫嘴|不正经/.test(k)) return 'love';
    return 'soft'; // 暗告白与其余变体都算「说给你听的软话」
  }
  /* ————— 情境识别：你这句话在说什么事 —————
     命中的桶名对上 hotline-replies.json 里该角色的分桶；写了回复库的角色
     就能「答得上题」，没写的角色照旧从他 5 句台词里挑。 */
  function intentOf(s) {
    s = String(s || '');
    if (/晚安|睡了|去睡|睡觉|我睡|该睡|困了|good ?night|🌙|😴|🛌/i.test(s)) return 'night';
    if (/睡不着|失眠|醒着|半夜|几点了|睡不好|又醒/.test(s)) return 'sleepless';
    if (/累|难过|哭|委屈|烦|怕|孤单|寂寞|难受|崩溃|不开心|低落|难熬|压力|emo|想哭|撑不住|😭|😢|🥺/i.test(s)) return 'tired';
    if (/想你|想见|好想|惦记|念你|见不到|miss/i.test(s)) return 'miss';
    if (/爱你|喜欢你|亲亲|抱抱|抱一下|亲一下|吻|心动|我的|宝贝|love you|❤️|❤|💗|💕|😘/i.test(s)) return 'love';
    if (/见你|见面|来找|去找|来看|见一面|什么时候见|我会去|到你那|奔现/.test(s)) return 'meet';
    if (/好帅|真帅|帅|好看|美|演得|演技|厉害|好棒|真好|迷人|喜欢看你|✨|😍/i.test(s)) return 'praise';
    if (/讨厌|坏|笨|傻|幼稚|不理|理我|哼|烦人|欠揍|臭|骗子|😤|😏/i.test(s)) return 'tease';
    /* 打招呼只认「短句」——「你会一直在吗」这种别被「在吗」两个字劫走 */
    if (s.length <= 8 && /在吗|你好|嗨|喂|在不在|忙吗|hello|hi|hey|👋/i.test(s)) return 'greet';
    return 'daily';
  }
  /* ————— 「像活的」那三招（学 2010 年代那批对话应用的老路数）—————
     ① 动作对答：认出「抱抱 / 亲亲 / 摸头 / 牵手 / 靠着 / 哭」，回一个配对的动作；
     ② 接话（镜像）：你说「你是我的天空」，他接「那你就是我的月亮」；
     ③ 问句：你问「你…吗？」，他先答一声再补一句。
     三招都按角色的声口档（warm / playful / gruff / smooth）取模板；
     没写回复库的角色照旧退回 lines.json 的五句台词。 */
  var ACTION_RE = [
    ['hug',     /抱抱|抱我|抱一下|抱住|抱紧|想抱|求抱|hug/i],
    ['kiss',    /亲亲|亲一下|亲我|么么|mua|吻你|吻我|想亲|kiss/i],
    ['headpat', /摸头|摸摸|揉头|揉揉|rua|头发/i],
    ['hand',    /牵手|拉手|牵着|拉着我|牵我|hold my hand/i],
    ['lean',    /靠着|靠在|靠你|蹭|贴着|依偎|枕着|lean on/i],
    ['cry',     /哭了|想哭|好想哭|眼泪|流泪|憋不住|cry|😭|😢/i]
  ];
  function pickTpl(arr) { return arr && arr.length ? arr[Math.floor(Math.random() * arr.length)] : null; }
  function reg() { return (au && au.register) || 'warm'; }

  function actionReply(text) {
    if (!EXTRA.actions) return null;
    for (var i = 0; i < ACTION_RE.length; i++) {
      if (ACTION_RE[i][1].test(text)) {
        var set = EXTRA.actions[ACTION_RE[i][0]];
        var t = pickTpl(set && (set[reg()] || set.warm));
        if (t) return { line: t.line, lineCN: t.cn };
      }
    }
    return null;
  }

  function mirrorReply(text) {
    var m = EXTRA.mirror;
    if (!m || !/是我的|是你的|你是|我是|you are my|you're my/i.test(text)) return null;
    for (var i = 0; i < m.pairs.length; i++) {
      var p = m.pairs[i];           /* [中文1, 英文1, 中文2, 英文2] */
      if (text.indexOf(p[0]) !== -1 || text.toLowerCase().indexOf(p[1].toLowerCase()) !== -1) {
        var t = pickTpl(m.tpl[reg()] || m.tpl.warm);
        if (!t) return null;
        var fill = function (x) {
          return x.replace(/\{en1\}/g, p[1]).replace(/\{cn1\}/g, p[0])
                  .replace(/\{en2\}/g, p[3]).replace(/\{cn2\}/g, p[2]);
        };
        return { line: fill(t.line), lineCN: fill(t.cn) };
      }
    }
    return null;
  }

  /* 主题层：认出你说的是哪件事（工作 / 学生 / 家里 / 天气…），
     用带槽位的句式把这件事的名字原样还给你——「对上了」的感觉主要来自这里。
     一段倾诉里往往会顺带扫到好几个词（讲课讲到「嗓子」哑，可她说的是学生），
     所以按「命中次数最多」取主题，次数相同再取「最先说到」的那个——
     人开口第一句说的，通常就是这一趟真正想说的事。 */
  var topicRe = null;
  function topicOf(text) {
    if (!EXTRA.topics) return null;
    if (!topicRe) {
      topicRe = EXTRA.topics.map(function (t) { return { t: t, re: new RegExp(t.re, 'g') }; });
    }
    var best = null, bestHits = 0, bestAt = 0;
    topicRe.forEach(function (x) {
      x.re.lastIndex = 0;
      var m, hits = 0, first = -1;
      while ((m = x.re.exec(text)) !== null) {
        hits++;
        if (first < 0) first = m.index;
        if (m.index === x.re.lastIndex) x.re.lastIndex++; // 防空匹配死循环
      }
      if (!hits) return;
      if (hits > bestHits || (hits === bestHits && first < bestAt)) {
        best = x.t; bestHits = hits; bestAt = first;
      }
    });
    return best;
  }
  function topicReply(text) {
    var t = topicOf(text);
    if (!t || !EXTRA.topic_tpl) return null;
    var tpl = pickTpl(EXTRA.topic_tpl[reg()] || EXTRA.topic_tpl.warm);
    if (!tpl) return null;
    var fill = function (x) { return x.replace(/\{en\}/g, t.en).replace(/\{cn\}/g, t.cn); };
    // 主题名（work / the students…）填进句首时要大写；顺手记下「上次聊的是这件事」
    if (current) setMeta(histKey(current), { topic: { key: t.key, t: Date.now() } });
    return { line: capSentences(fill(tpl.line)), lineCN: fill(tpl.cn) };
  }

  /* ————— FakeTalk 化的几层（2026-09）—————
     短答：嗯 / 没 / 不知道 / 哦 这种一两个字的回答，各有各的接法 */
  function shortKind(text) {
    var t = String(text || '').replace(/[\s。，、．.!！?？~～…]+/g, '');
    if (!t || t.length > 6) return null;
    if (/^(嗯+|好+|行+|是|对|对的|对啊|是的|是啊|好的|好呀|好啊|有|吃了|睡了|喝了|吃过了|睡过了|ok|okay|yes|yeah|yep|yup|sure|mm|mhm)$/i.test(t)) return 'yes';
    if (/^(没|没有|不|不是|没吃|没睡|没喝|不行|不好|不想|还没|没呢|不要|没什么|no|nope|nah|notyet)$/i.test(t)) return 'no';
    if (/^(不知道|不清楚|随便|算了|不想说|说不清|不好说|不晓得|无所谓|都行|dunno|idk|whatever|meh)$/i.test(t)) return 'dunno';
    if (/^(哦+|噢+|喔+|呃+|额+|唉+|哎+|hm+|oh+|uh+|huh|ah+|eh+)$/i.test(t)) return 'hm';
    return null;
  }
  function shortReply(kind) {
    var set = EXTRA.short && (EXTRA.short[reg()] || EXTRA.short.warm);
    var t = set && pickTpl(set[kind]);
    return t ? { line: t.line, lineCN: t.cn } : null;
  }
  /* 只发了个表情（一个或一串），没有一个字 */
  var EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}]/gu;
  function isEmojiOnly(text) {
    var t = String(text || '');
    if (!t.trim()) return false;
    return !t.replace(EMOJI_RE, '').replace(/[\s。，、．.!！?？~～…]+/g, '').length;
  }
  function tplReply(section) {
    var set = EXTRA[section];
    var t = set && pickTpl(set[reg()] || set.warm);
    return t ? { line: t.line, lineCN: t.cn } : null;
  }
  /* 同一句连着发了两遍 */
  function isRepeat(charId, trailCount) {
    var mine = history(charId).filter(function (m) { return m.w === 'm'; });
    if (trailCount !== 1 || mine.length < 2) return false;
    var a = (mine[mine.length - 1].x || '').trim(), b = (mine[mine.length - 2].x || '').trim();
    return !!a && a === b;
  }
  /* 他问你：吃了没 / 睡了没 / 今天怎么样 / 在哪儿 / 喝水了没——问完记下来，等你答 */
  function askReply(charId) {
    var set = EXTRA.asks && (EXTRA.asks[reg()] || EXTRA.asks.warm);
    if (!set || !set.length) return null;
    var last = getMeta(charId).lastAsk;
    var pool = set.filter(function (a) { return a.key !== last; });
    var a = pickTpl(pool.length ? pool : set);
    setMeta(charId, { pending: { key: a.key, t: Date.now() }, lastAsk: a.key });
    return { line: a.line, lineCN: a.cn };
  }
  function askBranch(charId, key, kind) {
    var set = EXTRA.asks && (EXTRA.asks[reg()] || EXTRA.asks.warm);
    var a = (set || []).filter(function (x) { return x.key === key; })[0];
    var b = a && a[kind];
    return b ? { line: b.line, lineCN: b.cn } : shortReply(kind);
  }
  /* 隔了一阵回来，他先开口：记得上次的事就问那件事，不然按隔了多久打招呼 */
  function backReply(charId, gapMs) {
    var m = getMeta(charId), day = 864e5, hr = new Date().getHours();
    var tp = m.topic;
    if (tp && !tp.asked && Date.now() - tp.t < 7 * day && EXTRA.recall) {
      var topic = (EXTRA.topics || []).filter(function (t) { return t.key === tp.key; })[0];
      var r = topic && pickTpl(EXTRA.recall[reg()] || EXTRA.recall.warm);
      if (r) {
        setMeta(charId, { topic: { key: tp.key, t: tp.t, asked: true }, pending: { key: 'recall', t: Date.now() } });
        var fill = function (x) { return x.replace(/\{en\}/g, topic.en).replace(/\{cn\}/g, topic.cn); };
        return { line: capSentences(fill(r.line)), lineCN: fill(r.cn) };
      }
    }
    var set = EXTRA.back && (EXTRA.back[reg()] || EXTRA.back.warm);
    if (!set) return null;
    var kind = gapMs < 36 * 3600e3 ? 'day' : gapMs < 7 * day ? 'days' : 'long';
    if (hr < 5 && set.late && Math.random() < .5) kind = 'late';
    var t = pickTpl(set[kind]);
    if (!t) return null;
    var n = String(Math.round(gapMs / day));
    return { line: t.line.replace(/\{n\}/g, n), lineCN: t.cn.replace(/\{n\}/g, n) };
  }
  /* 称呼槽位：有称呼的人填进去（Ocean / baby doll / kotku…），没有的连前面的逗号一起去掉 */
  function fillPet(x, lang) {
    if (!x) return x;
    var pet = au && au.pet && au.pet[lang];
    return pet ? x.replace(/\{pet\}/g, pet) : x.replace(/[,，]?\s*\{pet\}/g, '');
  }
  function capSentences(en) {
    return en.replace(/(^|[.!?…]["')\]]?\s*)([a-z])/g, function (m, head, ch) { return head + ch.toUpperCase(); });
  }

  function isQuestion(text) {
    return /[？?]\s*$|吗[？?]?\s*$|好不好|行不行|可以吗|是不是|会不会|有没有|对不对/.test(text);
  }
  function questionReply() {
    var t = pickTpl(EXTRA.question && (EXTRA.question[reg()] || EXTRA.question.warm));
    return t ? { line: t.line, lineCN: t.cn } : null;
  }

  /* 从回复库挑：先按情境，落空退 daily，再落空退整本；避开最近说过的两句 */
  function pickFromReplies(c, intent) {
    var set = au && au.buckets;
    if (!set) return null;
    var recent = history(histKey(c)).filter(function (m) { return m.w === 'h' && m.line; })
      .slice(-3).map(function (m) { return m.line; });
    var tries = [intent, 'daily'];
    for (var i = 0; i < tries.length; i++) {
      var arr = (set[tries[i]] || []).filter(function (q) { return recent.indexOf(q.line) === -1; });
      if (arr.length) {
        var q = arr[Math.floor(Math.random() * arr.length)];
        return { line: q.line, lineCN: q.cn };
      }
    }
    var all = [];
    /* 只收桶（数组）——条目里还有 register / pet 这类非台词字段，别混进来 */
    for (var k in set) { if (set.hasOwnProperty(k) && Object.prototype.toString.call(set[k]) === '[object Array]') all = all.concat(set[k]); }
    all = all.filter(function (q) { return recent.indexOf(q.line) === -1; });
    if (!all.length) return null;
    var pick = all[Math.floor(Math.random() * all.length)];
    return { line: pick.line, lineCN: pick.cn };
  }

  function pickReply(c, prefs) {
    var recent = history(histKey(c)).filter(function (m) { return m.w === 'h' && m.line; })
      .slice(-2).map(function (m) { return m.line; });
    function candidates(bucket) {
      return c.quotes.filter(function (q) {
        if (recent.indexOf(q.line) !== -1) return false;
        if (bucket === 'any') return true;
        return bucketOf(q.kind) === bucket;
      });
    }
    for (var i = 0; i < prefs.length; i++) {
      var pool = candidates(prefs[i]);
      if (pool.length) return pool[Math.floor(Math.random() * pool.length)];
    }
    var all = candidates('any');
    if (all.length) return all[Math.floor(Math.random() * all.length)];
    return c.quotes[Math.floor(Math.random() * c.quotes.length)];
  }

  /* ————— 渲染 ————— */
  function applyTheme(c) {
    var r = document.documentElement.style;
    if (c) {
      r.setProperty('--bg', c.bg); r.setProperty('--accent', c.accent);
      r.setProperty('--text', c.text); r.setProperty('--muted', c.muted);
      r.setProperty('--ink', lum(c.accent) > .45 ? '#161310' : '#faf4e8');
      document.getElementById('theme-color').setAttribute('content', c.bg);
    } else {
      r.cssText = '';
      document.getElementById('theme-color').setAttribute('content', '#14110d');
    }
  }

  /* 搜他的名字 / 电影（中英）/ 年份；空格分词，全部命中才算 */
  function matches(c, q) {
    if (!q) return true;
    var hay = [c.name, c.film, c.filmCN, c.year].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean)
      .every(function (w) { return hay.indexOf(w) !== -1; });
  }
  function visibleChars() {
    var q = ($('search').value || '').trim();
    return chars.filter(function (c) { return matches(c, q); });
  }
  function renderRoster() {
    var list = $('list');
    var shown = visibleChars();
    var q = ($('search').value || '').trim();
    $('searchclear').classList.toggle('hidden', !q);
    $('empty').classList.toggle('hidden', shown.length > 0);
    $('count').classList.toggle('hidden', !q);
    if (q) $('count').textContent = '找到 ' + shown.length + ' / ' + chars.length + ' 人';
    list.innerHTML = '';
    shown.forEach(function (c) {
      var n = totalMsgs(c.id);
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'contact'; btn.setAttribute('role', 'listitem');
      btn.innerHTML =
        '<span class="contact-dot" style="background:' + c.accent + '"></span>' +
        '<span><span class="contact-name">' + c.name + '</span>' +
        '<div class="contact-meta">' + c.filmCN + ' · ' + c.year + '</div></span>' +
        (n ? '<span class="contact-unread">' + n + ' 条</span>' : '<span class="contact-unread">未拨过</span>');
      btn.addEventListener('click', function () { openChat(c); });
      list.appendChild(btn);
    });
    $('lede').innerHTML = '一部只打得通他的电话，' + chars.length + ' 个号码条条在线。<br>选一个他，说一句话——他会用自己的话回你。';
    return shown;
  }

  function bubbleMe(msg) {
    var div = document.createElement('div');
    div.className = 'msg msg--me' + (msg.e ? ' msg--emoji' : '');
    div.innerHTML = '<span class="msg-bubble"></span><div class="msg-time">' + fmtTime(msg.t) + '</div>';
    div.querySelector('.msg-bubble').textContent = msg.x;
    return div;
  }
  function bubbleHim(msg) {
    var div = document.createElement('div');
    div.className = 'msg msg--him';
    var stamp = msg.label ? '<div class="msg-stamp"></div>' : '';
    div.innerHTML = '<span class="msg-bubble">' + stamp +
      '<div class="msg-line"></div><div class="msg-gloss"></div></span>' +
      '<div class="msg-time">' + fmtTime(msg.t) + '</div>';
    if (msg.label) div.querySelector('.msg-stamp').textContent = msg.label;
    div.querySelector('.msg-line').textContent = msg.line;
    div.querySelector('.msg-gloss').textContent = msg.lineCN;
    return div;
  }
  function scrollLog() {
    var log = $('log');
    log.scrollTop = log.scrollHeight;
  }

  function renderChips() {
    var box = $('chips');
    box.innerHTML = '';
    CHIPS.forEach(function (chip) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (chip.emoji ? ' chip--emoji' : '');
      b.textContent = chip.t;
      b.addEventListener('click', function () { send(chip); });
      box.appendChild(b);
    });
  }
  function setBusy(v) {
    busy = v;
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) { b.disabled = v; });
    $('freesend').disabled = v;
    $('vent').disabled = v;
  }

  /* ————— 「他在听」：默认只听不插话，点那颗键他才开口 ————— */
  function statusLine() {
    if (!current) return '';
    return current.filmCN + ' · ' + current.year + ' · 他在听';
  }
  function ventParts(charId) {
    /* 取「上一次他开口之后」你连着说的所有话，合起来定情绪 */
    var past = history(charId), out = [];
    for (var i = past.length - 1; i >= 0; i--) {
      if (past[i].w !== 'm') break;
      out.unshift(past[i].x || '');
    }
    return out;
  }

  /* ————— 自定义消息：不指望他答对题，但按几个关键词轻轻偏一下情绪桶，
     让「倾诉」这件事看起来像被听见了 ————— */
  function bucketForText(s) {
    if (/累|难过|哭|委屈|睡不着|失眠|烦|怕|孤单|寂寞|难受|崩溃|不开心|低落|emo/i.test(s)) return ['soft', 'love'];
    if (/想你|爱|喜欢|亲|抱|吻|心动|宝贝/.test(s)) return ['love', 'any'];
    if (/在吗|你好|嗨|hello|hi/i.test(s)) return ['anchor', 'any'];
    return ['any'];
  }
  function sendFree() {
    var box = $('freetext');
    var v = box.value.replace(/\s+$/, '');
    if (!v.trim() || busy || !current) return;
    var msg = { w: 'm', t: Date.now(), x: v };
    saveMsg(histKey(current), msg);
    $('log').appendChild(bubbleMe(msg)); scrollLog();
    box.value = ''; box.style.height = 'auto';
    /* 他在听：自己打的字不自动触发回复，点「让他回应」他才开口 */
  }

  /* ————— 对话流程 ————— */
  /* 决定他这一句说什么。顺序：
     他问过你、你答了「嗯 / 没」→ 接那个问题的分支
     → 短答（不知道 / 哦）→ 同一句发两遍 → 只发表情
     → 动作 → 接话 → 主题回声 → 情境桶 → 问句 → 他问过你、你答了别的（先接住）
     → 有时候换他问你一句（40%）→ daily 兜底 → 5 句台词 */
  function composeReply(c, prefs, intent, text, trailCount) {
    var key = histKey(c);
    var hasLib = !!(au && au.buckets);
    var meta = getMeta(key);
    var pend = meta.pending && (Date.now() - meta.pending.t < 6 * 3600e3) ? meta.pending : null;
    if (meta.pending) setMeta(key, { pending: null });
    var q = null, kind = text ? shortKind(text) : null;
    if (hasLib && text) {
      if (pend && (kind === 'yes' || kind === 'no')) q = askBranch(key, pend.key, kind);
      q = q || (kind ? shortReply(kind) : null)
            || (isRepeat(key, trailCount) ? tplReply('repeat') : null)
            || (intent === 'daily' && isEmojiOnly(text) ? tplReply('emoji') : null)
            || actionReply(text) || mirrorReply(text) || topicReply(text);
    }
    q = q || (intent && intent !== 'daily' ? pickFromReplies(c, intent) : null)
          || (hasLib && text && isQuestion(text) ? questionReply() : null)
          || (hasLib && pend ? tplReply('ack') : null)
          || (hasLib && Math.random() < .4 ? askReply(key) : null)
          || (intent ? pickFromReplies(c, intent) : null)
          || pickReply(c, prefs);
    return { label: q.label, line: fillPet(q.line, 'en'), lineCN: fillPet(q.lineCN, 'cn') };
  }

  function himReplies(c, prefs, extraDelay, intent, text, forced, trailCount) {
    var log = $('log');
    var typing = document.createElement('div');
    typing.className = 'msg msg--him typing';
    typing.innerHTML = '<span class="msg-bubble"><i></i><i></i><i></i></span>';
    setBusy(true);
    setTimeout(function () {
      if (current !== c) return;
      log.appendChild(typing); scrollLog();
      setTimeout(function () {
        if (current !== c) return;
        typing.remove();
        var q = forced || composeReply(c, prefs, intent, text, trailCount);
        /* 固定只回一句（Winter 2026-09 定：追加的第二句跟第一句关联太弱，
           反而像两个人在说话；早先那套「12% / 主题命中 85% 追一条」已整体拿掉） */
        var msg = { w: 'h', t: Date.now(), label: q.label, line: q.line, lineCN: q.lineCN };
        saveMsg(histKey(c), msg);
        log.appendChild(bubbleHim(msg)); scrollLog();
        setBusy(false);
      }, 1100 + Math.random() * 1200);
    }, (extraDelay || 0) + 500);
  }

  function send(chip) {
    if (busy || !current) return;
    var msg = { w: 'm', t: Date.now(), x: chip.t, e: !!chip.emoji };
    saveMsg(histKey(current), msg);
    $('log').appendChild(bubbleMe(msg)); scrollLog();
    himReplies(current, chip.pref, 0, chip.intent, chip.t, null, 1);
  }

  /* 两个 AU 的角色：顶部长出切换条，各自一套回复库、各自一段对话 */
  function renderAus() {
    var box = $('aus');
    box.innerHTML = '';
    if (personas.length < 2) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    personas.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chat-au' + (au && p.key === au.key ? ' on' : '');
      b.innerHTML = '<b></b><i></i>';
      b.querySelector('b').textContent = p.labelCN || p.label;
      b.querySelector('i').textContent = p.label;
      b.addEventListener('click', function () {
        if (busy || (au && au.key === p.key)) return;
        au = p;
        renderAus();
        renderLog();
        try { window.history.replaceState(null, '', '?char=' + encodeURIComponent(current.id) +
              (p.key ? '&au=' + encodeURIComponent(p.key) : '')); } catch (e) {}
      });
      box.appendChild(b);
    });
  }

  function renderLog() {
    var log = $('log');
    log.innerHTML = '<div class="chat-day">— This line only rings for you —</div>';
    var past = history(histKey(current));
    past.forEach(function (m) {
      log.appendChild(m.w === 'm' ? bubbleMe(m) : bubbleHim(m));
    });
    setBusy(false);
    scrollLog();
    /* 第一次拨通（这一个 AU 的第一次）：他先开口，说他的锚句 */
    if (!past.length) { himReplies(current, ['anchor'], 300); return; }
    /* 隔了六个钟头以上再回来：他先开口一句（记得上次的事就问那件事）——每次回来只一句 */
    var key = histKey(current), last = past[past.length - 1], gap = Date.now() - (last.t || 0);
    var meta = getMeta(key);
    if (au && au.buckets && gap >= 6 * 3600e3 && !(meta.lastBack && meta.lastBack > (last.t || 0))) {
      var b = backReply(key, gap);
      if (b) { setMeta(key, { lastBack: Date.now() }); himReplies(current, ['any'], 400, 'daily', '', b); }
    }
  }

  function openChat(c, auKey) {
    current = c;
    personas = personasOf(c.id);
    au = personas.filter(function (p) { return p.key === auKey; })[0] || personas[0];
    applyTheme(c);
    $('roster').classList.add('hidden');
    $('chat').classList.remove('hidden');
    $('cname').textContent = c.name;
    $('cstatus').textContent = statusLine();
    $('chatid').href = mfHref(c.id);
    renderAus();
    renderChips();
    renderLog();
    try { window.history.replaceState(null, '', '?char=' + encodeURIComponent(c.id) +
          (au && au.key ? '&au=' + encodeURIComponent(au.key) : '')); } catch (e) {}
  }

  function closeChat() {
    current = null; personas = []; au = null;
    applyTheme(null);
    $('chat').classList.add('hidden');
    $('roster').classList.remove('hidden');
    renderRoster(); // 刷新每个号码的「n 条」计数
    try { window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
  }

  $('vent').addEventListener('click', function () {
    if (busy || !current) return;
    /* 他把你刚说的这一段听完了，回一句（固定一句，Winter 定） */
    var parts = ventParts(histKey(current)), trail = parts.join('。');
    var has = trail.trim();
    himReplies(current, has ? bucketForText(trail) : ['any'], 600,
               has ? intentOf(trail) : 'daily', has ? trail : '', null, parts.length);
  });

  $('freeform').addEventListener('submit', function (e) { e.preventDefault(); sendFree(); });
  $('freetext').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFree(); }
  });
  $('freetext').addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 110) + 'px';
  });

  $('back').addEventListener('click', closeChat);
  $('random').addEventListener('click', function () {
    var pool = visibleChars();
    if (pool.length) openChat(pool[Math.floor(Math.random() * pool.length)]);
  });
  $('search').addEventListener('input', renderRoster);
  $('searchclear').addEventListener('click', function () {
    $('search').value = ''; renderRoster(); $('search').focus();
  });
  /* 搜出唯一一个人时，回车直接拨过去 */
  $('search').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var pool = visibleChars();
    if (pool.length) { this.blur(); openChat(pool[0]); }
  });
  $('clear').addEventListener('click', function () {
    if (!current) return;
    if (window.confirm('把这段对话撕掉？他不会记得，你也找不回。')) {
      clearHistory(histKey(current));
      renderLog();
    }
  });

  /* ————— 数据：唯一来源 ../lines.json ————— */
  Promise.all([
    fetch('../lines.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }),
    /* 回复库是增强项：取不到也不影响热线可用 */
    fetch('../hotline-replies.json', { cache: 'no-cache' })
      .then(function (r) { return r.json(); }).catch(function () { return null; })
  ])
    .then(function (both) {
      var data = both[0];
      REPLIES = (both[1] && both[1].chars) || {};
      EXTRA = both[1] || {};
      MF_ALIAS = (data.meta && data.meta.mf_alias) || {};
      chars = data.characters.slice().sort(function (a, b) { return yearNum(a.year) - yearNum(b.year); });
      $('boot').classList.add('hidden');
      renderRoster();
      var q = new URLSearchParams(window.location.search);
      var want = q.get('char');
      var hit = want && chars.filter(function (c) { return c.id === want; })[0];
      if (hit) { openChat(hit, q.get('au') || undefined); } else { $('roster').classList.remove('hidden'); }
    })
    .catch(function () {
      $('boot').textContent = '线路暂时不通。请检查网络后刷新。';
    });
})();
</script>
</body>
</html>
