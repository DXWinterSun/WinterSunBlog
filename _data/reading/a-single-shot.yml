        note: 名词 torrent 是急流、洪流。这一句说她美，不像温室里的花，而像一朵在烈日、严寒、暴雨里长大的野玫瑰。
        extra:
          - "**搭配**torrential rain / downpour（倾盆大雨）· a torrent of（一连串的，如 a torrent of abuse 一连串的辱骂）"

