    date: 2026-09-26
    pages: 3
    photos: 1
    notes:
      - id: "001"
        page: 3
        color: blue
        term: Timberland
        kind: 名物
        ipa: /ˈtɪmbərlænd/
        pos: n.
        cn: 添柏岚（美国户外靴的牌子）
        en: an American brand of outdoor boots, best known for its tough waterproof work boots
        context: "sweatshirt, and ==Timberland== hiking boots"
        gist: 卫衣，再加一双 Timberland 登山靴。
        note: 美国新罕布什尔州的户外牌子，最出名的是那种黄褐色的防水工装靴，结实耐磨，干活、进山、打猎都穿。作者特意点出牌子，是在告诉你：他这身是要往山里去的打扮。
        extra:
          - "**搭配**Timberland boots（Timberland 靴）· Timbs（口语里的简称）"

      - id: "002"
        page: 3
        color: blue
        term: 12-gauge shotgun
        eudic: gauge shotgun     # 拆成单词导入：12-gauge 欧路查不到
        kind: 名物
        ipa: /ˌtwelv ɡeɪdʒ ˈʃɑːtɡʌn/
        pos: n.
        cn: 12 号口径的霰弹枪
        en: a long gun that fires a lot of small metal bullets (called shot) and is used especially for shooting birds or animals
        en_src: 牛津 8
        context: "he gets his ==12-gauge shotgun== and a handful of slugs"
        gist: 他取出他那把 12 号霰弹枪和一把独头弹。
        note: gauge 是霰弹枪口径的老算法：拿一磅铅，做成大小刚好塞满枪管的等重铅球，能做几个就是几号。所以**数字越小，枪管越粗**。12 号是美国最常见的一种，打猎、看家都用它。牛津在 gauge 这一条里讲“枪管口径”这个意思时，举的例子正好就是 a 12-gauge shotgun。顺带一句，这里的 trailer 不是挂车，而是“拖车屋”——那种能拖走的活动房屋，他就住在里面。
        extra:
          - "**搭配**a 20-gauge（20 号，更细更轻）· a double-barreled shotgun（双管霰弹枪）· gun cabinet（枪柜）"
          - "**易混**gauge 只管霰弹枪；步枪和手枪的口径用 caliber（如 .22 caliber），两套算法不通用。"

      - id: "003"
        page: 3
        color: blue
        term: slugs
        lemma: slug
        kind: 一词多义
        ipa: /slʌɡz/
        pos: n.
        cn: 独头弹（霰弹枪打的一整颗大弹头）
        en: a single solid piece of metal fired from a shotgun, instead of many small pellets
        context: "a handful of ==slugs== from the gun cabinet"
        gist: 从枪柜里取出一把独头弹。
        note: 霰弹枪平常装的是一把小铅丸，打出去散成一片，适合打鸟；slug 是一整颗大弹头，射得远、打得准，是用来打鹿这类大型猎物的。牛津里 slug 最常见的意思是“蛞蝓”（没有壳的蜗牛）；口语里还能指一小口烈酒，当动词是“狠揍”。牛津也收了“子弹”这个意思，标着口语、多见于美式，但没有单列霰弹枪的独头弹，所以这张卡上的英文解释是我自己写的。
        extra:
          - "**搭配**a handful of slugs（一把独头弹）· birdshot（打鸟的细铅丸）· buckshot（鹿弹，大号铅丸）"
          - "**易混**bullet 是步枪、手枪的子弹；shell 是一整发霰弹（弹壳连里面装的东西），slug 只是其中一种装法。"

      - id: "004"
        page: 3
        color: blue
        term: converging
        lemma: converge
        kind: 单词
        ipa: /kənˈvɜːrdʒɪŋ/
        pos: adj.
        cn: （几条路）汇到一处的
        en: (of two or more lines, paths, etc.) to move towards each other and meet at a point
        en_src: 牛津 8
        context: "gazing down at the ==converging== roads"
        gist: 他俯瞰着那几条汇到一起的路。
        note: 这里是动词 converge 的现在分词当形容词用。他站在山上往下看，几条路在谷底的山坳里合拢，所以同一句后面才说起右边那条岔路。这句末尾还有个作者自己造的说法 the three-quarters dark：天只亮了四分之一，还有四分之三是黑的。
        extra:
          - "**搭配**converge on（从各处汇聚到某地，人群、目光都能用）· converging lines（汇聚线）"
          - "**易混**反义是 diverge（分岔、分开）；merge 是两股并成一股，比如车道并线。"

  - n: 2
    date: 2026-09-26
    pages: 4
    photos: 1
    notes:
      - id: "005"
        page: 4
        color: blue
        term: poachers
        lemma: poacher
        kind: 单词
        ipa: /ˈpoʊtʃərz/
        pos: n.
        cn: 偷猎的人
        en: a person who illegally hunts birds, animals or fish on somebody else's property
        en_src: 牛津 8
        context: "to search for would-be ==poachers=="
        gist: 去搜查那些想来偷猎的人。
        note: would-be 是“想要当……的、打算做……的”。这句前面的 green cap 指戴绿帽子的野生动物保护官，也就是管打猎的执法人员。John 在心里宽自己的心：那种人不会天不亮就出来抓偷猎的。
        extra:
          - "**搭配**poach a deer（偷猎一头鹿）· poach eggs（水煮荷包蛋，同一个 poach）"
          - "**易混**hunter 是合法打猎的人；poacher 专指不合法的，在别人的地上、禁猎期、保护区里打。"

      - id: "006"
        page: 4
        color: blue
        term: shrugs
        lemma: shrug
        kind: 单词
        ipa: /ʃrʌɡz/
        pos: v.
        cn: 耸耸肩
        en: to raise your shoulders and then drop them to show that you do not know or care about something
        en_src: 牛津 8
        context: "John ==shrugs==, then starts walking"
        gist: John 耸耸肩，接着往山上走。
        note: 这本书整本用现在时讲故事，所以是 shrugs，不是 shrugged。耸肩在这里是“算了，不想了”的意思：他把那辆车的事放下了。
        extra:
          - "**搭配**shrug your shoulders（耸耸肩）· shrug off（不当回事，比如 shrug off the injury 不把伤当回事）"

      - id: "007"
        page: 4
        color: blue
        term: pine needles
