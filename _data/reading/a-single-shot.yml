# 《A Single Shot》原著笔记 —— Winter 拍书页照片（带荧光笔高亮）发来，Claude 整理成笔记。
# 工作法与每个字段的写法：.claude/skills/winter-reading-notes/SKILL.md
# 生成笔记网页：python3 tools/reading/render_notes.py _data/reading/a-single-shot.yml -o <scratchpad>/a-single-shot-notes.html
#
# ⚠️ 新的一批只往 batches 末尾追加；已有笔记的 id 永远不改（批注锚在卡片 id 上）。
# ⚠️ 这个仓库是公开的：只录高亮所在的那一句，不整页抄书。

book:
  slug: a-single-shot
  title: "A Single Shot"
  author: "Matthew F. Jones"
  year: 1996
  about: "电影《致命一击》（2013）的原著"
  palette: "Wintergreen"     # 取 _data/au_palettes.yml 里 John Moon 那套颜色，跟 Wintergreen 系列同色
  highlighters:              # 网页上两支荧光笔的颜色，跟她书上的笔同色
    blue: "#7fd6dc"          # 蓝＝生词
    pink: "#f2a7c6"          # 粉＝词认识，但用法对她来说新颖、值得对照（第 4、5 页 dressed、cocks 她确认是粉）
    orange: "#f7b27c"        # 橙＝她觉得表达效果好的句子，跟学词无关（2026-09-26 第 11–13 页起）
  detail: full               # 详略 lite / standard / full —— 2026-09-26 她挑了 C「详细」
  detail_picked: true        # 已挑定：样板区只留她选的那一版
  artifact: "https://claude.ai/artifact/AMf2jtPtJ16KX99RCZNuCq"   # 笔记网页（2026-09-26 首发），之后永远更新这一个

