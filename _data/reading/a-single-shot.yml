        eudic: buck
        kind: 打猎用语
        ipa: /ˌten pɔɪnt ˈbʌk/
        pos: n.
        cn: 十个叉的公鹿
        en: a male deer whose antlers have ten points in all
        context: "looking for a ==ten-point buck=="
