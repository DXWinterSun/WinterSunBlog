        eudic: needle
        kind: 名物
        ipa: /ˈpaɪn ˌniːdlz/
        pos: n.
        cn: 松针
        en: the thin, pointed leaves of a pine tree
        context: "a soft bed of ==pine needles=="
        gist: 厚厚一层软软的松针。
        note: needle 本义是“针”，松树的叶子又细又尖，所以叫松针。这里的 bed 不是床，是“铺了一层的底”。后半句说他走在松针上，脚步声在耳朵里响得像踩在雪上，形容林子里静得出奇。
        extra:
