        kind: 单词
        ipa: /bɪˈnɑːkjələrz/
        pos: n.
        cn: 双筒望远镜
        en: an instrument, like two small telescopes fixed together, that makes objects that are far away seem nearer
        en_src: 牛津 8
        context: "through ==binoculars==, he watched it"
