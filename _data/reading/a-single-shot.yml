        note: 美国猎人习惯数鹿角上有几个尖来说一头公鹿有多大，美国东部是两边加起来数。叉越多，鹿越大越老，十个叉已经是很像样的猎物了。buck 在口语里最常见的意思是“一美元”，牛津把这个意思排在第一；这里是第二个意思“公鹿”。
        extra:
          - "**易混**buck 公鹿（也指公兔）；doe 母鹿；stag 也是公鹿，多指英国那种高大的赤鹿；deer 泛指鹿，单复数同形。"

