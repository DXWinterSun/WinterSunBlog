        en: (of cows, sheep, etc.) to eat grass that is growing in a field
        en_src: 牛津 8
        context: "he watched it ==graze== for several minutes"
        gist: 他看着它在林子边上吃了好几分钟草。
        note: watch sb do sth，看着某个动作从头到尾，所以 graze 用原形。graze 还常指“擦破皮、擦过”，牛津的例子是 The bullet grazed his cheek（子弹擦过他的脸颊）。在打猎的书里，这个意思说不定也会碰到。
        extra:
          - "**搭配**graze on grass（啃草）· graze cattle（放牛）· a graze on the knee（膝盖上擦破的皮）"

      - id: "011"
