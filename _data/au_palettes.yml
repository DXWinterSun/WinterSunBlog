# ───────────────────────────────────────────────────────────────
# AU 系列专属配色 —— 与「Many Faces of Sam」画册同源
# 键 = 系列的 series_name，必须与 series/<slug>/index.html 的 series_name
#      以及各章节 front matter 的 series 字段【完全一致】，否则查不到。
# accent     : 强调色（深色主题 + 色卡用）
# accent_ink : 浅色主题下用于文字/链接的更深一档（保证对比度）
# bg         : 背景深色（色卡用）
# *_cn / *_en: 中英色名（与画册一致）
# 注：The One Who Remembers 不在此表 —— 故意跳过，页面保持默认主题。
# ───────────────────────────────────────────────────────────────

