# ── 笔记：多邻国的一句话＝一张卡（这句里牵扯到的知识点都写进同一张卡），按时间往末尾追加 ──
# 2026-10-01 她说「列得太复杂了，不能一个句子分一个吗」——当天把第一批从 21 张并成一句一张，编号也重排了一次（那时还没有任何批注）。
notes:
  # ── 2026-10-01：她在另一个对话里问过的十道多邻国题（那边整理成总结发来，这里逐条核对）＋ 她发来的截图 ──
  - id: "001"
    stuck: 分不清该用哪个格
    date: 2026-10-01
    asked: [2026-10-16]
    source: 多邻国
    point: noun.gen
    also: [noun.plural]
    title: 碗、杯、瓶后面的东西，用属格
    pl: "Duża miska ==wody==."
    zh: 一大碗水。
    mine: "==wode=="
    right: ["Duża miska ==wody==."]
    why: |
      “一碗什么”“一杯什么”，后面那样东西要用属格（也叫生格），相当于英语的 of：一大碗的水。woda 的属格是 wody。
      你写的 wodę 是宾格，那是“喝水、买水、拿水”时用的：Piję wodę.（我喝水。）同一个“水”：被动作直接拿去用，是宾格 wodę；前面有碗、杯、瓶、一点儿，是属格 wody。
      听力上还有个坑：词尾的 ę 平时说话基本念成 e，所以 wodę 听着像 wode，跟 wody 只差最后一个音。
      再多记一层：wody 也可能是“好几份水”。以 -a 结尾、词干是硬辅音的阴性名词，单数属格和复数主格长得一模一样，只能看上下文：filiżanka kawy 一杯咖啡，是单数属格；dwie kawy 两杯咖啡，是复数。不是所有阴性名词都这样，比如 ulica（街）就分开：单数属格 ulicy，复数 ulice。
    rule:
      - 前面有“一碗、一杯、一瓶、一点儿”，后面就用属格。
      - 看见 wody 先看前面：有量词是“水的”，有数字是“好几份”。
    table:
      - head: ["", "原形", "一杯……"]
        rows:
          - ["水", "woda", "szklanka ==wody=="]
          - ["咖啡", "kawa", "filiżanka ==kawy=="]
          - ["茶", "herbata", "kubek ==herbaty=="]
      - head: ["", "单数属格", "复数主格", "复数属格"]
        rows:
          - ["水", "wody", "wody", "wód"]
          - ["咖啡", "kawy", "kawy", "kaw"]
          - ["碗", "miski", "miski", "misek"]
          - ["街", "ulicy", "==ulice==", "ulic"]
    extra:
      - "**三种杯子**szklanka 是玻璃杯，filiżanka 是带把的小瓷杯，kubek 是马克杯。"
      - "**k、g 后面写 i**波兰语里 k、g 后面不写 y、改写 i，所以 miska 的单数属格和复数都是 miski。"
    examples:
      - {pl: "Piję ==wodę==.", zh: 我喝水。（宾格）}
      - {pl: "Szklanka ==wody==, proszę.", zh: 请给我一杯水。（属格）}
      - {pl: "Dwie ==kawy==, proszę.", zh: 请来两杯咖啡。（复数）}
    words:
      - {pl: miska, zh: 碗, tag: 阴}
      - {pl: woda, zh: 水, tag: 阴}
      - {pl: duży, zh: 大的, tag: 形容词}
      - {pl: szklanka, zh: 玻璃杯, tag: 阴}
      - {pl: filiżanka, zh: 带把的小瓷杯, tag: 阴}
      - {pl: kubek, zh: 马克杯, tag: 阳}
      - {pl: ulica, zh: 街, tag: 阴}
    qa:
      - q: 生格是什么呀🤣
        a: "波兰语的名词会换词尾：同一个词在句子里干不同的活，就换一个样子，一共七种，就叫七个格。中文靠“的、没有、到、给”这些小词来说关系，波兰语把这些关系直接做在词尾上。属格是其中一种，名字别管它，记它干的三样活就行：**……的**（szklanka ==wody== 一杯水）、**没有……**（Nie piję ==kawy==. 我不喝咖啡）、**跟在 do、od、bez、dla、podczas 这些介词后面**（podczas ==obiadu== 吃午饭时）。长相：-a 结尾的阴性换成 -y 或 -i（kawa → kawy），阳性加 -u 或 -a（obiad → obiadu，人和动物多半加 -a），-o 结尾的中性换成 -a（wino → wina）。"
      - q: 你之前给我讲的“主属与宾工位呼”，生格是哪个？
        a: "就是那个“属”。生格和属格是同一个格的两个叫法，都是第二格（波兰语叫 dopełniacz）。口诀七个字对着笔记里的名字：主格 · **属格＝生格** · 与格 · 宾格 · 工具格 · **位格＝方位格** · 呼格。"

  - id: "002"
    stuck: l 和 r 听不出区别
    date: 2026-10-01
    source: 多邻国
    task: listen
    point: sound.letters
    also: [sound.sandhi, syntax.neg]
    title: r 是舌尖弹一下，l 是舌尖贴住不动
    pl: "Dlaczego nie nosisz ==okularów==?"
    zh: 你为什么不戴眼镜？
    mine: "==okulalof=="
    right: ["Dlaczego nie nosisz ==okularów==?"]
    why: |
      先说好消息：词尾你其实听对了。ó 和 u 读音一样，词尾的 w 要念成清的 f，所以 okularów 实际就念 okularuf。你写的 -of 只是拼法没对上念法。
      卡住的是中间那个 r。r 夹在两个元音中间时，舌尖往往只弹一下，非常短，很容易被听成 l。l：舌尖贴住上牙床不动，声音连续、平滑。r：舌尖快速弹一下就离开，听起来更“脆”，有点像一个很轻的 d。
      顺带记一条规律：波兰语的词一到结尾，浊辅音就念成清的——b 念 p，d 念 t，g 念 k，w 念 f，z 念 s，ż 和 rz 念 sz。所以 chleb（面包）念 chlep。听写时要反过来想：听见词尾是 p、f、t，写下来可能是 b、w、d。
    rule:
      - 听着“脆”、像舌尖轻轻碰了一下的是 r；平平滑过去的是 l。
      - 听见词尾是清音，写下来可能是浊音字母。
    extra:
      - "**为什么是 okularów**okulary（眼镜）只有复数。肯定句用宾格：Nosisz okulary.（你戴眼镜。）一加 nie，宾语换成属格：Nie nosisz okularów. 跟第 4 条一个道理。"
    words:
      - {pl: okulary, zh: 眼镜, tag: 只有复数}
      - {pl: nosić, zh: 穿、戴（经常穿戴）, tag: 未完成体}
      - {pl: dlaczego, zh: 为什么}
      - {pl: chleb, zh: 面包, tag: 阳}
    see: ["004"]

  - id: "003"
    stuck: k 和 g 分不清
    date: 2026-10-01
    source: 多邻国
    task: listen
    point: sound.letters
    title: 波兰语的 k 和 g 靠喉咙振不振，不靠送不送气
    pl: "Niebieska czy zielona ==golarka==?"
    zh: 蓝色的还是绿色的剃须刀？
    mine: "==kolarka=="
    right: ["Niebieska czy zielona ==golarka==?"]
    why: |
      普通话的 g 和 k 靠送不送气区分：k 带一股气，g 不带，但两个都不振动声带。
      波兰语的 g 和 k 靠声带振不振动区分：g 振动，k 不振动，而且 k 不送气。所以波兰语的 k 听起来就像普通话的 g——中国人习惯用来分辨的那股气，在这里根本不存在。p 和 b、t 和 d 也是同一回事。
      怎么听：g 在爆破之前喉咙会先“嗡”一下，整个音更闷、更厚；k 干干净净，没有那一下。手指搭在喉咙上念 zzzz 会震、念 ssss 不震——s 和 z 能拉长，好听出来；g 和 k 的振动只在爆破前几十毫秒，一闪而过，所以难。
    rule: 先“嗡”一下再爆开的是 g，干干脆脆直接爆开的是 k。
    extra:
      - "**小插曲**kolarka 也是个真词，意思是女自行车手。golarka 来自动词 golić（刮胡子）。"
    words:
      - {pl: golarka, zh: 剃须刀, tag: 阴}
      - {pl: niebieski, zh: 蓝色的, tag: 形容词}
      - {pl: zielony, zh: 绿色的, tag: 形容词}
      - {pl: czy, zh: 还是（二选一）；是不是（疑问句开头）}

  - id: "004"
    date: 2026-10-01
    source: 多邻国
    point: syntax.neg
    also: [noun.gen]
    title: 否定句里，宾语要从宾格换成属格
    pl: "Oni nie sprzedają ==gąbek==."
    en: "They don't sell sponges."
    zh: 他们不卖海绵。
    mine: "==gąbka=="
    right: ["Oni nie sprzedają ==gąbek==."]
    why: |
      这题是两件事叠在一起。第一件：一加 nie，本来该用宾格的宾语就要换成属格。第二件：题面英语是复数 sponges，所以要用复数的属格。
      变化路线：gąbka（一块海绵，原形）→ Sprzedają gąbki.（他们卖海绵，复数宾格）→ Nie sprzedają gąbek.（他们不卖海绵，复数属格）。
      gąbek 是怎么来的：以 -a 结尾的阴性名词，复数属格是把词尾的 -a 去掉（woda → wód，kawa → kaw）。gąbka 去掉 -a 剩下 gąbk，结尾两个辅音挤在一起念不顺，中间就冒出一个 e：gąbek。这个 e 不是硬塞的：古代斯拉夫语里这个位置本来就有一个很弱的元音，在别的形式里都消失了，只在复数属格这种位置上留了下来。
    rule:
      - 有 nie，宾语就从宾格换成属格。
      - -ka 结尾的阴性名词，复数属格基本都是 -ek。
    table:
      - head: ["", "肯定 · 宾格", "否定 · 属格"]
        rows:
          - ["眼镜", "Nosisz ==okulary==.", "Nie nosisz ==okularów==."]
          - ["海绵（复数）", "Sprzedają ==gąbki==.", "Nie sprzedają ==gąbek==."]
          - ["水", "Piję ==wodę==.", "Nie piję ==wody==."]
      - head: ["", "原形", "复数属格"]
        rows:
          - ["海绵", "gąbka", "==gąbek=="]
          - ["勺子", "łyżka", "==łyżek=="]
          - ["书", "książka", "==książek=="]
          - ["牙刷", "szczoteczka", "==szczoteczek=="]
    extra:
      - "**例外**只管本来该用宾格的宾语。być（是）后面用工具格，加了 nie 也不变：Jestem nauczycielką. → Nie jestem nauczycielką."
      - "**会跑的 e**反过来也有：widelec（叉子）一加词尾，e 就不见了，变成 widelcem。见第 10 条。"
    words:
      - {pl: gąbka, zh: 海绵, tag: 阴}
      - {pl: sprzedawać, zh: 卖, tag: 未完成体}
      - {pl: łyżka, zh: 勺子, tag: 阴}
      - {pl: książka, zh: 书, tag: 阴}
    see: ["002", "010"]

  - id: "005"
    date: 2026-10-01
    source: 多邻国
    point: noun.gen
    title: potrzebować（需要）后面天生用属格
    ask: 为什么是 wody，不是 wodę？
    pl: "Potrzebujesz ==gąbki== i ==wody==."
    zh: 你需要一块海绵和水。
    why: |
      有些动词天生就要属格，不管肯定还是否定。potrzebować（需要）就是一个，所以 gąbki 和 wody 都是属格。
      gąbki 在这里是单数属格（题面是一块海绵），只是刚好跟复数长得一样，见第 1 条。
    rule: 需要、寻找、听、使用、学、害怕——这几个动词后面直接用属格。
    table:
      head: ["", "动词", "例子"]
      rows:
        - ["需要", "potrzebować", "Potrzebuję ==wody==."]
        - ["寻找", "szukać", "Szukam ==pracy==."]
        - ["听", "słuchać", "Słucham ==muzyki==."]
        - ["使用", "używać", "Używam ==łyżki==."]
        - ["学", "uczyć się", "Uczę się ==polskiego==."]
        - ["害怕", "bać się", "Boję się ==psa==."]
    extra:
      - "**例子的意思**我需要水。我在找工作。我在听音乐。我用勺子。我在学波兰语。我怕狗。"
    words:
      - {pl: potrzebować, zh: 需要, tag: 未完成体}
      - {pl: szukać, zh: 寻找, tag: 未完成体}
      - {pl: słuchać, zh: 听, tag: 未完成体}
      - {pl: używać, zh: 使用, tag: 未完成体}
      - {pl: bać się, zh: 害怕, tag: 未完成体, look: bać}
    see: ["001"]

  - id: "006"
    stuck: 听的时候 nowy 和 nowe 纠结了半天
    date: 2026-10-01
    source: 多邻国
    task: listen
    point: adj.agree
    also: [prep.case]
    title: 复数里没有 nowy，只在 nowe 和 nowi 之间选
    pl: "Dostajemy ==nowe== szczoteczki do zębów."
    zh: 我们要拿到新牙刷了。
    mine: "dostajemy ==nowy== szczoteczki do zębów"
    right: ["Dostajemy ==nowe== szczoteczki do zębów."]
    why: |
      形容词要跟着名词变，所以可以不靠耳朵、靠语法来选。szczoteczki 是复数：dostawać（得到）后面用宾格，复数的宾格跟复数主格长得一样。
      主格和宾格里：nowy 只给阳性单数，如 nowy telefon（新手机）；nowe 给复数（不是一群男人时），如 nowe szczoteczki（新牙刷）、nowe studentki（新来的女学生们）；nowi 给一群男人（有男有女也算），如 nowi studenci（新来的学生们）。
      所以只要听出名词是复数，形容词就只在 nowe 和 nowi 之间选，nowy 直接划掉。
    rule: 名词是复数，就把 nowy 划掉。
    table:
      head: ["", "阳 · 单", "阴 · 单", "中 · 单", "复 · 不是男人", "复 · 男人"]
      rows:
        - ["主格", "nowy", "nowa", "==nowe==", "==nowe==", "nowi"]
    extra:
      - "**补一句**nowe 还管中性单数：nowe okno（新窗户）、nowe mieszkanie（新公寓）。所以听到 nowe 不一定是复数，要看后面的名词。"
      - "**do zębów**do 后面一律用属格：ząb（牙）→ zębów。szczoteczka 是 szczotka（刷子）的小称，szczoteczka do zębów 就是“刷牙齿的小刷子”——牙刷。"
    words:
      - {pl: nowy, zh: 新的, tag: 形容词}
      - {pl: szczoteczka do zębów, zh: 牙刷, tag: 阴, look: szczotka}
      - {pl: dostawać, zh: 得到、收到, tag: 未完成体}
      - {pl: ząb, zh: 牙, tag: 阳}
    see: ["007", "011"]

  - id: "007"
    date: 2026-10-01
    source: 多邻国
    ok: true
    point: noun.acc
    title: 单数宾格把 -a 换成 -ę，复数宾格跟复数主格一样
    pl: "Ty kupujesz ==szczoteczkę== do zębów."
    zh: 你在买一把牙刷。
    why: |
      szczoteczkę 是单数宾格：以 -a 结尾的阴性名词，单数宾格把 -a 换成 -ę。
      对比第 6 条：Dostajemy nowe szczoteczki——szczoteczki 是复数宾格。kupować（买）和 dostawać（得到）后面都用宾格。
    rule: 一把是 -ę；好几把，跟复数主格一样。
    examples:
      - {pl: "Kupuję ==kawę==.", zh: 我买咖啡。}
      - {pl: "Kupuję ==gąbki==.", zh: 我买（几块）海绵。}
    words:
      - {pl: kupować, zh: 买, tag: 未完成体}
    see: ["006"]

  - id: "008"
    stuck: e 和 y 分不清，经常靠猜
    date: 2026-10-01
    source: 多邻国
    task: fill
    typo: true
    point: noun.plural
    also: [sound.letters]
    title: 词尾听不清是 e 还是 y，就用语法来定
    pl: "Jakiego koloru są twoje ==ściany==?"
    en: "What color are your walls?"
    zh: 你的墙是什么颜色的？
    mine: "Jakiego koloru są twoje ==ściane==?"
    right: ["Jakiego koloru są twoje ==ściany==?"]
    why: |
      这两个音本来就挨得很近：波兰语 y 的实际读音比课本上说的要低一点，往 e 那边靠（维基词典给 trzy 标的音是 /ˈtʂɘ/）。听感上，y 像英语 bit 里的 i，嘴更闭、舌头更高；e 像 bed 里的 e，嘴张得更开。多邻国这次只判了“拼写错误”，算你过了。
      耳朵分不清时，用语法来定。① 先看是不是复数：这句有 są、twoje，肯定是复数。② 再看名词去掉 -a 后最后一个辅音：ściana 剩下 ścian，最后是 n（前面的 ś 不管）。③ n 是硬音，硬音后面的复数一律是 -y，所以是 ściany。
      顺手把复数的词尾一次记全：除了指男人的，基本就三类——硬辅音结尾的是 -y（k、g 后面写成 -i，其实是同一个），软辅音和 c、cz、sz、rz、ż、j、l 结尾的是 -e，中性名词是 -a。指男性的人另有一套。
    rule:
      - 复数 + 硬音结尾 → -y。
      - 除了指男人的，复数就三类：-y／-i、-e、-a。
    table:
      pl: [1]
      head: ["词尾", "例子", "什么时候"]
      rows:
        - ["-y", "kot → ==koty==、ściana → ==ściany==", "硬辅音结尾的阴性、阳性"]
        - ["-i", "gąbka → ==gąbki==、ptak → ==ptaki==", "k、g 结尾"]
        - ["-e", "ulica → ==ulice==、klucz → ==klucze==", "软辅音，c、cz、sz、rz、ż、j、l 结尾"]
        - ["-a", "okno → ==okna==、jabłko → ==jabłka==", "中性名词"]
        - ["另一套", "student → ==studenci==、pan → ==panowie==", "指男性的人"]
    extra:
      - "**顺带一个属格**Jakiego koloru 字面是“什么颜色的”，本身就是属格（kolor → koloru）。问颜色，波兰语就这么问。"
      - "**也有不守规矩的**比如 ręka（手）的复数是 ręce。"
    words:
      - {pl: ściana, zh: 墙, tag: 阴}
      - {pl: kolor, zh: 颜色, tag: 阳}
      - {pl: twój, zh: 你的}
      - {pl: kot, zh: 猫, tag: 阳 · 有生}
      - {pl: ptak, zh: 鸟, tag: 阳 · 有生}
      - {pl: klucz, zh: 钥匙, tag: 阳}
      - {pl: okno, zh: 窗户, tag: 中}
      - {pl: jabłko, zh: 苹果, tag: 中}
    see: ["011"]

  - id: "009"
    stuck: 一开始写成 szedmiu，觉得不像个词，靠输入法联想才拼出 przedmiot
    date: 2026-10-01
    source: 多邻国
    ok: true
    task: listen
    point: sound.sandhi
    title: rz 跟在 p、t、k 后面念 sz：przedmiot 念 pszedmiot
    pl: "Ten ==przedmiot== to książka."
    en: "This object is a book."
    zh: 这个物品是一本书。
    mine: "ten przedmiot to książka"
    why: |
      szedmiu 其实不是瞎写：prz 里的 rz 跟在清辅音 p 后面会变清，念成 sz，所以 przedmiot 实际念 pszedmiot。耳朵抓住的 sz 是真的，只是开头那个很轻的 p 被吞掉了。
      同样的事：przepraszam（对不起）念 pszepraszam，krzesło（椅子）念 kszesło，Krzysztof 念 Kszysztof。
      trzy（三）是 t + sz + y，听起来很像 czy。细分的话，trzy 里的 t 和 sz 是先后两个音，cz 是一整个音，语速一快差别就很小了。注意不是 szy：开头的 t 还在。
    rule: p、t、k、ch 后面的 rz，念 sz。
    extra:
      - "**不在清辅音后面时**rz 念 ż：rzeźnik（屠夫）开头就是这个音。Goo Goo Dolls 主唱 John Rzeznik 的姓就是这个词，一个词里同时有 rz 和 ź。"
      - "**词源**przedmiot 是 przed-（在……前面）加 miotać（扔、抛），照拉丁语 obiectum 一个零件一个零件仿出来的，18 世纪末才出现；英语 object 也来自这个拉丁词，字面是“扔到对面的东西”。同一个办法还造了 podmiot（扔在下面的东西＝语法里的主语），仿的是 subiectum。俄语 предмет、捷克语 předmět 都是从波兰语借过去的。"
    words:
      - {pl: przedmiot, zh: 物品；（学校的）科目, tag: 阳}
      - {pl: przepraszam, zh: 对不起}
      - {pl: krzesło, zh: 椅子, tag: 中}
      - {pl: trzy, zh: 三}
      - {pl: rzeźnik, zh: 屠夫, tag: 阳 · 有生}
    see: ["011"]

  - id: "010"
    date: 2026-10-01
    source: 多邻国
    ok: true
    task: listen
    point: noun.ins
    title: “用什么”做事，工具就用工具格，不加介词
    ask: widelcem 是什么结构？
    pl: "Czy on je zupę ==widelcem==?"
    en: "Is he eating the soup with a fork?"
    zh: 他是用叉子喝汤吗？
    mine: "czy on je zupę widelcem"
    why: |
      拆开看：czy（是不是，放在疑问句开头）· on je（他吃，波兰语里汤是“吃”的）· zupę（汤，zupa 的单数宾格）· widelcem（用叉子）。
      widelcem 是 widelec（叉子）的工具格，表示“用什么东西”做事，相当于中文的“用叉子”，前面不用加介词。
      widelec 变 widelcem 时，中间的 e 不见了。跟 gąbka 变 gąbek 是同一类“会跑的 e”，只是方向相反：这次是原形里有 e，一加词尾它就跑了。
    rule: “用……”就是工具格，不加介词。
    table:
      head: ["", "原形", "工具格"]
      rows:
        - ["叉子（阳）", "widelec", "==widelcem=="]
        - ["刀（阳）", "nóż", "==nożem=="]
        - ["勺子（阴）", "łyżka", "==łyżką=="]
        - ["手（阴）", "ręka", "==ręką=="]
    extra:
      - "**词尾**阳性、中性加 -em（k、g 后面是 -iem：kciuk → kciukiem）；阴性把 -a 换成 -ą。nóż 变 nożem 时，ó 还变回了 o。"
      - "**也用来说职业**“我是……”后面的身份也用工具格：Jestem nauczycielką.（我是老师。）nauczycielka → nauczycielką。"
    words:
      - {pl: widelec, zh: 叉子, tag: 阳}
      - {pl: nóż, zh: 刀, tag: 阳}
      - {pl: zupa, zh: 汤, tag: 阴}
      - {pl: jeść, zh: 吃, tag: 未完成体}
      - {pl: nauczycielka, zh: 女老师, tag: 阴}
    see: ["004"]

  - id: "011"
    date: 2026-10-01
    source: 多邻国
    ok: true
    task: translate
    point: pron.possess
    also: [duo.english]
    title: 英语一个 your，波兰语要分“你的”和“你们的”
    pl: "Jakiego koloru jest ==wasze== prześcieradło?"
    en: "What color is your bedsheet?"
    zh: 你们的床单是什么颜色的？
    mine: "What color is your bedsheet"
    why: |
      英语只有一个 your，分不出是“你的”还是“你们的”。波兰语分开：对一个人说 twój（你的），对好几个人说 wasz（你们的）。这句是 wasze，其实是在问“你们”，比如问一对住在一起的人。
      wasze 为什么是 -e：物主词也要跟着名词变，跟第 6 条的 nowe 一个道理。prześcieradło（床单）是中性单数，所以用 wasze。第 8 条的 twoje ściany 也是 -e，那是因为 ściany 是复数。
      jest 和 są 也跟着名词走：一条床单用 jest，好几面墙用 są。
    rule: 中性单数、复数（不是指男人），物主词都用 -e 那个样子：twoje、wasze。
    table:
      head: ["", "阳 · 单", "阴 · 单", "中 · 单", "复 · 不是男人", "复 · 男人"]
      rows:
        - ["你的", "twój", "twoja", "==twoje==", "==twoje==", "twoi"]
        - ["你们的", "wasz", "wasza", "==wasze==", "==wasze==", "wasi"]
    extra:
      - "**听起来**prześcieradło 开头的 prz 念 psz，跟第 9 条的 przedmiot 一样。"
    words:
      - {pl: prześcieradło, zh: 床单, tag: 中}
      - {pl: wasz, zh: 你们的}
      - {pl: twój, zh: 你的}
    see: ["008", "006", "009"]

  - id: "012"
    section: vocab
    date: 2026-10-01
    source: 多邻国
    point: words.phrase
    title: Trzymam kciuki! 是“祝你好运”
    pl: "==Trzymam kciuki==!"
    zh: 祝你好运！（字面：我替你攥着大拇指。）
    why: |
      字面意思是“我（替你）攥着大拇指”。有人要去考试、面试，波兰人就这么说，相当于英语的 Fingers crossed!
      手势也不一样：是攥起拳头、把大拇指握在里面，不是交叉手指。
    rule: 别人要去闯一关，就说 Trzymam kciuki!
