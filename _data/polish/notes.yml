# ── 笔记：多邻国的一句话＝一张卡（这句里牵扯到的知识点都写进同一张卡），按时间往末尾追加 ──
# 2026-10-01 她说「列得太复杂了，不能一个句子分一个吗」——当天把第一批从 21 张并成一句一张，编号也重排了一次（那时还没有任何批注）。
notes:
  # ── 2026-10-01：她在另一个对话里问过的十道多邻国题（那边整理成总结发来，这里逐条核对）＋ 她发来的截图 ──
  - id: "001"
    stuck: 分不清该用哪个格
    date: 2026-10-01
    source: 多邻国
    point: noun.gen
    also: [noun.plural]
    title: 碗、杯、瓶后面的东西，用生格
    pl: "Duża miska ==wody==."
    zh: 一大碗水。
    mine: "==wode=="
    right: ["Duża miska ==wody==."]
    why: |
      “一碗什么”“一杯什么”，后面那样东西要用生格（也叫属格），相当于英语的 of：一大碗的水。woda 的生格是 wody。
      你写的 wodę 是宾格，那是“喝水、买水、拿水”时用的：Piję wodę.（我喝水。）同一个“水”：被动作直接拿去用，是宾格 wodę；前面有碗、杯、瓶、一点儿，是生格 wody。
      听力上还有个坑：词尾的 ę 平时说话基本念成 e，所以 wodę 听着像 wode，跟 wody 只差最后一个音。
      再多记一层：wody 也可能是“好几份水”。以 -a 结尾、词干是硬辅音的阴性名词，单数生格和复数主格长得一模一样，只能看上下文：filiżanka kawy 一杯咖啡，是单数生格；dwie kawy 两杯咖啡，是复数。不是所有阴性名词都这样，比如 ulica（街）就分开：单数生格 ulicy，复数 ulice。
    rule:
      - 前面有“一碗、一杯、一瓶、一点儿”，后面就用生格。
      - 看见 wody 先看前面：有量词是“水的”，有数字是“好几份”。
    table:
      - head: ["", "原形", "一杯……"]
        rows:
          - ["水", "woda", "szklanka ==wody=="]
          - ["咖啡", "kawa", "filiżanka ==kawy=="]
          - ["茶", "herbata", "kubek ==herbaty=="]
      - head: ["", "单数生格", "复数主格", "复数生格"]
        rows:
          - ["水", "wody", "wody", "wód"]
          - ["咖啡", "kawy", "kawy", "kaw"]
          - ["碗", "miski", "miski", "misek"]
          - ["街", "ulicy", "==ulice==", "ulic"]
    extra:
      - "**三种杯子**szklanka 是玻璃杯，filiżanka 是带把的小瓷杯，kubek 是马克杯。"
      - "**k、g 后面写 i**波兰语里 k、g 后面不写 y、改写 i，所以 miska 的单数生格和复数都是 miski。"
    examples:
      - {pl: "Piję ==wodę==.", zh: 我喝水。（宾格）}
      - {pl: "Szklanka ==wody==, proszę.", zh: 请给我一杯水。（生格）}
      - {pl: "Dwie ==kawy==, proszę.", zh: 请来两杯咖啡。（复数）}
    words:
      - {pl: miska, zh: 碗, tag: 阴}
      - {pl: woda, zh: 水, tag: 阴}
      - {pl: duży, zh: 大的, tag: 形容词}
      - {pl: szklanka, zh: 玻璃杯, tag: 阴}
      - {pl: filiżanka, zh: 带把的小瓷杯, tag: 阴}
      - {pl: kubek, zh: 马克杯, tag: 阳}
      - {pl: ulica, zh: 街, tag: 阴}

  - id: "002"
    stuck: l 和 r 听不出区别
    date: 2026-10-01
    source: 多邻国
    task: listen
    point: sound.letters
    also: [sound.sandhi, syntax.neg]
    title: r 是舌尖弹一下，l 是舌尖贴住不动
    pl: "Dlaczego nie nosisz ==okularów==?"
    zh: 你为什么不戴眼镜？
    mine: "==okulalof=="
    right: ["Dlaczego nie nosisz ==okularów==?"]
    why: |
      先说好消息：词尾你其实听对了。ó 和 u 读音一样，词尾的 w 要念成清的 f，所以 okularów 实际就念 okularuf。你写的 -of 只是拼法没对上念法。
      卡住的是中间那个 r。r 夹在两个元音中间时，舌尖往往只弹一下，非常短，很容易被听成 l。l：舌尖贴住上牙床不动，声音连续、平滑。r：舌尖快速弹一下就离开，听起来更“脆”，有点像一个很轻的 d。
      顺带记一条规律：波兰语的词一到结尾，浊辅音就念成清的——b 念 p，d 念 t，g 念 k，w 念 f，z 念 s，ż 和 rz 念 sz。所以 chleb（面包）念 chlep。听写时要反过来想：听见词尾是 p、f、t，写下来可能是 b、w、d。
    rule:
      - 听着“脆”、像舌尖轻轻碰了一下的是 r；平平滑过去的是 l。
      - 听见词尾是清音，写下来可能是浊音字母。
    extra:
      - "**为什么是 okularów**okulary（眼镜）只有复数。肯定句用宾格：Nosisz okulary.（你戴眼镜。）一加 nie，宾语换成生格：Nie nosisz okularów. 跟第 4 条一个道理。"
    words:
      - {pl: okulary, zh: 眼镜, tag: 只有复数}
      - {pl: nosić, zh: 穿、戴（经常穿戴）, tag: 未完成体}
      - {pl: dlaczego, zh: 为什么}
      - {pl: chleb, zh: 面包, tag: 阳}
    see: ["004"]

  - id: "003"
    stuck: k 和 g 分不清
    date: 2026-10-01
    source: 多邻国
    task: listen
    point: sound.letters
    title: 波兰语的 k 和 g 靠喉咙振不振，不靠送不送气
    pl: "Niebieska czy zielona ==golarka==?"
    zh: 蓝色的还是绿色的剃须刀？
    mine: "==kolarka=="
    right: ["Niebieska czy zielona ==golarka==?"]
    why: |
      普通话的 g 和 k 靠送不送气区分：k 带一股气，g 不带，但两个都不振动声带。
      波兰语的 g 和 k 靠声带振不振动区分：g 振动，k 不振动，而且 k 不送气。所以波兰语的 k 听起来就像普通话的 g——中国人习惯用来分辨的那股气，在这里根本不存在。p 和 b、t 和 d 也是同一回事。
      怎么听：g 在爆破之前喉咙会先“嗡”一下，整个音更闷、更厚；k 干干净净，没有那一下。手指搭在喉咙上念 zzzz 会震、念 ssss 不震——s 和 z 能拉长，好听出来；g 和 k 的振动只在爆破前几十毫秒，一闪而过，所以难。
    rule: 先“嗡”一下再爆开的是 g，干干脆脆直接爆开的是 k。
    extra:
      - "**小插曲**kolarka 也是个真词，意思是女自行车手。golarka 来自动词 golić（刮胡子）。"
    words:
      - {pl: golarka, zh: 剃须刀, tag: 阴}
      - {pl: niebieski, zh: 蓝色的, tag: 形容词}
      - {pl: zielony, zh: 绿色的, tag: 形容词}
      - {pl: czy, zh: 还是（二选一）；是不是（疑问句开头）}

  - id: "004"
    date: 2026-10-01
    source: 多邻国
    point: syntax.neg
    also: [noun.gen]
    title: 否定句里，宾语要从宾格换成生格
    pl: "Oni nie sprzedają ==gąbek==."
    en: "They don't sell sponges."
    zh: 他们不卖海绵。
    mine: "==gąbka=="
    right: ["Oni nie sprzedają ==gąbek==."]
    why: |
      这题是两件事叠在一起。第一件：一加 nie，本来该用宾格的宾语就要换成生格。第二件：题面英语是复数 sponges，所以要用复数的生格。
      变化路线：gąbka（一块海绵，原形）→ Sprzedają gąbki.（他们卖海绵，复数宾格）→ Nie sprzedają gąbek.（他们不卖海绵，复数生格）。
      gąbek 是怎么来的：以 -a 结尾的阴性名词，复数生格是把词尾的 -a 去掉（woda → wód，kawa → kaw）。gąbka 去掉 -a 剩下 gąbk，结尾两个辅音挤在一起念不顺，中间就冒出一个 e：gąbek。这个 e 不是硬塞的：古代斯拉夫语里这个位置本来就有一个很弱的元音，在别的形式里都消失了，只在复数生格这种位置上留了下来。
    rule:
      - 有 nie，宾语就从宾格换成生格。
      - -ka 结尾的阴性名词，复数生格基本都是 -ek。
    table:
      - head: ["", "肯定 · 宾格", "否定 · 生格"]
        rows:
          - ["眼镜", "Nosisz ==okulary==.", "Nie nosisz ==okularów==."]
          - ["海绵（复数）", "Sprzedają ==gąbki==.", "Nie sprzedają ==gąbek==."]
          - ["水", "Piję ==wodę==.", "Nie piję ==wody==."]
      - head: ["", "原形", "复数生格"]
        rows:
          - ["海绵", "gąbka", "==gąbek=="]
          - ["勺子", "łyżka", "==łyżek=="]
          - ["书", "książka", "==książek=="]
          - ["牙刷", "szczoteczka", "==szczoteczek=="]
    extra:
      - "**例外**只管本来该用宾格的宾语。być（是）后面用工具格，加了 nie 也不变：Jestem nauczycielką. → Nie jestem nauczycielką."
      - "**会跑的 e**反过来也有：widelec（叉子）一加词尾，e 就不见了，变成 widelcem。见第 10 条。"
    words:
      - {pl: gąbka, zh: 海绵, tag: 阴}
      - {pl: sprzedawać, zh: 卖, tag: 未完成体}
      - {pl: łyżka, zh: 勺子, tag: 阴}
      - {pl: książka, zh: 书, tag: 阴}
    see: ["002", "010"]

  - id: "005"
    date: 2026-10-01
    source: 多邻国
    point: noun.gen
    title: potrzebować（需要）后面天生用生格
    ask: 为什么是 wody，不是 wodę？
    pl: "Potrzebujesz ==gąbki== i ==wody==."
    zh: 你需要一块海绵和水。
    why: |
      有些动词天生就要生格，不管肯定还是否定。potrzebować（需要）就是一个，所以 gąbki 和 wody 都是生格。
      gąbki 在这里是单数生格（题面是一块海绵），只是刚好跟复数长得一样，见第 1 条。
    rule: 需要、寻找、听、使用、学、害怕——这几个动词后面直接用生格。
    table:
      head: ["", "动词", "例子"]
      rows:
        - ["需要", "potrzebować", "Potrzebuję ==wody==."]
        - ["寻找", "szukać", "Szukam ==pracy==."]
        - ["听", "słuchać", "Słucham ==muzyki==."]
        - ["使用", "używać", "Używam ==łyżki==."]
        - ["学", "uczyć się", "Uczę się ==polskiego==."]
        - ["害怕", "bać się", "Boję się ==psa==."]
    extra:
      - "**例子的意思**我需要水。我在找工作。我在听音乐。我用勺子。我在学波兰语。我怕狗。"
    words:
      - {pl: potrzebować, zh: 需要, tag: 未完成体}
      - {pl: szukać, zh: 寻找, tag: 未完成体}
      - {pl: słuchać, zh: 听, tag: 未完成体}
      - {pl: używać, zh: 使用, tag: 未完成体}
      - {pl: bać się, zh: 害怕, tag: 未完成体, look: bać}
    see: ["001"]

  - id: "006"
    stuck: 听的时候 nowy 和 nowe 纠结了半天
    date: 2026-10-01
    source: 多邻国
    task: listen
    point: adj.agree
    also: [prep.case]
    title: 复数里没有 nowy，只在 nowe 和 nowi 之间选
    pl: "Dostajemy ==nowe== szczoteczki do zębów."
    zh: 我们要拿到新牙刷了。
    mine: "dostajemy ==nowy== szczoteczki do zębów"
    right: ["Dostajemy ==nowe== szczoteczki do zębów."]
    why: |
      形容词要跟着名词变，所以可以不靠耳朵、靠语法来选。szczoteczki 是复数：dostawać（得到）后面用宾格，复数的宾格跟复数主格长得一样。
      主格和宾格里：nowy 只给阳性单数，如 nowy telefon（新手机）；nowe 给复数（不是一群男人时），如 nowe szczoteczki（新牙刷）、nowe studentki（新来的女学生们）；nowi 给一群男人（有男有女也算），如 nowi studenci（新来的学生们）。
      所以只要听出名词是复数，形容词就只在 nowe 和 nowi 之间选，nowy 直接划掉。
    rule: 名词是复数，就把 nowy 划掉。
    table:
      head: ["", "阳 · 单", "阴 · 单", "中 · 单", "复 · 不是男人", "复 · 男人"]
      rows:
        - ["主格", "nowy", "nowa", "==nowe==", "==nowe==", "nowi"]
    extra:
      - "**补一句**nowe 还管中性单数：nowe okno（新窗户）、nowe mieszkanie（新公寓）。所以听到 nowe 不一定是复数，要看后面的名词。"
      - "**do zębów**do 后面一律用生格：ząb（牙）→ zębów。szczoteczka 是 szczotka（刷子）的小称，szczoteczka do zębów 就是“刷牙齿的小刷子”——牙刷。"
    words:
      - {pl: nowy, zh: 新的, tag: 形容词}
      - {pl: szczoteczka do zębów, zh: 牙刷, tag: 阴, look: szczotka}
      - {pl: dostawać, zh: 得到、收到, tag: 未完成体}
      - {pl: ząb, zh: 牙, tag: 阳}
    see: ["007", "011"]

  - id: "007"
    date: 2026-10-01
    source: 多邻国
    ok: true
    point: noun.acc
    title: 单数宾格把 -a 换成 -ę，复数宾格跟复数主格一样
    pl: "Ty kupujesz ==szczoteczkę== do zębów."
    zh: 你在买一把牙刷。
    why: |
      szczoteczkę 是单数宾格：以 -a 结尾的阴性名词，单数宾格把 -a 换成 -ę。
      对比第 6 条：Dostajemy nowe szczoteczki——szczoteczki 是复数宾格。kupować（买）和 dostawać（得到）后面都用宾格。
    rule: 一把是 -ę；好几把，跟复数主格一样。
    examples:
      - {pl: "Kupuję ==kawę==.", zh: 我买咖啡。}
      - {pl: "Kupuję ==gąbki==.", zh: 我买（几块）海绵。}
    words:
