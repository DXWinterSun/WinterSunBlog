  - id: "013"
    section: vocab
    date: 2026-10-01
    source: 多邻国
    point: words.meaning
    title: Wigilia 是波兰的平安夜晚餐
    pl: "==Wigilia== jest w grudniu."
    zh: 平安夜晚餐在十二月。
    why: |
      Wigilia 指 12 月 24 日的平安夜，也指那天晚上全家一起吃的传统晚餐，是波兰人一年里最看重的一顿饭。
      名字来自拉丁语 vigilia（守夜）。传统上要等天上出现第一颗星才开席，桌上不放肉，还会多摆一副餐具，留给不期而至的客人。
    rule: 说平安夜，首字母大写：Wigilia。
