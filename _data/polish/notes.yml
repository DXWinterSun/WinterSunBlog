  - id: "014"
    date: 2026-10-01
    source: 顺带聊到
    lang: en
    point: en.vowel
    title: 美式 cut 和 cot：差在嘴张多大，不在长短
    ask: 英语的 /ʌ/ 和 /ɑ/ 到底差在哪？
    why: |
      美式英语里的 /ʌ/ 基本就是重读的 /ə/，韦氏词典把 cut 直接标成 /ˈkət/。
      区别主要在嘴张多大、舌头在哪。/ɑ/（hot、not、father）：下巴往下掉，嘴张到最大，舌头放低、靠后，接近普通话大张嘴的“啊”。/ʌ/（cut、bus、sun）：嘴只张一半，舌头在口腔正中间，整个人是放松的，像“的”字轻声时那个元音，只是重读出来。
      英式和美式分工不同：英式的 hot 是圆唇的 /ɒ/，所以 /ʌ/ 可以念得很开、很像“啊”；美式的 hot 不圆唇，已经占了“啊”的位置，/ʌ/ 只好往中间挪，靠向 /ə/。
    rule: cut 嘴半张、放松；cot 嘴大张、舌头往下沉。
    examples:
      - {pl: "cut, cot.", zh: 左边 /ʌ/，右边 /ɑ/}
      - {pl: "duck, dock.", zh: 同上}
      - {pl: "nut, not.", zh: 同上}
      - {pl: "color, collar.", zh: 同上}
    extra:
      - "**为什么中国人和波兰人都觉得难**英语有一大堆成对的松紧元音，波兰语和普通话都没有这种区分。波兰语除了 ą、ę 只有 a、e、i、o、u、y 六个元音，不分长短，也没有 bad 里的 /æ/ 和 bus 里的 /ʌ/；普通话同样没有。顺带一提，sun 和 son 本来就同音，都念 /sʌn/。"
    see: ["016"]

  - id: "015"
    date: 2026-10-01
    source: 顺带聊到
    lang: en
    point: en.consonant
    title: 英语词尾的 k 和 g，听的是前面的元音拖得长不长
    ask: 英语母语者是怎么分 k 和 g 的？
    why: |
      词首：主要靠送不送气。k 带一股明显的气，g 在词首常常不怎么振动，跟普通话的 k、g 正好对得上。s 后面的 k、p、t 不送气：sky 听起来像 s-gai，speak 像 s-beak，stop 像 s-dop。
      词尾：back 和 bag、dock 和 dog，母语者主要靠前面元音的长短来分。浊辅音前的元音更长，比例大约 3 比 2。这叫“清辅音前元音缩短”，母语者都是自然学会的。
      研究对比过：说普通话的人念这类词时，元音长短拉开的差距比英语母语者小得多，听的时候也没那么依赖这个线索（Crowther 和 Mann，1992）。
    rule: 分词尾 k 还是 g，别盯着那个辅音，听它前面的元音拖得长不长。
    examples:
      - {pl: "seat, seed.", zh: 右边那个的元音明显更长}
      - {pl: "bat, bad.", zh: 同上}
      - {pl: "back, bag.", zh: 同上}
    extra:
      - "**拖长音不会被听错**听的人判断的是相对比例，还有尾音爆破、上下文等好几条线索，所以拖长音表示强调、撒娇不会造成误会。"
    see: ["003"]

  - id: "016"
    date: 2026-10-01
    source: 顺带聊到
    lang: en
    point: en.accent
    title: 波兰人、斯拉夫人说英语：词尾变清、th 发不出、r 弹舌
    ask: 波兰人说英语有什么特点？别的斯拉夫人呢？
    why: |
      波兰口音：词尾浊音变清音，bad 念得像 bat，dog 像 dok——这正是波兰语自己的规矩（见第 2 条）。-ing 念成 -ink，going 听起来像 goink。th 发不出来，think 变成 tink 或 fink，this 变成 dis。不分长短元音，ship 和 sheep、full 和 fool 听起来一样，bad 和 bed 也容易混。r 是弹舌的；每个音节都念得很饱满，英语里该弱读的也念得清清楚楚。
      斯拉夫人的共同点：th 换成 t、d 或 f、v；r 都弹舌；元音不怎么弱化，节奏比英语平均；大部分斯拉夫语没有冠词，说英语时容易漏掉 a 和 the（保加利亚语和马其顿语例外，它们有定冠词）。
      不同点：俄语没有 w 这个音，wine 常被念成 vine，捷克语里的 w 也念 v；波兰人不太有这个问题，因为波兰语 ł 现在的念法就跟英语的 w 一样。重音位置也不同：波兰语大多在倒数第二个音节，捷克语几乎总在第一个，俄语不固定。捷克语本身分长短元音；俄语不重读的元音会变含糊，o 常念成接近 a 的音。
    rule: 波兰人说英语的毛病，大多是把波兰语的规矩带了过去；分得清 w 和 v，多亏了 ł。
    examples:
      - {pl: "bad, bat.", zh: 波兰口音里容易念成一样}
      - {pl: "ship, sheep.", zh: 同上}
      - {pl: "think, this.", zh: th 会换成 t、f 或 d}
    see: ["002", "014"]

  - id: "017"
    date: 2026-10-05
    source: 多邻国
    ok: true
    task: speak
    point: pron.personal
    also: [prep.case, verb.present, words.pair]
    title: “躺在我身上”＝leżeć na mnie：“我”跟在介词后面要变成 mnie
    ask: 这句话，何意味🤣
    pl: "Dlaczego ==na mnie== ==leżysz==?"
    en: "Why are you lying on me?"
    zh: 你干吗躺在我身上？
    why: |
      意思就是“你干吗趴在我身上？”多邻国就爱出这种没头没脑的句子，这句还是让那只熊说的，画面只能自己脑补。放在波兰人家里，这多半是对一只压着你不肯挪窝的猫说的。
      拆开看：dlaczego 为什么（第 2 条见过）· na 在……上面 · mnie 我（跟在介词后面的样子）· leżysz 你躺着（leżeć 的“你”那个样子）。
      na 后面跟方位格，是“在……上面”，待着不动；跟宾格，是“到……上面去”，有个动作：Kot leży na stole.（猫躺在桌上）Kot wskakuje na stół.（猫跳上桌子）。“我”这个词刚好两种都写成 mnie，所以这句里看不出区别。
      还有一个英语带来的坑：英语的 lie 既是“躺”又是“撒谎”，波兰语是两个词。leżeć 只是“躺着”这个姿势；撒谎是 kłamać。
    rule:
      - 躺着是 leżeć，撒谎是 kłamać，别被英语的 lie 带偏。
      - “我”跟在介词后面，一律用 mnie；只有“跟我一起”是 ze mną。
    table:
      - pl: [0]
        head: ["介词 + 我", "意思"]
        rows:
          - ["dla ==mnie==", "给我"]
          - ["do ==mnie==", "到我这儿来"]
          - ["na ==mnie==", "在我身上"]
          - ["o ==mnie==", "关于我"]
          - ["ze ==mną==", "跟我一起"]
      - head: ["", "leżeć 躺着"]
        rows:
          - ["我", "leżę"]
          - ["你", "==leżysz=="]
          - ["他 / 她", "leży"]
          - ["我们", "leżymy"]
          - ["你们", "leżycie"]
          - ["他们", "leżą"]
    examples:
      - {pl: "Kot leży na ==stole==.", zh: 猫躺在桌子上。（方位格）}
      - {pl: "Kot wskakuje na ==stół==.", zh: 猫跳上桌子。（宾格）}
      - {pl: "Dlaczego ==kłamiesz==?", zh: 你为什么撒谎？}
    words:
      - {pl: leżeć, zh: 躺着, tag: 未完成体}
      - {pl: kłamać, zh: 撒谎, tag: 未完成体}
      - {pl: stół, zh: 桌子, tag: 阳}
