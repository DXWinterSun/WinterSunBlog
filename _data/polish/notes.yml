    see: ["002"]

  - id: "018"
    date: 2026-10-05
    source: 多邻国
    ok: true
    task: listen
    point: syntax.exist
    also: [prep.case, noun.ins, syntax.neg]
    title: “某处有某物”就用 jest：地方 + jest + 东西，跟中文顺序一样
    ask: 这个是 there be 句型？
    pl: "Za domem ==jest== basen."
    en: "There is a swimming pool behind the house."
    zh: 房子后面有个游泳池。
    mine: "Za domem jest basen"
    why: |
      对，这就是波兰语的 there is。只是波兰语没有专门的 there，直接用 jest（是）：先说地方，再说 jest，最后说东西。
      顺序跟中文一模一样：房子后面 · 有 · 游泳池 → Za domem · jest · basen。比英语还顺。
      东西是好几个，jest 换成 są：Za domem są drzewa.（房子后面有几棵树。）要说“没有”，不是 nie jest，而是 nie ma，后面的东西还要换成属格，跟第 4 条一个道理：Za domem nie ma basenu.（房子后面没有游泳池。）
      za domem：za 表示“在……后面”时，后面跟工具格，dom 变成 domem，加 -em，跟第 10 条的 widelcem 一样。同一伙的还有 przed（前面）、nad（上面）、pod（下面）、między（中间），说“在哪儿”时都跟工具格。
    rule:
      - 地方 + jest + 东西＝某处有某物；好几个用 są，没有用 nie ma + 属格。
      - za、przed、nad、pod、między 说“在哪儿”时，都跟工具格。
    table:
      - pl: [1]
        head: ["", "波兰语", "意思"]
        rows:
          - ["有一个", "Za domem ==jest== basen.", "房子后面有个游泳池。"]
          - ["有好几个", "Za domem ==są== drzewa.", "房子后面有几棵树。"]
          - ["没有", "Za domem ==nie ma== ==basenu==.", "房子后面没有游泳池。"]
      - head: ["", "介词", "在……"]
        rows:
          - ["后面", "za", "za ==domem=="]
          - ["前面", "przed", "przed ==domem=="]
          - ["上面", "nad", "nad ==domem=="]
          - ["下面", "pod", "pod ==stołem=="]
          - ["中间", "między", "między ==domami=="]
    examples:
      - {pl: "Przed domem jest ==samochód==.", zh: 房子前面有一辆车。}
      - {pl: "W pokoju ==nie ma== ==okna==.", zh: 屋里没有窗户。}
    words:
      - {pl: basen, zh: 游泳池, tag: 阳}
      - {pl: dom, zh: 房子；家, tag: 阳}
      - {pl: drzewo, zh: 树, tag: 中}
      - {pl: samochód, zh: 汽车, tag: 阳}
      - {pl: pokój, zh: 房间, tag: 阳}
      - {pl: za, zh: 在……后面（跟工具格）, look: false}
    see: ["004", "010"]

  - id: "019"
    date: 2026-10-11
    source: 多邻国
    ok: true
    task: fill
    point: noun.loc
    also: [prep.case, pron.possess, adj.agree]
    title: o（关于）后面跟方位格：复数名词一律收 -ach，“我的”这类收 -ich / -ych
    ask: 这个 o（about）后面跟的什么格😵‍💫好多结尾是 ch
    pl: "Mówimy ==o== ==moich rodzicach==."
    en: "We are speaking about my parents."
    zh: 我们在聊我的父母。
    mine: "Mówimy ==o== moich rodzicach."
    why: |
      o 当“关于”讲的时候，后面跟方位格（第六格）。第 17 条那个 o mnie（关于我），用的就是它。
      你看到的那一串 ch，正是方位格复数的记号：名词收 -ach（rodzice 父母 → rodzicach），“我的”和形容词收 -ich 或 -ych（mój → moich，nowy → nowych）。好消息是，名词的 -ach 不分阳性、阴性、中性，复数一律这样，比单数省心得多；单数的方位格词尾五花八门（o mamie、o domu），得一个个记。
      方位格还有个怪脾气：它只跟在介词后面出现，从来不单独用。常带它的介词就五个：o 关于、w 在……里、na 在……上、przy 在……旁边、po 在……之后。
      小心一点：moich、nowych 这种 -ch 光看自己说明不了是哪个格，属格复数也长这样（nie mam nowych ==książek== 我没有新书）。要看后面的名词：名词是 -ach，才是方位格。
    rule:
      - o（关于）、w、na、przy、po → 方位格。
      - 方位格复数：名词 -ach，“我的”和形容词 -ich / -ych。
    table:
      - head: ["", "原来", "方位格复数"]
        rows:
          - ["我的", "mój", "==moich=="]
          - ["新的", "nowy", "==nowych=="]
          - ["父母", "rodzice", "==rodzicach=="]
          - ["书", "książki", "==książkach=="]
          - ["猫", "koty", "==kotach=="]
      - head: ["", "跟方位格的介词", "例子"]
        rows:
          - ["关于", "o", "o ==rodzicach=="]
          - ["在……里", "w", "w ==domu=="]
          - ["在……上", "na", "na ==stole=="]
          - ["在……旁边", "przy", "przy ==oknie=="]
          - ["在……之后", "po", "po ==lekcji=="]
    extra:
      - "**例外** o 后面偶尔跟宾格，那是“要什么、为了什么”的固定搭配：prosić o ==pomoc==（请求帮助）。当“关于”讲时，一律方位格。"
    examples:
      - {pl: "Myślę o ==moich kotach==.", zh: 我在想我的猫。}
      - {pl: "Mówimy o ==moim domu==.", zh: 我们在聊我家。（单数：moim、domu）}
      - {pl: "Rozmawiamy o ==mamie==.", zh: 我们在聊妈妈。}
    words:
      - {pl: mówić, zh: 说；讲, tag: 未完成体}
      - {pl: rodzice, zh: 父母, tag: 复数}
      - {pl: mój, zh: 我的}
      - {pl: rozmawiać, zh: 聊天；谈, tag: 未完成体}
      - {pl: myśleć, zh: 想, tag: 未完成体}
      - {pl: o, zh: 关于（跟方位格）, look: false}
    see: ["017", "018"]

  - id: "020"
    date: 2026-10-16
    source: 多邻国
    task: fill
    point: prep.case
    also: [noun.gen, noun.ins, noun.loc]
    title: 介词后面跟哪个格，是介词自己说了算：podczas 跟属格，przed 跟工具格
    ask: 这两个不都是在介词后面吗？为什么格不一样我真没招了🤣
    stuck: 填了原形 obiad，没跟着 podczas 变
    pl: "==Podczas== ==obiadu== pijemy wino."
    en: "During lunch we drink wine."
    zh: 吃午饭的时候，我们喝葡萄酒。
    mine: "Podczas ==obiad== pijemy wino."
    right: ["Podczas ==obiadu== pijemy wino."]
    why: |
      没招是正常的，因为这件事没有统一的道理：介词后面跟哪个格，不看它站在哪儿，看它是哪个介词。每个介词生来就带着一个格，就像每个名词生来就有阴阳性，只能连在一起记。
      你这两句正好是两个不同的介词：podczas（在……期间）跟属格，obiad 变 obiadu；przed（在……之前）跟工具格，obiad 变 obiadem。第 18 条的 za domem、第 19 条的 o rodzicach，也是各自的介词各管各的。
      好在常用的介词不多，而且会抱团：跟工具格的是 za、przed、nad、pod、między 这几个说方位的，再加一个 z（和……一起）；跟方位格的是 o、w、na、przy、po；剩下的大多数跟属格，这一伙人最多：do、od、bez、dla、u、podczas……
      最直观的办法是拿同一个 obiad 换介词，看它跟着变：饭前、饭间、饭后，三个介词三个样子，见下面第一张表。
    rule:
      - 介词说了算：记一个介词，就连它跟的格一起记。
      - 工具格：za、przed、nad、pod、między、z（和）；方位格：o、w、na、przy、po；属格最多：do、od、bez、dla、u、podczas。
    table:
      - pl: [1]
        head: ["", "同一个 obiad", "跟的格"]
        rows:
          - ["饭前", "przed ==obiadem==", "工具格"]
          - ["吃饭的时候", "podczas ==obiadu==", "属格"]
          - ["饭后", "po ==obiedzie==", "方位格"]
          - ["一直到午饭", "do ==obiadu==", "属格"]
          - ["午饭吃什么？", "Co jest na ==obiad==?", "宾格"]
      - pl: [1]
        head: ["跟的格", "介词", "意思"]
        rows:
          - ["属格", "do · od · bez · dla · u · podczas", "到 · 从 · 没有 · 给 · 在某人那儿 · 在……期间"]
          - ["工具格", "za · przed · nad · pod · między · z", "后 · 前 · 上 · 下 · 中间 · 和……一起"]
          - ["方位格", "o · w · na · przy · po", "关于 · 里 · 上 · 旁边 · 之后"]
          - ["宾格", "przez · na · w", "穿过 · 到……上去 · 到……里去"]
    extra:
      - "**两头跑** 有几个介词不止一个格：na、w 说“在哪儿”跟方位格，说“到哪儿去”跟宾格（第 17 条那只猫）；z 说“和……一起”跟工具格，说“从……出来”跟属格：kawa z ==mlekiem==（加奶的咖啡）、z ==domu==（从家里）。"
    examples:
      - {pl: "Podczas ==lekcji== piję wodę.", zh: 上课的时候我喝水。}
      - {pl: "Po ==obiedzie== pijemy kawę.", zh: 午饭后我们喝咖啡。}
      - {pl: "Mam prezent dla ==mamy==.", zh: 我有一份给妈妈的礼物。}
    words:
      - {pl: obiad, zh: 午饭（波兰人一天里最正经的那顿热饭）, tag: 阳}
      - {pl: wino, zh: 葡萄酒, tag: 中}
      - {pl: pić, zh: 喝, tag: 未完成体}
      - {pl: podczas, zh: 在……期间（跟属格）, look: false}
    see: ["018", "019", "021"]

  - id: "021"
    date: 2026-10-16
    source: 多邻国
    ok: true
    task: translate
    to: pl
    point: prep.case
    also: [noun.ins, syntax.neg, noun.gen]
    title: “饭前”是 przed obiadem：przed 说时间也跟工具格
    pl: "Nie piję ==kawy== ==przed obiadem==."
    en: "I do not drink coffee before lunch."
    zh: 我午饭前不喝咖啡。
    mine: "Nie piję kawy przed obiadem."
    why: |
      przed 第 18 条见过，那时说的是地方：przed domem（房子前面）。这里说的是时间“在……之前”，照样跟工具格：przed obiadem（饭前）。
      反过来，“饭后”换成 po，就跟方位格了：po obiedzie。obiad 变成 obiedzie，词中间也跟着变了样，这在方位格里很常见，先认个脸就行。
      句子里还有个属格 kawy，但那不归 przed 管，是前面的 nie 闹的：否定句里，宾语要从宾格换成属格（第 4 条）。肯定句是 Piję kawę.
    rule: przed 不管说地方还是时间，都跟工具格：przed domem、przed obiadem。
    table:
      head: ["", "肯定 · 宾格", "否定 · 属格"]
      rows:
        - ["喝咖啡", "Piję ==kawę==.", "Nie piję ==kawy==."]
    examples:
      - {pl: "Przed ==lekcją== piję kawę.", zh: 上课前我喝咖啡。}
      - {pl: "Myję ręce przed ==obiadem==.", zh: 我饭前洗手。}
    words:
      - {pl: kawa, zh: 咖啡, tag: 阴}
      - {pl: przed, zh: 在……之前；在……前面（跟工具格）, look: false}
    see: ["004", "018", "020"]

  - id: "022"
    section: vocab
    date: 2026-10-21
    source: 自己问的
    point: num.clock
    also: [noun.acc, noun.loc, prep.case]
    title: 十二个月、星期一到星期天：波兰语都小写开头
    ask: 可以把一年 12 个月还有一周 7 天的说法做一下吗？包括年、月、星期之类的基本说法
    pl: "Dziś jest ==środa==."
    en: "Today is Wednesday."
    zh: 今天星期三。
    why: |
      先说最省心的一条：月份和星期在波兰语里都小写开头，跟普通名词一样。英语要大写，别跟着写大。
      星期跟中文一样是数出来的：wtorek 来自“第二”，czwartek 是“第四”，piątek 是“第五”，正好对上星期二、四、五。剩下几个也好记：niedziela 是“不干活”的日子，poniedziałek 是“星期天之后”（po + niedziela），środa 是一周的“中间”，sobota 来自“安息日”。
      月份大多是看着大自然起的名字，不像英语那样从拉丁语来（只有 marzec、maj 跟 March、May 同源）：luty 是“严寒”，kwiecień 是“开花”，czerwiec 来自一种能做红染料的虫子，lipiec 是椴树开花，sierpień 是镰刀（割麦子），wrzesień 是石楠花开，październik 是打亚麻剩下的碎秆，listopad 是“叶子落下”，grudzień 是冻硬的土块。
      要说“在星期几”“在几月”，前面都加 w，但后面的格不一样：星期几用宾格，w środę（在星期三）——阳性的那四个变了跟没变一样，只有 -a 结尾的 środa、sobota、niedziela 把 -a 换成 -ę；几月用方位格，w październiku（在十月）。还是第 20 条那句话：格是介词和搭配说了算，这两个只能分开记。
    rule:
      - 月份、星期都小写开头。
      - 在星期几：w + 宾格（w środę）；在几月：w + 方位格（w październiku）。
    table:
      - pl: [1, 2]
        head: ["", "月份", "在这个月"]
        rows:
          - ["1 月", "styczeń", "w ==styczniu=="]
          - ["2 月", "luty", "w ==lutym=="]
          - ["3 月", "marzec", "w ==marcu=="]
          - ["4 月", "kwiecień", "w ==kwietniu=="]
          - ["5 月", "maj", "w ==maju=="]
          - ["6 月", "czerwiec", "w ==czerwcu=="]
          - ["7 月", "lipiec", "w ==lipcu=="]
          - ["8 月", "sierpień", "w ==sierpniu=="]
          - ["9 月", "wrzesień", "==we== ==wrześniu=="]
          - ["10 月", "październik", "w ==październiku=="]
          - ["11 月", "listopad", "w ==listopadzie=="]
          - ["12 月", "grudzień", "w ==grudniu=="]
      - pl: [1, 2]
        head: ["", "星期", "在星期几"]
        rows:
          - ["周一", "poniedziałek", "w poniedziałek"]
          - ["周二", "wtorek", "==we== wtorek"]
          - ["周三", "środa", "w ==środę=="]
          - ["周四", "czwartek", "w czwartek"]
          - ["周五", "piątek", "w piątek"]
          - ["周六", "sobota", "w ==sobotę=="]
          - ["周日", "niedziela", "w ==niedzielę=="]
      - head: ["", "波兰语", ""]
        pl: [1]
        rows:
          - ["年", "rok", "阳"]
          - ["月", "miesiąc", "阳"]
          - ["星期；周", "tydzień", "阳"]
          - ["天", "dzień", "阳"]
          - ["周末", "weekend", "阳"]
          - ["今天 · 明天 · 昨天", "dziś · jutro · wczoraj", ""]
          - ["春 · 夏 · 秋 · 冬", "wiosna · lato · jesień · zima", ""]
    extra:
      - "**we** w 碰上 w、f 开头的词，说成 we，好念一点：we wtorek、we wrześniu。"
      - "**变样的** rok 的复数借了 lato（夏天）的复数：dwa ==lata==（两年）；dzień 的复数是 ==dni==；tydzień 一变就成了 tygodni-：tydzień → ==tygodnia==。"
      - "**你本子上的** 星期三写成了 środę，那是“在星期三”（w środę）的样子，原形是 środa；czasu 是 czas（时间）的属格，因为前面是 Nie mam（没有），跟第 4 条一个道理；mie… 写完是 miesiąc（月）。其余都对。"
    examples:
      - {pl: "Do zobaczenia w ==piątek==.", zh: 星期五见。}
      - {pl: "Moje urodziny są w ==listopadzie==.", zh: 我的生日在十一月。}
