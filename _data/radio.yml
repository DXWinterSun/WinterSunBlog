# 📻 冬的电台 · Polski FM（2026-10-27）
#
# Winter 在 YouTube Music 上攒的公开歌单，搬到博客上当「电台」。这份是手写的设定：
#   · stations  每个台一条：id（网址里用）/ name（台名）/ cn（中文）/ url（歌单的分享链接，只要公开就行）
#   · gloss     歌名的英文小注（她 2026-10-27 要的：「小字注释一下英文的歌名，我也顺便学习了」）。
#               键 = 歌名小写、去掉括号里的版本说明；没写的歌页面上就只有原名，不会坏。新歌同步进来后记得补。
#   · fix       某首歌抓下来的歌名 / 艺人不对，在这里按视频 id 改（{id: {title: …, artist: …}}）。
# 曲目本身在 _data/radio_tracks.json，由 tools/songs/sync_radio.py 从歌单抓，别手改；
# 机器人每周一自动对一次（.github/workflows/radio-sync.yml），她说一声也随时能跑。

