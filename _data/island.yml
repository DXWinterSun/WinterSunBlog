residents:
  - id: trent
    name: "Trent"
    full: "Trent Burns"
    series: "The Same People"
    home: "河湾那辆拖车"
    region: "南边的河"
    zone: river
    x: 39.4
    y: 70.5
    icon: trailer
    text: |
      顺着岛南边那条河往下走，水声最响的那个河湾，就是 Trent 的家：一辆锈成黄褐色的拖车，门口铺一块花地毯，门里挂一道珠帘。天蓝色的福特停在旁边，后斗里还躺着那台割草机。

      河上有一座单车道的小桥。每个礼拜五傍晚，他照旧从桥上跳下去，岛上来看的人比镇上多。你永远打十分，他永远说裁判偏心。Zaphod 不打分，他只在岸上喊：“过分了！”

      拖车里，床头那颗彩色灯球一开，满屋子转着小光点。窗台上立着那只玻璃罐，罐子已经很久没往外拿过钱了。罐子旁边，叠着一双新袜子。

      你去他家不用敲门。他会从珠帘后头探出半个身子，头发还湿着：“来了？坐。”然后去柜子里拿杯子。拿出来的永远是带马的那一只，他家最好的那一只。
  - id: zaphod
    name: "Zaphod"
    full: "Zaphod Beeblebrox"
    series: "Don't Panic, Baby Doll"
    home: "半截泡在海里的「黄金之心」号"
    region: "东边的沙滩"
    zone: east
    x: 92.4
    y: 55.5
    icon: ship
    text: |
      Zaphod 没有房子，他有一艘飞船。

      「黄金之心」号斜斜地扎在东边的沙滩上，船头一半泡在海里，他管这叫海景房。舱门上贴着一张手写的「总统办公室」，字迹有两种，一种往左歪，一种往右歪。

      你一走近，舱门就自己滑开，Eddie 的声音从四面八方涌出来：“欢迎回家！今天的潮水好极了，总统先生的心情也好极了！”Marvin 坐在沙滩上，背对着海，长长叹了一口气：“又来了。”

      他睡最靠里那间有大舷窗的房。窗外照样是满满一窗星河，是你当年悄悄替他备下的，他到现在也不知道。梳妆台上一把梳子，旁边摆着三根发绳，一只手一根。

      驾驶舱里探出两颗脑袋。“baby doll！”另一颗接上：“你来得正好，我们正吵今天是左边压还是右边压。”
  - id: sambell
    name: "Five & Six"
    full: "Sam Bell（Five 和 Six）"
    series: "Everybody's Home"
    home: "山顶那座看得见月亮的房子"
    region: "北边的山顶"
    zone: snow
    x: 50
    y: 16.2
    icon: twostory
    text: |
      岛北边最高的那座山顶上，住着两个 Sam。

      房子是木头的，两层，门牌上刻着 Sarang。站在门口一抬头，正好看得见月亮。他们挑这儿，就是因为看得见，又再也不用回去。

      门框内侧画满了马克笔的小笑脸，一天一个，是 Five 画的，从“为自己活的第一天”一路画上来，已经画到了门框顶，得踩着凳子画。Six 嘴上说幼稚，可哪天 Five 忘了，第二天一早，门框上准有一个歪歪扭扭的，笔迹不是 Five 的。

      门铃是一块小屏幕，有人来，上面就亮起一张笑脸。

      厨房里一张桌子，三把椅子。中间那把是你的。
  - id: leonard
    name: "Leonard"
    full: "Leonard Shelby"
    series: "You Are My Fact"
    home: "离浪最近的那一栋"
    region: "西边的海滩"
    zone: westbeach
    x: 12
    y: 77.5
    icon: cottage
    text: |
      Leonard 住在西边的海滩上，离浪最近的那一栋。他说海也只活在此刻，跟他一样。

      屋里每样东西上都贴着便条。门背后那张是你写的，他认得那个笔迹：You live here now. You're safe. She's here. —— W

      走廊整面墙都是拍立得，一张挨一张。最中间那张是那天傍晚的你，没开闪光灯，你没看镜头，边缘过曝成一团温柔的金。

      岛上的邻居都知道他的事。Trent 每回路过都重新报一遍名字，从来不嫌烦；Five 教会了他，在每个新认识的人的照片背面画一个小笑脸。那只猫趴在窗台上晒太阳。

      你推门进去，他从书桌前抬起头，往后缩了半寸，手探向内袋。

      你说：“我叫 Winter。别怕，我一直都在。”
  - id: youngsam
    name: "Young Sam"
    full: "Young Sam"
    series: "Fog City"
    home: "小镇正中间那座小剧场"
    region: "小镇 · 正中间"
    zone: town
    x: 53.1
    y: 47.5
    icon: theater
    text: |
      岛中间有一个小镇，小镇正中间是一座小剧场。每天下午三点，雾准时从海上翻过来，只罩住剧场门前那一条街。他管这叫“关灯”。

      他就住在后台。化妆镜的框上别着那副眼镜，压得七歪八扭；镜子边上还别着一盘磁带，A 面三十分钟，前二十九分钟全是清嗓子和笑场。

      台上挂的那块天幕是你画的海。左下角溅了几点不该有的蓝：他第一次见你，差点把一整桶海泼进雾里，到底还是溅出来几滴。

      岛上谁要排戏、谁要对台词，都来他这儿。他就戴上眼镜，坐进观众席，一张脸一张脸地看过去。别人看的是邻居，他看的是自己以前的样子，和以后的样子。

      你一进门，他头都不回：“Ocean，过来，坐我旁边。这场你得看。”
  - id: gary
    name: "Gary"
    full: "Gary O'Hara"
    series: "Interoffice"
    home: "邮局楼上"
    region: "小镇 · 邮局"
    zone: town
    x: 46.6
    y: 54.5
    icon: post
    text: |
      小镇的邮局归 Gary 管。一楼是收发室，墙上一整排木格子，一格贴一户的名字。岛上六十来位，他一个都没念错过，连 Krzysztof 都念得出来。

      岛上的信都走他的手：牛皮纸的内部信封，红线绳绕两圈，面单一格一格往下写。岛主的信箱也是他每天去开，谁往里塞了给你的字条，他第一个知道，从来不说。

      他住在楼上。抽屉里永远放着一块巧克力甜甜圈，切好了，没动：大的那半等你来，小的那半，他看着你吃完才吃。他脖子上那条金十字架，到了岛上也没摘过。

      你推门进来，他从格子后面抬起头，叫你的名字。你的姓，他念得一个音都不差。
  - id: kris
    name: "Kris"
    full: "Krzysztof “Kris” Wilk"
    series: "The Cardinal"
    home: "整夜亮着红灯的小酒吧"
    region: "小镇 · 街尽头"
    zone: town
    x: 60.6
    y: 54.5
    icon: bar
    text: |
      小镇最靠海的那条街尽头，有一家只在夜里开的小酒吧。门口一盏红灯，天黑亮起来，天亮才灭，招牌上写着 The Cardinal。

      Kris 站在吧台后面，话不多，手很稳。岛上谁睡不着，就往这儿走。Leonard 每回进门都像头一回来，Kris 每回都重新给他倒一杯，从来不说“你来过”。

      他住在酒吧楼上。炉子上永远坐着一壶咖啡，窗台上搁着那把口琴。门口挂一块小黑板，他每天在上面写一句波兰语给你，今天写的是 krok po kroku，一步一步来。

      你在吧台前坐下，他把杯子推过来，没问你要喝什么。

      “Kotku，”他说，“今天学到哪儿了？”
  - id: rob
    name: "Rob"
    full: "Rob Cove"
    series: "Everything in Transit"
    home: "后院永远在开派对的那栋房子"
    region: "南边的河口"
    zone: river
    x: 58.1
    y: 92.3
    icon: beach
    text: |
      顺着南边那条河一直走到入海口，沙滩上有一栋破破烂烂的大房子，门口歪歪扭扭钉着一块牌子：El Rancho。

      岛上的派对都在这儿开。后院一年到头挂着一串彩灯，车库是乐队排练的地方，鼓面上贴着两个字母：CD。外人都以为是 Certified Dropouts，只有你俩知道是哪两个姓。

      那件洗到发灰、自己剪了袖子的无袖卫衣，挂在门口的衣钩上，谁都不许碰，你除外。

      楼上有一扇朝海的窗，窗台宽得能坐下一个人，那是你的位置。他还是老样子，守着门。派对开到一半你找不着他，他准是靠在门框上，手里一罐啤酒，眼睛看着窗台上的你。
  - id: matty
    name: "Matty"
    full: "Matty Rzeznik"
    series: "Oh, May"
    home: "桥头那间带消防梯的修车铺"
    region: "南边的河 · 铁桥桥头"
    zone: river
    x: 55.0
    y: 82.3
    icon: twostory
    text: |
      顺着南边那条河往上走，河上架着一座铁桥。桥头有一间修车铺，车库门永远拉起一半，楼上是他住的屋子。窗外挂着一架锈红的消防梯，最底下那截铁梯，能一路滑到地上。

      岛的南边一年到头是夏天，正合他的意。白天他躺在带轮子的垫板上钻车底，T 恤卷到肋骨，满手机油；天一黑就抱着吉他坐到消防梯上唱，嗓子唱到高处劈开一道缝，他也不去补。Rob 那辆漏油的破车，现在归他管。

      工作台上扳手、机油罐、火花塞摆了一排，中间立着一小瓶指甲油，红的。那是你的，从垃圾桶里捡回来过一回的那瓶。他右手那根指甲永远是红的，只有你涂，掉了一块他也不许别人碰。

      你从桥上走下来，垫板哗的一声，他从一辆车底下滑出来，仰面躺着，没起来。

      “看够了说一声，May。”他把右手举起来晃了晃，指甲缺了一角，“掉了。你不来，谁都不许碰。”
  - id: jerry
    name: "Jerry"
    full: "Jerry"
    series: "I Missed You on Purpose"
    home: "镇口那家「LARK MOTORS」车行"
    region: "小镇 · 镇口车行"
    zone: town
    x: 35.0
    y: 52.0
    icon: shop
    text: |
      进镇子那条路的路口，第一眼看见的就是他的车行：一片空地停满了二手车，挡风玻璃上贴着价签，小办公室门口立着一块白底黑字的招牌，「LARK MOTORS」。

      他还是那个样子，嘴里永远含着点甜的，跟人讲一辆车哪儿有毛病，口气像在聊今天的天气。卖车他一般般，可他是真喜欢。Francis Munch 有空就来车行坐坐，两个人坐在一辆旧车的引擎盖上，比谁更不失手，比到最后都说：除了那一回。

      他的钥匙串沉甸甸一大把，全是车钥匙，中间混着一把黄铜小钥匙，哪辆车也开不了。那是八四年平安夜你摘下来给他的，那扇门在很远的地方，锁也早换了。你问过他一回，这把开什么。他说：“那不是钥匙。……那是你给我的。”

      你走过去，他正倚在那辆绿车上。看见你，他嘴角那点天生的上翘又深了一点。

      “precious。”他把钥匙串套在手指上转了一圈，“试驾吗？这回不教你怎么走，就兜一圈。”
  - id: chuck
    name: "Chuck"
    full: "Chuck Barris"
    series: "Off the Air"
    home: "海边那栋「ON AIR」灯从来不亮的房子"
    region: "东边的沙滩和悬崖 · 沙滩上"
    zone: east
    x: 76.6
    y: 70.0
    icon: villa
    text: |
      东边的沙滩上，有一栋六十年代样式的矮房子，一整面墙都是玻璃，正对着海。书房门上装着一盏红色的「ON AIR」灯，插头拔了，从来不亮。他说，在家不播。

      岛上谁要办点热闹，都去请他：才艺秀、相亲游戏、新婚夫妻问答，他张口就来，哪个环节都编得出来。客厅墙上挂着一面真锣，他在外头敲得震天响，在家一下都没敲过。Zaphod 到现在还记着生日那晚挨的那一锣。

      他家里没有打火机，也没有一盒他自己的火柴。门口小碟子里躺着一盒摄影棚的火柴，八号棚茶水间白拿的那种，十美分都不值，是你的。整栋房子就这一样能点火的东西。他点烟，还是伸手跟你要。

      你推门进来，他正窝在沙发上，提词卡摊了一茶几，嘴里叼着一根没点的烟。他没起身，只冲门口那只小碟子抬了抬下巴。

      “Baby，”他说，“借个火。”
  - id: reston
    name: "Reston"
    full: "Jim Reston"
    mf: reston
    home: "悬崖半腰那间堆满纸箱的屋子"
    region: "东边的沙滩和悬崖 · 悬崖半腰"
    zone: east
    x: 90.0
    y: 36.4
    icon: cottage
    text: |
      东边的悬崖，半腰上嵌着一间屋子，窗子对着海。屋里一半是纸箱，一箱一箱码到天花板，全是旧档案；另一半是书，横着竖着塞满了墙。

      他还是长发垂到衣领，灯芯绒外套的袖口磨得起了毛，一坐下就是几个钟头，黄稿纸上画满潦草的笔记和愤怒的下划线。岛上谁说了一句站不住的话，他就慢悠悠推一下眼镜，问一句：出处呢？

      台灯底下压着一本黄稿纸，崭新的，一个字都没写。别的本子他随手抓来就用，这一本谁也不许动。他说那是留给你的，等你的故事开头。

      你把一杯咖啡放在他手边。他没抬头，先伸手握住了你的手，握得很紧，然后才抬起眼睛看你。

      “那一本还空着，”他说，“我在档案馆的地下室里翻过好几个礼拜的箱子。我等得起。”
  - id: doug
    name: "Doug"
    full: "Douglas Varney"
    series: "Better Living Through You"
    home: "主街上那家姓 Varney 的药房"
    region: "小镇 · 药房"
    zone: town
    x: 65.6
    y: 49.5
    icon: shop
    text: |
      小镇主街上有一家药房，门楣上一块烫金的招牌：「VARNEY'S」。早上八点开门，傍晚落锁，一天都不差。

      他还是穿着那件洗得发白的白大褂，一站到柜台后面，整个人就稳了。岛上谁头疼脑热都来找他，他配药一粒不差，叮嘱得细，还非要大家排好队。店后头的小院里养着一只小金毛，叫 Bishop，他一喊“Bishop，坐下”，它就一屁股坐进水盆里。

      柜台后头的墙上，并排挂着两张执照。左边那张是他的，擦了十几年，锃亮；右边那张是你的。你搁下它好些年了，是他挂上去的，跟自己那张挂得一样高。

      岛上叫你 ma'am 的有两个人，他和 Silas。两个人在主街上碰见，各自碰一碰帽檐，谁也不改口。

      门铃一响，他从眼镜上头抬起眼，稳稳地看住你，一点也不躲。

      “太太。”他说，“Bishop 今天又坐进水盆里了，您管管它。”
  - id: craig
    name: "Craig"
    full: "Craig"
    mf: craig
    home: "住宅区里冰箱门最满的那一栋"
    region: "小镇边上的住宅区"
    zone: suburb
    x: 38.1
    y: 45.9
    icon: twostory
    text: |
      小镇边上的住宅区，一条安静的街，一栋带院子的两层房子。书房的灯常常亮到很晚，桌上摞着一沓一沓的离婚卷宗。

      他还是靠替人了结婚姻吃饭，嘴还是那么毒，看不顺眼的先损一句。可谁家吵到要找律师，他听完了，总要先问一句：你们当初为什么开始的？

      隔几天 Watson 会穿着短裤凉鞋晃过来，两个律师坐在门廊台阶上喝啤酒，谁也不谈案子。

      厨房那台冰箱，门上贴满了 Annika 从小到大的照片、成绩单、她小时候画的歪歪扭扭的画。正中间空着一块，磁铁已经吸好了，底下什么都没压。

      你站在冰箱前头看那块空，他靠在门框上，挑了挑眉。

      “那块是留给你的。”他说，“我谨慎了一辈子，头一回先把位置腾出来。别让我等到她大学毕业。”
  - id: donverdean
    name: "Don"
    full: "Don Verdean"
